<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#58CC02">
    <title>NomenDuo v2 — Nomenclature</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        :root {
            --green: #58CC02;
            --green-d: #46A302;
            --green-l: #D7FFB8;
            --red: #FF4B4B;
            --red-d: #E53935;
            --blue: #1CB0F6;
            --blue-d: #1899D6;
            --gold: #FFC800;
            --gold-d: #E5A400;
            --purple: #CE82FF;
            --purple-d: #A568CC;
            --ink: #3C3C3C;
            --muted: #AFAFAF;
            --line: #E5E5E5;
            --bg: #FFF;
            --bg-soft: #F7F7F7;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            background: #fff;
            color: var(--ink);
            font-weight: 600;
            font-size: 15px;
            line-height: 1.4;
            -webkit-font-smoothing: antialiased;
        }

        button {
            font-family: inherit;
            cursor: pointer;
            border: none;
            background: none;
            color: inherit;
            font-weight: inherit;
        }

        #app {
            max-width: 500px;
            height: 100dvh;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            background: #fff;
            overflow: hidden;
        }

        /* TOPBAR */
        .topbar {
            flex: none;
            padding: 14px 16px 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: #fff;
            z-index: 5;
        }

        .close-x {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: var(--muted);
            font-weight: 900;
        }

        .close-x:active {
            background: var(--bg-soft);
        }

        .progress-track {
            flex: 1;
            height: 14px;
            background: var(--line);
            border-radius: 99px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--green);
            border-radius: 99px;
            transition: width .5s cubic-bezier(.4, 0, .2, 1);
            position: relative;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            left: 8px;
            right: 8px;
            top: 3px;
            height: 4px;
            border-radius: 99px;
            background: rgba(255, 255, 255, .35);
        }

        .hearts {
            display: flex;
            align-items: center;
            gap: 4px;
            color: var(--red);
            font-weight: 900;
            font-size: 16px;
        }

        /* HOME */
        .home {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 40px;
        }

        .home-hero {
            padding: 24px 20px 12px;
            background: linear-gradient(180deg, #E8FFD0 0%, transparent 100%);
        }

        .home-hero h1 {
            font-size: 30px;
            font-weight: 900;
            letter-spacing: -.7px;
        }

        .home-hero h1 .accent {
            color: var(--green);
        }

        .home-hero p {
            color: var(--muted);
            font-weight: 700;
            font-size: 12px;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: .08em;
        }

        .worlds {
            padding: 22px 20px 0;
            display: flex;
            flex-direction: column;
            gap: 26px;
        }

        .world-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }

        .world-title .badge {
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 13px;
            letter-spacing: .1em;
            color: #fff;
            min-width: 34px;
            text-align: center;
        }

        .world-title h2 {
            font-size: 17px;
            font-weight: 900;
            letter-spacing: -.3px;
        }

        .world-title .count {
            margin-left: auto;
            font-size: 12px;
            color: var(--muted);
            font-weight: 800;
        }

        .world-subtitle {
            font-size: 12px;
            color: var(--muted);
            font-weight: 700;
            margin-bottom: 14px;
            line-height: 1.35;
        }

        .levels {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .level-row {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-soft);
            border-radius: 16px;
            padding: 12px 14px;
            border: 2px solid transparent;
            text-align: left;
            width: 100%;
            transition: transform .1s;
        }

        .level-row:active {
            transform: scale(.98);
        }

        .level-row.done {
            background: var(--green-l);
            border-color: var(--green);
        }

        .level-badge {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            flex: none;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            border: 2px solid var(--line);
            font-size: 17px;
            font-weight: 900;
            color: var(--ink);
            box-shadow: 0 3px 0 var(--line);
        }

        .level-row.done .level-badge {
            background: var(--green);
            border-color: var(--green-d);
            color: #fff;
            box-shadow: 0 3px 0 var(--green-d);
        }

        .level-meta {
            flex: 1;
            min-width: 0;
        }

        .level-meta h3 {
            font-size: 14px;
            font-weight: 900;
            letter-spacing: -.2px;
            font-family: Georgia, serif;
        }

        .level-meta p {
            font-size: 11.5px;
            color: var(--muted);
            font-weight: 700;
            margin-top: 2px;
        }

        .level-stars {
            color: var(--gold);
            font-size: 15px;
            letter-spacing: 1px;
        }

        .level-arrow {
            font-size: 18px;
            color: var(--muted);
            font-weight: 900;
        }

        /* PLAY */
        .play {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100dvh;
            overflow: hidden;
        }

        .play-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 0 0 8px;
        }

        .q-block {
            padding: 4px 20px 8px;
        }

        .q-block h2 {
            font-size: 21px;
            font-weight: 900;
            letter-spacing: -.4px;
            line-height: 1.25;
        }

        .q-block p {
            font-size: 13.5px;
            color: var(--muted);
            font-weight: 700;
            margin-top: 6px;
            line-height: 1.5;
        }

        .stage {
            flex: 1;
            min-height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            position: relative;
        }

        .stage svg {
            width: 100%;
            height: 100%;
            max-height: 100%;
            overflow: visible;
        }

        .answer {
            padding: 8px 20px 12px;
        }

        .play-footer {
            flex: none;
            padding: 14px 20px calc(18px + env(safe-area-inset-bottom));
            background: #fff;
            border-top: 2px solid var(--line);
        }

        /* BUTTONS */
        .btn-3d {
            display: block;
            width: 100%;
            padding: 16px 20px;
            background: var(--green);
            border-bottom: 5px solid var(--green-d);
            border-radius: 16px;
            color: #fff;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: .08em;
            font-size: 15px;
            transition: transform .08s, border-bottom-width .08s;
            text-align: center;
        }

        .btn-3d:active {
            transform: translateY(5px);
            border-bottom-width: 0;
        }

        .btn-3d:disabled {
            background: var(--line);
            border-bottom-color: #D4D4D4;
            color: var(--muted);
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #fff;
            color: var(--ink);
            border-bottom-color: rgba(0, 0, 0, .15);
        }

        .btn-red {
            background: var(--red);
            border-bottom-color: var(--red-d);
            color: #fff;
        }

        /* FUNC STEP */
        .func-duel {
            display: flex;
            align-items: stretch;
            gap: 8px;
        }

        .func-duel .func-btn {
            flex: 1;
        }

        .func-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .func-btn {
            padding: 18px 12px;
            /* Un peu plus haut pour compenser l'absence d'emoji */
            background: #fff;
            border: 2px solid var(--line);
            border-bottom: 4px solid var(--line);
            border-radius: 14px;
            text-align: center;
            /* Centré au lieu de left */
            transition: all .12s;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .func-btn:active {
            transform: translateY(2px);
            border-bottom-width: 2px;
        }

        .func-btn.selected {
            border-color: var(--blue);
            border-bottom-color: var(--blue-d);
            background: #E8F6FE;
        }

        .func-btn.selected .fname {
            color: var(--blue-d);
        }

        .func-btn .fname {
            font-size: 14px;
            font-weight: 900;
            color: var(--ink);
        }

        .func-btn .fsuffix {
            font-family: Georgia, serif;
            font-size: 11.5px;
            font-weight: 800;
            color: var(--muted);
            font-style: italic;
        }

        .func-btn .fpicto {
            font-size: 22px;
            margin-bottom: 2px;
        }

        .vs-badge {
            align-self: center;
            font-size: 14px;
            font-weight: 900;
            color: var(--red);
            background: #fff;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            flex: none;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid var(--red);
            box-shadow: 0 3px 0 rgba(0, 0, 0, .08);
        }

        /* NAME STEP */
        .name-slot {
            min-height: 54px;
            border: 2px dashed var(--line);
            border-radius: 14px;
            padding: 10px 14px;
            margin-bottom: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
            font-family: Georgia, serif;
            font-size: 18px;
            font-weight: 900;
            color: var(--ink);
        }

        .name-slot.empty::before {
            content: 'Touche les morceaux pour assembler le nom';
            font-family: inherit;
            font-size: 12px;
            font-weight: 700;
            color: var(--muted);
            font-style: italic;
        }

        .name-slot .piece {
            background: var(--green);
            color: #fff;
            padding: 5px 10px;
            border-radius: 9px;
            font-size: 15px;
            font-weight: 900;
            font-family: Georgia, serif;
            cursor: pointer;
            box-shadow: 0 3px 0 var(--green-d);
            animation: popIn .22s cubic-bezier(.34, 1.4, .5, 1);
        }

        @keyframes popIn {
            from {
                transform: scale(.6);
                opacity: 0;
            }
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        .chip {
            padding: 10px 15px;
            background: #fff;
            border: 2px solid var(--line);
            border-radius: 12px;
            font-family: Georgia, serif;
            font-size: 15px;
            font-weight: 900;
            color: var(--ink);
            box-shadow: 0 3px 0 var(--line);
            transition: transform .1s;
        }

        .chip:active {
            transform: translateY(3px);
            box-shadow: none;
        }

        .chip.used {
            opacity: .25;
            pointer-events: none;
        }

        /* SHEET */
        .sheet-wrap {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(60, 60, 60, .5);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            animation: fadeIn .2s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
        }

        .sheet {
            width: 100%;
            max-width: 500px;
            padding: 26px 22px calc(22px + env(safe-area-inset-bottom));
            border-radius: 26px 26px 0 0;
            animation: slideUp .3s cubic-bezier(.4, 0, .2, 1);
        }

        .sheet.good {
            background: #E8FFD0;
            color: var(--green-d);
        }

        .sheet.bad {
            background: #FFEBEC;
            color: var(--red-d);
        }

        .sheet.neutral {
            background: #fff;
            color: var(--ink);
        }

        @keyframes slideUp {
            from {
                transform: translateY(60px);
                opacity: 0;
            }
        }

        .sheet-icon {
            width: 66px;
            height: 66px;
            border-radius: 50%;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 12px;
        }

        .sheet.good .sheet-icon {
            color: var(--green);
        }

        .sheet.bad .sheet-icon {
            color: var(--red);
        }

        .sheet-title {
            text-align: center;
            font-size: 20px;
            font-weight: 900;
            margin-bottom: 6px;
        }

        .sheet-text {
            text-align: center;
            font-size: 14px;
            font-weight: 700;
            line-height: 1.5;
            margin-bottom: 4px;
        }

        .sheet-text b {
            font-weight: 900;
            color: inherit;
        }

        .diag {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 99px;
            background: #fff;
            color: var(--red-d);
            font-size: 10.5px;
            font-weight: 900;
            letter-spacing: .08em;
            text-transform: uppercase;
        }

        .sheet-actions {
            margin-top: 18px;
        }

        .sheet.good .sheet-actions .btn-3d {
            background: var(--green);
            border-bottom-color: var(--green-d);
            color: #fff;
        }

        .sheet.bad .sheet-actions .btn-3d {
            background: var(--red);
            border-bottom-color: var(--red-d);
            color: #fff;
        }

        .sheet.neutral .sheet-actions .btn-3d {
            background: #fff;
            border-bottom-color: rgba(0, 0, 0, .15);
            color: var(--ink);
        }

        .cmp-wrap {
            display: flex;
            align-items: stretch;
            gap: 8px;
            margin: 14px 0 4px;
        }

        .cmp-box {
            flex: 1;
            border-radius: 14px;
            padding: 10px 12px;
            background: rgba(255, 255, 255, .75);
            text-align: center;
        }

        .cmp-label {
            font-size: 10px;
            font-weight: 900;
            letter-spacing: .12em;
            text-transform: uppercase;
            opacity: .65;
            margin-bottom: 5px;
        }

        .cmp-text {
            font-family: Georgia, serif;
            font-size: 15px;
            font-weight: 900;
            line-height: 1.25;
            word-break: break-word;
        }

        .cmp-wrong .cmp-text {
            color: #E53935;
            text-decoration: line-through;
            text-decoration-thickness: 2px;
            text-decoration-color: rgba(229, 57, 53, .4);
        }

        .cmp-good .cmp-text {
            color: #46A302;
        }

        .cmp-vs {
            align-self: center;
            font-size: 18px;
            font-weight: 900;
            color: #E53935;
            opacity: .6;
        }

        /* VICTORY / DEFEAT */
        .fs-screen {
            position: fixed;
            inset: 0;
            height: 100dvh;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: calc(16px + env(safe-area-inset-top, 0px)) 20px calc(24px + env(safe-area-inset-bottom, 0px));
            animation: fadeIn .4s;
        }

        .fs-screen.fs-win {
            background: linear-gradient(180deg, #58CC02 0%, #46A302 100%);
        }

        .fs-screen.fs-lose {
            background: linear-gradient(180deg, #FF4B4B 0%, #C62828 100%);
        }

        .fs-content {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin: auto 0;
        }

        .fs-hero {
            font-size: 100px;
            line-height: 1;
            margin-bottom: 16px;
            animation: heroIn .6s cubic-bezier(.34, 1.56, .64, 1) both;
        }

        @keyframes heroIn {
            from {
                transform: scale(.3) rotate(-15deg);
                opacity: 0;
            }
        }

        .fs-title {
            font-size: 28px;
            font-weight: 900;
            color: #fff;
            letter-spacing: -.4px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, .2);
            margin-bottom: 8px;
        }

        .fs-text {
            font-size: 16px;
            color: rgba(255, 255, 255, .92);
            font-weight: 700;
            line-height: 1.4;
            max-width: 90%;
            margin-bottom: 8px;
        }

        .fs-text b {
            color: #fff;
            font-weight: 900;
            font-family: Georgia, serif;
            font-size: 18px;
        }

        .star-row {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 12px 0 4px;
            font-size: 44px;
        }

        .star-row .st {
            display: inline-block;
            color: rgba(0, 0, 0, .22);
            transform: scale(.3);
            opacity: 0;
            animation: starIn .7s cubic-bezier(.34, 1.8, .5, 1) forwards;
        }

        .star-row .st.on {
            color: #FFC800;
            text-shadow: 0 3px 0 #E5A400;
        }

        @keyframes starIn {
            0% {
                transform: scale(0) rotate(-120deg);
                opacity: 0;
            }

            60% {
                transform: scale(1.5) rotate(15deg);
                opacity: 1;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .fs-footer {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 500px;
            display: flex;
            gap: 12px;
        }

        .fs-btn-main {
            background: #fff !important;
            border-bottom: 5px solid #E5E5E5 !important;
            font-weight: 900;
            color: #46A302 !important;
        }

        .fs-btn-sec {
            background: rgba(255, 255, 255, .2) !important;
            border-bottom: 5px solid rgba(0, 0, 0, .18) !important;
            color: #fff !important;
            backdrop-filter: blur(8px);
        }

        /* MISC */
        .toast {
            position: fixed;
            left: 50%;
            bottom: 110px;
            transform: translateX(-50%);
            max-width: 88%;
            z-index: 200;
            background: #3C3C3C;
            color: #fff;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 800;
            line-height: 1.4;
            text-align: center;
            box-shadow: 0 6px 18px rgba(0, 0, 0, .25);
            animation: popIn .25s cubic-bezier(.34, 1.4, .5, 1);
        }

        .app-shake {
            animation: shakeX .45s;
        }

        @keyframes shakeX {

            0%,
            100% {
                transform: translateX(0);
            }

            15% {
                transform: translateX(-10px);
            }

            30% {
                transform: translateX(9px);
            }

            45% {
                transform: translateX(-7px);
            }

            60% {
                transform: translateX(5px);
            }

            75% {
                transform: translateX(-3px);
            }
        }

        .svg-click-ripple {
            fill: none;
            stroke: #1CB0F6;
            animation: svgRippleAnim .45s ease-out forwards;
            pointer-events: none;
        }

        @keyframes svgRippleAnim {
            0% {
                r: 12px;
                stroke-width: 6px;
                opacity: 1;
            }

            100% {
                r: 42px;
                stroke-width: 0px;
                opacity: 0;
            }
        }
    </style>
</head>

<body>
    <div id="app"></div>
    <script>
        /* ==========================================================================
           BASE DE DONNÉES — NOMENCLATURE ORGANIQUE (v2.1 — correctifs audit)
           117 molécules · 13 mondes · conventions IUPAC du cours (prof)
           --------------------------------------------------------------------------
           Règles encodées (fil rouge : H ou pas H sur le carbone du C=O) :
           - C(=O)H  → -al        | C(=O)OH → acide ...-oïque | C(=O)Cl → chlorure de ...-oyle
           - C(=O)O-R' → ...-oate de ...-yle | C(=O)N → -amide | C≡N → -nitrile (C compté)
           - C=O sans H → -one (préfixe oxo-) | C-OH → -ol (préfixe hydroxy-, NE PAS numéroter le OH !)
           - -NH₂ → -amine (suffixe) / amino- (préfixe) | -NO₂ → nitro- (jamais suffixe)
           - R-O-R' → alkoxy- (méthoxy, éthoxy...) | -X → fluoro/chloro/bromo/iodo-
           - Pas de tiret entre préfixe et chaîne : acide 3-éthylpent-4-ènoïque
           - Insaturations : -èn- devant -ol/-one/-oïque/-oate/-oyle ; -én- devant -al/-amide/-amine/-yn
           - Substituants complexes entre parenthèses avec leur propre numérotation
           - TOKENS (audit v2.1) : '-<chiffre>' = tiret réel ('-2-ol') ; '-<lettre>' = colle sans tiret ('-al','-oïque','-oyle')
           - TOKENS à mots séparés portent leur espace : 'acide ', 'chlorure de ', " d'éthyle" ; nitrile = ['hexane','nitrile']
           ========================================================================== */
        const MOLECULES = {
            /* NIVEAU 2 : ALCOOLS & CÉTONES */
            pentan2ol: {
                id: 'pentan2ol', name: 'pentan-2-ol', formula: 'C₅H₁₂O',
                family: 'alcool simple', priorityFunction: 'alcool',
                functionChoices: [
                    { id: 'alcool', label: 'Alcool', suffix: '-ol', picto: '💧' },
                    { id: 'cetone', label: 'Cétone', suffix: '-one', picto: '🔷' },
                    { id: 'aldehyde', label: 'Aldéhyde', suffix: '-al', picto: '🍬' }
                ],

        function escapeHtml(s) {

        function shuffle(a) {
            const b = a.slice();
            for (let i = b.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [b[i], b[j]] = [b[j], b[i]];
            }
            return b;
        }
        function sameSet(a, b) {
            if (a.length !== b.length) return false;
            const sb = new Set(b);

        /* ==========================================================================
           5. TYPES DE GROUPES
           ========================================================================== */
        const CARBON_GROUPS = ['C', 'CH', 'CH₂', 'CH₃', 'Cp'];
        function isCarbonGroup(el) { return CARBON_GROUPS.includes(el); }
        function isPureCarbon(el) { return el === 'C'; }

        function getGroupColor(el) {
            if (el === 'CH' || el === 'CH₂' || el === 'CH₃' || el === 'Cp') return '#4A4A4A';
            if (el === 'O' || el === 'OH' || el === 'OCH₃' || el === 'CHO') return '#EF4444';
            if (el === 'N' || el === 'NH₂' || el === 'NO₂' || el === 'CN') return '#3B82F6';
            if (el === 'Cl') return '#10B981';
            if (el === 'Br') return '#B45309';
            if (el === 'F') return '#EC4899';
            if (el === 'I') return '#8B5CF6';
            return '#CE82FF';
        }
        function getLabelSize(label) {
            const n = label.length;
            if (n <= 2) return { r: 22, fs: 15 };
            if (n <= 3) return { r: 26, fs: 13 };
            if (n <= 4) return { r: 30, fs: 11 };
            return { r: 34, fs: 10 };
        }

        /* ==========================================================================
           6. SVG RENDERING
           ========================================================================== */
        function adjacencyOf(mol) {
            const adj = {};
            mol.atoms.forEach(a => adj[a.id] = []);
            mol.bonds.forEach(b => { adj[b[0]].push(b[1]); adj[b[1]].push(b[0]); });
            return adj;
        }

        function getOptimalLabelPos(mol, a, dist = 22) {
            const adj = adjacencyOf(mol);
            const nbrIds = adj[a.id] || [];
            const bondAngles = nbrIds.map(nid => {
                const nbr = mol.atoms.find(x => x.id === nid);
                return nbr ? Math.atan2(nbr.y - a.y, nbr.x - a.x) : 0;
            });
            if (bondAngles.length === 0) return { x: a.x, y: a.y - dist };
            let bestAngle = 0, maxMinDiff = -1;
            for (let deg = 0; deg < 360; deg += 10) {
                const rad = deg * (Math.PI / 180);
                let minDiff = Math.PI;
                for (const bAngle of bondAngles) {
                    let diff = Math.abs(rad - bAngle);
                    if (diff > Math.PI) diff = 2 * Math.PI - diff;
                    if (diff < minDiff) minDiff = diff;
                }
                if (minDiff > maxMinDiff) { maxMinDiff = minDiff; bestAngle = rad; }
            }
            return {
                x: a.x + Math.cos(bestAngle) * dist,
                y: a.y + Math.sin(bestAngle) * dist
            };
        }

        function bondEndRadius(a) {
            if (a.el === 'C') return 0;
            if (isCarbonGroup(a.el)) return 0; // 0 au lieu de 14 pour que la ligne touche le centre
            return getLabelSize(a.el).r;
        }
        function renderMolecule(mol, opts = {}) {
            const { chain = [], subs = [], interactive = false } = opts;
            const numbering = {};
            chain.forEach((id, i) => numbering[id] = i + 1);
            const chainSet = new Set(chain);
            const chainBondKeys = new Set();
            for (let i = 0; i < chain.length - 1; i++) {
                chainBondKeys.add([chain[i], chain[i + 1]].sort().join('-'));
            }
            // 🆕 Fermeture de cycle : ajoute la liaison dernier → premier
            if (chain.length >= 3) {
                const closingKey = [chain[0], chain[chain.length - 1]].sort().join('-');
                if (mol.bonds.some(b => [b[0], b[1]].sort().join('-') === closingKey)) {
                    chainBondKeys.add(closingKey);
                }
            }

            const pad = 60;
            const xs = mol.atoms.map(a => a.x);
            const ys = mol.atoms.map(a => a.y);
            const minX = Math.min(...xs) - pad, maxX = Math.max(...xs) + pad;
            const minY = Math.min(...ys) - pad, maxY = Math.max(...ys) + pad;
            const vw = maxX - minX, vh = maxY - minY;

            let svg = `<svg viewBox="${minX} ${minY} ${vw} ${vh}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">`;

            /* BONDS */
            mol.bonds.forEach(bd => {
                const a1 = mol.atoms.find(a => a.id === bd[0]);
                const a2 = mol.atoms.find(a => a.id === bd[1]);
                if (!a1 || !a2) return;
                const key = [bd[0], bd[1]].sort().join('-');
                const inChain = chainBondKeys.has(key);
                const color = inChain ? '#58CC02' : '#4A4A4A';
                const width = inChain ? 5.5 : 3.0;
                const r1 = bondEndRadius(a1), r2 = bondEndRadius(a2);
                svg += bondPath(a1, a2, bd[2] || 1, color, width, r1, r2);
            });

            /* ATOMS */
            mol.atoms.forEach(a => {
                const inChain = chainSet.has(a.id);
                const isSub = subs.includes(a.id);
                svg += `<g class="atom-hit" ${interactive ? `data-atom="${a.id}"` : ''}>`;
                svg += `<circle cx="${a.x}" cy="${a.y}" r="28" fill="#000" opacity="0" style="pointer-events:all;cursor:pointer;"/>`;

                if (isPureCarbon(a.el)) {
                    if (inChain || isSub) {
                        const color = isSub ? '#FFC800' : '#58CC02';
                        svg += `<circle class="atom-shape" cx="${a.x}" cy="${a.y}" r="5.5" fill="${color}" stroke="#fff" stroke-width="1.5"/>`;
                    } else {
                        svg += `<circle class="atom-shape" cx="${a.x}" cy="${a.y}" r="6" fill="transparent" stroke="none"/>`;
                    }
                } else if (isCarbonGroup(a.el)) {
                    /* CH₃, CH₂, CH, Cp : on les traite comme des carbones purs (squelette) */
                    if (inChain || isSub) {
                        const color = isSub ? '#FFC800' : '#58CC02';
                        svg += `<circle class="atom-shape" cx="${a.x}" cy="${a.y}" r="5.5" fill="${color}" stroke="#fff" stroke-width="1.5"/>`;
                    } else {
                        svg += `<circle class="atom-shape" cx="${a.x}" cy="${a.y}" r="6" fill="transparent" stroke="none"/>`;
                    }
                } else {
                    /* Hétéroatome / groupe : cercle coloré */
                    let bgColor = getGroupColor(a.el);
                    if (isSub) bgColor = '#FFC800';
                    const sz = getLabelSize(a.el);
                    svg += `<circle class="atom-shape" cx="${a.x}" cy="${a.y}" r="${sz.r}" fill="${bgColor}" stroke="#fff" stroke-width="2.5"/>`;
                    svg += `<text x="${a.x}" y="${a.y + sz.fs * 0.35}" text-anchor="middle" font-size="${sz.fs}" font-weight="900" fill="#fff" font-family="-apple-system,sans-serif">${a.el}</text>`;
                }

                if (numbering[a.id]) {
                    const pos = getOptimalLabelPos(mol, a, 26);
                    svg += `<text x="${pos.x}" y="${pos.y + 4}" text-anchor="middle" font-size="13" font-weight="900" fill="#46A302" font-family="-apple-system,sans-serif" class="num-badge">${numbering[a.id]}</text>`;
                }
                svg += '</g>';
            });

            svg += '</svg>';
            return svg;
        }

        function bondPath(a1, a2, order, color, width, r1, r2) {
            const dx = a2.x - a1.x, dy = a2.y - a1.y;
            const len = Math.hypot(dx, dy) || 1;
            const ux = dx / len, uy = dy / len;
            const px = -uy, py = ux;
            const x1 = a1.x + ux * r1, y1 = a1.y + uy * r1;
            const x2 = a2.x - ux * r2, y2 = a2.y - uy * r2;
            const isChain = width > 4;
            const hitLine = `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#000" opacity="0" stroke-width="28" class="bond-hit" style="pointer-events:stroke;cursor:pointer;"/>`;
            let inner = '';
            if (order === 1) {
                const w = isChain ? 5.5 : 3.0;
                inner = `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${w}" stroke-linecap="round"/>`;
            } else if (order === 2) {
                const off = isChain ? 5.0 : 4.0, w = isChain ? 3.0 : 2.5;
                const ox = px * off, oy = py * off;
                const attr = `stroke="${color}" stroke-width="${w}" stroke-linecap="round"`;
                inner = `<line x1="${x1 + ox}" y1="${y1 + oy}" x2="${x2 + ox}" y2="${y2 + oy}" ${attr}/>`
                    + `<line x1="${x1 - ox}" y1="${y1 - oy}" x2="${x2 - ox}" y2="${y2 - oy}" ${attr}/>`;
            } else {
                const off = isChain ? 6.8 : 5.5, w = isChain ? 2.6 : 2.2;
                const ox = px * off, oy = py * off;
                const attr = `stroke="${color}" stroke-width="${w}" stroke-linecap="round"`;
                inner = `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" ${attr}/>`
                    + `<line x1="${x1 + ox}" y1="${y1 + oy}" x2="${x2 + ox}" y2="${y2 + oy}" ${attr}/>`
                    + `<line x1="${x1 - ox}" y1="${y1 - oy}" x2="${x2 - ox}" y2="${y2 - oy}" ${attr}/>`;
            }
            const gid = [a1.id, a2.id].sort().join('-');
            return `<g class="bond" data-bond="${gid}" data-order="${order}">${hitLine}${inner}</g>`;
        }

        /* ==========================================================================
           7. ÉCRAN D'ACCUEIL
           ========================================================================== */
        /* ===== MODE ALÉATOIRE (pour intégration dans index.html) ===== */

        function startRandomV2(fromW, fromL) {
            state.random = true;
            let history = [];
            try { history = JSON.parse(localStorage.getItem('nomenduo_v2_rnd_hist') || '[]'); } catch (e) { }

            const recent = new Set(history.map(h => h[0] + ':' + h[1]));
            if (fromW != null) recent.add(fromW + ':' + fromL);

            const all = [];
            WORLDS.forEach((w, wi) => w.levels.forEach((_, li) => all.push([wi, li])));

            let pool = all.filter(([wi, li]) => !recent.has(wi + ':' + li));
            if (pool.length === 0) {
                history = [];
                pool = all.filter(([wi, li]) => !(wi === fromW && li === fromL));
                if (pool.length === 0) pool = all;
            }

            const [wi, li] = pool[Math.floor(Math.random() * pool.length)];
            history.push([wi, li]);

        /* ==========================================================================
           8. OUVERTURE D'UN NIVEAU
           ========================================================================== */
        function prepareSteps(mol, rawSteps) {
            /* Filtrer les étapes inutiles */
            let steps = rawSteps.filter(step => {
                if (step === 'func' && mol.functionChoices.length <= 1) return false;
                if (step === 'chain' && mol.chain.length <= 1) return false;
                return true;
            });
            /* Réordonner : func d'abord (direction), puis chain, puis name */
            const order = ['func', 'chain', 'subs', 'name'];
            steps = steps.slice().sort((a, b) => order.indexOf(a) - order.indexOf(b));
            /* Toujours terminer par name */
            if (!steps.includes('name')) steps.push('name');
            return steps;
        }

        function openLevel(wi, li) {
            const world = WORLDS[wi];
            const level = world.levels[li];
            const mol = MOLECULES[level.mol];
            state.worldIdx = wi;
            state.levelIdx = li;
            state.steps = prepareSteps(mol, level.steps);
            state.stepIdx = 0;
            state.stepState = {};
            state.chainSequence = [];
            state.mistakes = 0;
            state.hearts = 3;
            renderPlay();
        }

        /* ==========================================================================
           10. RENDU DES ÉTAPES
           ========================================================================== */
        function renderStep(step, mol) {
            if (step === 'func') {
                // On prend toutes les fonctions sauf celle de la molécule
                const correctId = mol.priorityFunction;
                const correctFunc = ALL_FUNCTIONS.find(f => f.id === correctId) || { id: correctId, label: mol.functionChoices[0].label };

                let pool = ALL_FUNCTIONS.filter(f => f.id !== correctId);
                pool = shuffle(pool).slice(0, 5); // On prend 5 intrus au hasard

                let finalChoices = [correctFunc, ...pool];
                finalChoices = shuffle(finalChoices); // On mélange tout pour que le vrai soit n'importe où

                let buttonsHTML = `<div class="func-grid">
                ${finalChoices.map(c => `<button class="func-btn" data-fid="${c.id}">
                    <div class="fname">${c.label}</div>
                </button>`).join('')}
            </div>`;

                return {
                    title: 'Fonction prioritaire',
                    subtitle: 'Quelle fonction donne le suffixe ?',
                    molecule: renderMolecule(mol),
                    answers: buttonsHTML
                };
            }

            if (step === 'chain') {
                const tapped = state.stepState.tapped || [];
                return {
                    title: 'Chaîne principale',
                    subtitle: 'Touche les carbones dans l\'ordre de numérotation.',
                    molecule: renderMolecule(mol, { chain: tapped, interactive: true }),
                    answers: `<div style="text-align:center;color:#AFAFAF;font-weight:800;font-size:13px">
                Atomes : <b style="color:#58CC02" id="chain-count">${tapped.length}</b>
            </div>`
                };
            }

            if (step === 'name') {
                const pool = buildNamePool(mol);
                const selected = state.stepState.namePieces || [];
                const usedSet = new Set(selected);
                let poolHTML = '';
                pool.forEach(tok => {
                    const used = usedSet.has(tok) ? ' used' : '';
                    poolHTML += `<button class="chip${used}" data-tok="${escapeHtml(tok)}">${escapeHtml(tok)}</button>`;
                });
                let slotHTML = '';
                selected.forEach(tok => {
                    slotHTML += `<span class="piece" data-tok="${escapeHtml(tok)}">${escapeHtml(tok)}</span>`;
                });
                return {
                    title: 'Assemble le nom',
                    subtitle: 'Touche les morceaux dans le bon ordre.',
                    molecule: renderMolecule(mol, { chain: state.chainSequence }),
                    answers: `<div class="name-slot${selected.length === 0 ? ' empty' : ''}" id="name-slot">${slotHTML}</div>
                     <div class="chips" id="chips">${poolHTML}</div>`
                };
            }

            return { title: '', subtitle: '', molecule: '', answers: '' };
        }

        /* ==========================================================================
           11. POOL DE CHIPS
           ========================================================================== */

        /* ─── Fallback : si le token n'est pas dans le dictionnaire ─── */
        function fallbackVariants(tok) {
            const out = [];
            const numMatch = tok.match(/(\d+)/);
            if (numMatch) {
                const n = parseInt(numMatch[1], 10);
                [n + 1, n - 1].forEach(nn => {
                    if (nn > 0 && nn !== n) out.push(tok.replace(numMatch[1], String(nn)));
                });
            }
            if (tok.startsWith('cyclo')) out.push(tok.slice(5));
            if (tok.endsWith('ane')) out.push(tok.slice(0, -3) + 'ène');
            if (tok.endsWith('ène')) out.push(tok.slice(0, -3) + 'ane');
            return out;
        }

        /* ─── Générateur intelligent de distracteurs (fragments, pas noms complets) ─── */
        function generateSmartDistractors(mol) {
            const correctSet = new Set(mol.tokens);
            const out = new Set();

            mol.tokens.forEach(tok => {
                let variants = FRAGMENT_ALTERNATIVES[tok];
                if (!variants) variants = fallbackVariants(tok);

                // On prend 2 variantes au hasard pour diversifier (évite que tous soient des changements de chiffre)
                const picked = shuffle(variants.slice()).slice(0, 2);
                picked.forEach(v => {
                    if (!correctSet.has(v) && v && v.trim()) out.add(v);
                });
            });

            return [...out];
        }

        /* ─── Construction du pool final ─── */
        function buildNamePool(mol) {
            const correct = mol.tokens.slice();
            const correctSet = new Set(correct);
            const pool = new Set(correct);

            // 1. Distracteurs intelligents (fragment-level)
            generateSmartDistractors(mol).forEach(d => pool.add(d));

            // 2. Fallback : si trop peu de chips, on complète avec les distracteurs hardcodés
            if (pool.size < correct.length + 3) {
                (mol.distractors || []).forEach(d => {
                    if (d && d.trim() && !correctSet.has(d)) pool.add(d);
                });
            }

            // 3. Plafonner à 10 chips pour garder l'UI propre
            const arr = [...pool];
            if (arr.length > 10) {
                const others = shuffle(arr.filter(x => !correctSet.has(x)))
                    .slice(0, Math.max(4, 10 - correct.length));
                return shuffle([...correct, ...others]);
            }
            return shuffle(arr);
        }
        /* ==========================================================================
           12. INTERACTIONS
           ========================================================================== */
        function attachStepListeners(step, mol) {
            const stage = document.getElementById('stage');

            if (step === 'func') {
                const answerBox = document.getElementById('answer');
                answerBox.querySelectorAll('.func-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        answerBox.querySelectorAll('.func-btn').forEach(b => b.classList.remove('selected'));
                        btn.classList.add('selected');
                        state.stepState.chosenFunction = btn.dataset.fid;
                        updateVerifyState();
                    });
                });
            }

            if (step === 'chain') {
                const svg = stage.querySelector('svg');
                stage.querySelectorAll('[data-atom]').forEach(g => {
                    g.addEventListener('click', () => {
                        const id = g.dataset.atom;
                        const atom = mol.atoms.find(a => a.id === id);
                        if (!atom) return;
                        if (!isCarbonGroup(atom.el)) {
                            shakeApp();
                            toast('❌ <b>' + atom.el + '</b> ne peut pas être dans la chaîne.');
                            return;
                        }
                        triggerSvgRipple(svg, atom.x, atom.y);
                        let seq = (state.stepState.tapped || []).slice();
                        const idx = seq.indexOf(id);
                        if (idx >= 0) seq = seq.slice(0, idx);
                        else if (seq.length === 0) seq = [id];
                        else {
                            const last = seq[seq.length - 1];
                            const bonded = mol.bonds.some(b =>
                                (b[0] === last && b[1] === id) || (b[1] === last && b[0] === id));
                            if (!bonded) { shakeApp(); toast('⚠️ Touche un carbone adjacent.'); return; }
                            seq.push(id);
                        }
                        state.stepState.tapped = seq;

                        const chainBondKeys = new Set();
                        for (let i = 0; i < seq.length - 1; i++) {
                            chainBondKeys.add([seq[i], seq[i + 1]].sort().join('-'));
                        }
                        // 🆕 Fermeture de cycle
                        if (seq.length >= 3) {
                            const closingKey = [seq[0], seq[seq.length - 1]].sort().join('-');
                            if (mol.bonds.some(b => [b[0], b[1]].sort().join('-') === closingKey)) {
                                chainBondKeys.add(closingKey);
                            }
                        }
                        stage.querySelectorAll('.bond').forEach(bondG => {
                            const inChain = chainBondKeys.has(bondG.dataset.bond);
                            const order = parseInt(bondG.dataset.order || '1', 10);
                            let sw = inChain ? '5.5' : '3.0';
                            if (order === 2) sw = inChain ? '3.0' : '2.5';
                            if (order === 3) sw = inChain ? '2.6' : '2.2';
                            bondG.querySelectorAll('line').forEach(line => {
                                line.setAttribute('stroke', inChain ? '#58CC02' : '#4A4A4A');
                                line.setAttribute('stroke-width', sw);
                            });
                        });
                        stage.querySelectorAll('[data-atom]').forEach(elG => {
                            const aId = elG.dataset.atom;
                            const aData = mol.atoms.find(a => a.id === aId);
                            if (!aData) return;
                            const isSel = seq.includes(aId);
                            if (isPureCarbon(aData.el) || isCarbonGroup(aData.el)) {
                                const sh = elG.querySelector('.atom-shape');
                                if (sh) {
                                    sh.setAttribute('r', isSel ? '5.5' : '6');
                                    sh.setAttribute('fill', isSel ? '#58CC02' : 'transparent');
                                    sh.setAttribute('stroke', isSel ? '#fff' : 'none');
                                    sh.setAttribute('stroke-width', isSel ? '1.5' : '0');
                                }
                            } else if (isCarbonGroup(aData.el)) {
                                const sh = elG.querySelector('.atom-shape');
                                if (sh) sh.setAttribute('fill', isSel ? '#46A302' : '#4A4A4A');
                            }
                            elG.querySelectorAll('.num-badge').forEach(b => b.remove());
                            const orderNum = seq.indexOf(aId) + 1;
                            if (orderNum > 0) {
                                const pos = getOptimalLabelPos(mol, aData, 26);
                                const badge = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                                badge.setAttribute('class', 'num-badge');
                                badge.setAttribute('x', pos.x);
                                badge.setAttribute('y', pos.y + 4);
                                badge.setAttribute('text-anchor', 'middle');
                                badge.setAttribute('font-size', '13');
                                badge.setAttribute('font-weight', '900');
                                badge.setAttribute('fill', '#46A302');
                                badge.setAttribute('font-family', '-apple-system,sans-serif');
                                badge.textContent = orderNum;
                                elG.appendChild(badge);
                            }
                        });
                        const cnt = document.getElementById('chain-count');
                        if (cnt) cnt.textContent = seq.length;
                        updateVerifyState();
                    });
                });
            }

            if (step === 'name') {
                const chipsBox = document.getElementById('chips');
                const slot = document.getElementById('name-slot');
                const refreshSlot = () => {
                    const arr = (state.stepState.namePieces || []);
                    const usedSet = new Set(arr);
                    chipsBox.querySelectorAll('.chip').forEach(c => {
                        c.classList.toggle('used', usedSet.has(c.dataset.tok));
                    });
                    slot.innerHTML = '';
                    arr.forEach(tok => {
                        const piece = el('<span class="piece">' + escapeHtml(tok) + '</span>');
                        piece.addEventListener('click', () => {
                            const cur = (state.stepState.namePieces || []).slice();
                            const i = cur.indexOf(tok);
                            if (i >= 0) cur.splice(i, 1);
                            state.stepState.namePieces = cur;
                            refreshSlot();
                            updateVerifyState();
                        });
                        slot.appendChild(piece);
                    });
                    slot.classList.toggle('empty', arr.length === 0);
                };
                chipsBox.querySelectorAll('.chip').forEach(c => {
                    c.addEventListener('click', () => {
                        const tok = c.dataset.tok;
                        const arr = (state.stepState.namePieces || []).slice();
                        if (arr.includes(tok)) return;
                        arr.push(tok);
                        state.stepState.namePieces = arr;
                        refreshSlot();
                        updateVerifyState();
                    });
                });
                refreshSlot();
            }
        }

        function triggerSvgRipple(svg, cx, cy) {
            const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            c.setAttribute('cx', cx); c.setAttribute('cy', cy);
            c.setAttribute('class', 'svg-click-ripple');
            svg.appendChild(c);
            setTimeout(() => c.remove(), 500);
        }

        function updateVerifyState() {
            const btn = document.getElementById('btn-verify');
            if (!btn) return;
            const step = state.steps[state.stepIdx];
            const q = state.stepState;
            let ready = false;
            if (step === 'func') ready = !!q.chosenFunction;
            else if (step === 'chain') ready = (q.tapped || []).length >= 2;
            else if (step === 'name') ready = (q.namePieces || []).length >= 1;
            btn.disabled = !ready;
        }

        /* ==========================================================================
           13. VÉRIFICATION
           ========================================================================== */
        function verifyStep() {
            const step = state.steps[state.stepIdx];
            const mol = currentMol();
            const q = state.stepState;
            let ok = false, title = '', text = '', diag = '', compare = null;

            if (step === 'func') {
                const chosen = q.chosenFunction;
                const correct = mol.priorityFunction;
                if (chosen === correct) {
                    ok = true;
                    title = 'Fonction prioritaire correcte';
                    text = 'Elle donne le suffixe et impose la numérotation.';
                } else {
                    diag = 'Priorité';
                    title = 'Fonction prioritaire incorrecte';
                    // On cherche dans ALL_FUNCTIONS pour éviter l'erreur si l'élève clique sur un intrus
                    const correctLabel = (ALL_FUNCTIONS.find(c => c.id === correct) || { label: correct }).label;
                    const chosenLabel = (ALL_FUNCTIONS.find(c => c.id === chosen) || { label: chosen }).label;
                    text = `Tu as choisi <b>${chosenLabel}</b>. C'est la <b>${correctLabel}</b> qui est prioritaire.`;
                }
            }
            else if (step === 'chain') {
                const tapped = q.tapped || [];
                const correctChain = mol.chain;
                if (!sameSet(tapped, correctChain)) {
                    diag = 'Chaîne';
                    title = 'Mauvaise sélection';
                    text = `La chaîne doit contenir exactement <b>${correctChain.length}</b> carbones, dont la fonction principale.`;
                } else if (tapped[0] !== correctChain[0]) {
                    diag = 'Direction';
                    title = 'Mauvais sens de numérotation';
                    text = 'Sélection correcte, mais commence par l\'autre extrémité (C1 = fonction prioritaire).';
                } else {
                    ok = true;
                    state.chainSequence = tapped;
                    title = 'Chaîne correcte';
                    text = `<b>${tapped.length}</b> carbones, numérotation correcte.`;
                }
            }
            else if (step === 'name') {
                const pieces = q.namePieces || [];
                const proposed = normalize(pieces.join(''));
                const correct = normalize(mol.name);
                if (proposed === correct) {
                    ok = true;
                    title = 'Nom correct !';
                    text = `<b>${mol.name}</b>`;
                } else {
                    diag = 'Nom';
                    title = 'Presque…';
                    text = 'Assemblage incorrect.';
                    compare = { student: pieces.join('') || '(vide)', correct: mol.name };
                }
            }

            if (!ok) {
                state.mistakes++;
                state.hearts = Math.max(0, state.hearts - 1);
                saveAll();
                if (state.hearts <= 0) { showHeartsOut(); return; }
            }
            showSheet({ ok, title, text, diag, onContinue: ok ? nextStep : null, compare });
        }

        /* ==========================================================================
           14. FEEDBACK SHEET
           ========================================================================== */
        function showSheet({ ok, title, text, diag, onContinue, compare }) {
            const cmpHTML = compare
                ? `<div class="cmp-wrap">
            <div class="cmp-box cmp-wrong">
                <div class="cmp-label">Ta réponse</div>
                <div class="cmp-text">${escapeHtml(compare.student || '(vide)')}</div>
            </div>
            <div class="cmp-vs">→</div>
            <div class="cmp-box cmp-good">
                <div class="cmp-label">Correct</div>
                <div class="cmp-text">${escapeHtml(compare.correct)}</div>
            </div>
        </div>`
                : '';
            const wrap = el(`
        <div class="sheet-wrap">
            <div class="sheet ${ok ? 'good' : 'bad'}">
                <div class="sheet-icon">${ok ? '✓' : '✕'}</div>
                ${(!ok && diag) ? `<div style="text-align:center;margin-bottom:10px"><span class="diag">${diag}</span></div>` : ''}
                <div class="sheet-title">${title}</div>
                <div class="sheet-text">${text}</div>
                ${cmpHTML}
                <div class="sheet-actions">
                    <button class="btn-3d" id="sheet-btn">${onContinue ? 'Continuer' : 'Réessayer'}</button>
                </div>
            </div>
        </div>
    `);
            document.body.appendChild(wrap);
            if (!ok) shakeApp();
            wrap.querySelector('#sheet-btn').addEventListener('click', () => {
                wrap.remove();
                if (onContinue) onContinue();
                else { state.stepState = {}; renderPlay(); }
            });
        }

        /* ==========================================================================
           15. GAME OVER
           ========================================================================== */
        function showHeartsOut() {
            const wrap = el(`
        <div class="fs-screen fs-lose">
            <div class="fs-content">
                <div class="fs-hero">💔</div>
                <div class="fs-title">Plus de cœurs !</div>
                <div class="fs-text">Réessaie plus tard.</div>
            </div>
            <div class="fs-footer">
                <button class="btn-3d fs-btn-main" id="sheet-btn" style="flex:1">Retour aux missions</button>
            </div>
        </div>
    `);
            document.body.appendChild(wrap);
            shakeApp();
            wrap.querySelector('#sheet-btn').addEventListener('click', () => {
                wrap.remove();
                state.hearts = 3;
                saveAll();
                exitV2Home();
            });
        }

        /* ==========================================================================
           16. NAVIGATION
           ========================================================================== */
        function nextStep() {
            state.stepIdx++;
            if (state.stepIdx >= state.steps.length) finishLevel();
            else { state.stepState = {}; renderPlay(); }
        }

        function finishLevel() {
            const world = WORLDS[state.worldIdx];
            const key = world.id + ':' + state.levelIdx;
            const stars = state.mistakes === 0 ? 3 : state.mistakes === 1 ? 2 : 1;
            const prev = state.progress[key];
            state.progress[key] = { done: true, stars: Math.max(stars, prev?.stars || 0) };
            saveAll();
            const mol = MOLECULES[world.levels[state.levelIdx].mol];
            const curW = state.worldIdx, curL = state.levelIdx;
            const isRandom = !!state.random;

            // 👇 التعديل: إخفاء الواجهة فوراً وإرسال الرسالة
            // إرسال رسالة الفوز للملف الأول لحفظ النجوم وعرض شاشة الفوز
            if (window.parent !== window) {
                document.getElementById('app').style.display = 'none';
                window.parent.postMessage({
                    type: 'v2-win',
                    molName: mol.name,
                    stars: stars,
                    worldId: world.id,
                    levelIdx: state.levelIdx
                }, '*');
                return;
            }

            const hasNext = isRandom || curL < world.levels.length - 1;
            const nextLabel = isRandom ? '🎲 Défi suivant' : (hasNext ? 'Suivant →' : 'Terminer');
            const homeLabel = isRandom ? '← Retour' : 'Missions';

            const wrap = el(`
                <div class="fs-screen fs-win">
                ... (باقي الكود يبقى كما هو)
        <div class="fs-screen fs-win">
            <div class="fs-content">
                <div class="fs-hero">🏆</div>
                <div class="fs-title">Niveau terminé !</div>
                <div class="fs-text"><b>${escapeHtml(mol.name)}</b></div>
                <div class="star-row">
                    ${[0, 1, 2].map(i => `<span class="st ${i < stars ? 'on' : 'off'}" style="animation-delay:${0.4 + i * 0.3}s">★</span>`).join('')}
                </div>
            </div>
            <div class="fs-footer">
                <button class="btn-3d fs-btn-sec" id="btn-home" style="flex:1">${homeLabel}</button>
                <button class="btn-3d fs-btn-main" id="btn-next" style="flex:1">${nextLabel}</button>
            </div>
        </div>
    `);
            document.body.appendChild(wrap);
            wrap.querySelector('#btn-home').addEventListener('click', () => {
                wrap.remove();
                if (isRandom) exitV2Home();
                else renderHome();
            });

            wrap.querySelector('#btn-next').addEventListener('click', () => {
                wrap.remove();
                if (isRandom) startRandomV2(curW, curL);
                else if (hasNext) openLevel(curW, curL + 1);
                else renderHome();
            });

        }

        function showQuitConfirm() {
            const wrap = el(`
        <div class="sheet-wrap">
            <div class="sheet neutral">
                <div class="sheet-icon" style="color:#FF4B4B">⚠️</div>
                <div class="sheet-title">Quitter ?</div>
                <div class="sheet-text" style="color:#4B4B4B">Progression perdue.</div>
                <div class="sheet-actions" style="display:flex;gap:10px">
                    <button class="btn-3d btn-secondary" id="btn-cancel" style="flex:1">Continuer</button>
                    <button class="btn-3d btn-red" id="btn-quit" style="flex:1">Quitter</button>
                </div>
            </div>
        </div>
    `);
            document.body.appendChild(wrap);
            wrap.querySelector('#btn-cancel').addEventListener('click', () => wrap.remove());
            wrap.querySelector('#btn-quit').addEventListener('click', () => {
                wrap.remove();
                exitV2Home();
            });
            wrap.addEventListener('click', e => { if (e.target === wrap) wrap.remove(); });
        }

        /* ==========================================================================
           17. BOOT
           ========================================================================== */

    </script>
</body>
