<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#58CC02">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NomenDuo">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192-v2.png">
    <title>NomenDuo — Nomenclature</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0
        }

        :root {
            --green: #58CC02;
            --green-d: #46A302;
            --green-l: #D7FFB8;
            --blue: #1CB0F6;
            --blue-d: #1899D6;
            --red: #FF4B4B;
            --red-d: #E53935;
            --red-l: #FFDFE0;
            --gold: #FFC800;
            --gold-d: #E5A400;
            --ink: #3C3C3C;
            --ink2: #4B4B4B;
            --muted: #AFAFAF;
            --line: #E5E5E5;
            --bg: #FFFFFF;
            --bg-soft: #F7F7F7;
            --purple: #CE82FF;
            --purple-d: #A568CC;
        }

        html,
        body {
            height: 100%;
            overflow: hidden
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            background: var(--bg);
            color: var(--ink);
            -webkit-font-smoothing: antialiased;
            font-size: 15px;
            line-height: 1.4;
            font-weight: 600;
        }

        button {
            font-family: inherit;
            cursor: pointer;
            border: none;
            background: none;
            color: inherit;
            font-weight: inherit
        }

        #app {
            max-width: 500px;
            height: 100dvh;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            position: relative;
            overflow: hidden;
        }


        .topbar {
            flex: none;
            padding: 14px 16px 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg);
            z-index: 5;
        }

        .topbar .close-x {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: var(--muted);
            font-weight: 900;
            transition: background .15s;
        }

        .topbar .close-x:active {
            background: var(--bg-soft)
        }

        .progress-track {
            flex: 1;
            height: 14px;
            background: var(--line);
            border-radius: 99px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: var(--green);
            border-radius: 99px;
            transition: width .4s cubic-bezier(.4, 0, .2, 1);
            box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .08);
        }

        .hearts {
            display: flex;
            align-items: center;
            gap: 4px;
            color: var(--red);
            font-weight: 900;
            font-size: 17px;
        }

        .hearts .heart {
            font-size: 18px
        }

        .rnd-tag {
            font-size: 11px;
            font-weight: 900;
            color: #7A5A00;
            background: #FFF1B8;
            padding: 3px 8px;
            border-radius: 99px;
            letter-spacing: .04em;
        }


        .home {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 0 0 60px
        }

        .home-hero {
            padding: 24px 20px 12px;
            background: linear-gradient(180deg, #E8FFD0 0%, transparent 100%);
        }

        .home-hero h1 {
            font-size: 30px;
            font-weight: 900;
            letter-spacing: -.7px;
            color: var(--ink);
            line-height: 1.1;
        }

        .home-hero h1 .accent {
            color: var(--green)
        }

        .home-hero p {
            color: var(--muted);
            font-weight: 700;
            font-size: 13px;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: .08em;
        }

        .home-stats {
            display: flex;
            gap: 10px;
            padding: 0 20px;
            margin-top: 6px
        }

        .stat-chip {
            background: var(--bg-soft);
            border-radius: 14px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 900;
            font-size: 14px;
        }

        .stat-chip .ico {
            font-size: 18px
        }

        .stat-chip b {
            color: var(--ink);
            font-weight: 900
        }

        .stat-chip span {
            color: var(--muted);
            font-weight: 800;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .05em
        }

        .worlds {
            padding: 22px 20px 0;
            display: flex;
            flex-direction: column;
            gap: 26px
        }

        .world-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px
        }

        .world-title .badge {
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 10.5px;
            font-weight: 900;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: #fff;
            min-width: 34px;
            text-align: center;
        }

        .world-title h2 {
            font-size: 18px;
            font-weight: 900;
            letter-spacing: -.3px
        }

        .world-title .count {
            margin-left: auto;
            font-size: 12px;
            color: var(--muted);
            font-weight: 800
        }

        .levels {
            display: flex;
            flex-direction: column;
            gap: 12px
        }

        .level-row {
            display: flex;
            align-items: center;
            gap: 14px;
            background: var(--bg-soft);
            border-radius: 18px;
            padding: 14px 16px;
            border: 2px solid transparent;
            transition: transform .12s;
            text-align: left;
            width: 100%;
        }

        .level-row:active {
            transform: scale(.98)
        }

        .level-row.done {
            background: var(--green-l);
            border-color: var(--green)
        }

        .level-badge {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            flex: none;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            border: 2px solid var(--line);
            font-size: 20px;
            font-weight: 900;
            color: var(--ink);
            box-shadow: 0 3px 0 var(--line);
        }

        .level-row.done .level-badge {
            background: var(--green);
            border-color: var(--green-d);
            color: #fff;
            box-shadow: 0 3px 0 var(--green-d);
        }

        .level-meta {
            flex: 1;
            min-width: 0
        }

        .level-meta h3 {
            font-size: 15px;
            font-weight: 900;
            letter-spacing: -.2px;
            color: var(--ink)
        }

        .level-meta p {
            font-size: 12px;
            color: var(--muted);
            font-weight: 700;
            margin-top: 3px
        }

        .level-stars {
            color: var(--gold);
            font-size: 16px;
            letter-spacing: 1px
        }

        .level-arrow {
            font-size: 18px;
            color: var(--muted);
            font-weight: 900
        }


        .random-cards-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 0 20px;
            margin-top: 14px;
        }

        .random-cards-row .random-card {
            padding: 14px 12px;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .random-cards-row .random-card h2 {
            font-size: 16px;
            margin: 4px 0 8px;
        }

        .random-cards-row .random-card .btn-3d {
            padding: 12px 10px;
            font-size: 13px;
        }

        .db-switch-wrap {
            padding: 18px 20px 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .db-switch {
            display: flex;
            width: 100%;
            background: var(--bg-soft);
            border: 2px solid var(--line);
            border-radius: 16px;
            padding: 4px;
            gap: 4px;
        }

        .db-switch-btn {
            flex: 1;
            padding: 10px 12px;
            border-radius: 12px;
            font-size: 13.5px;
            font-weight: 900;
            color: var(--muted);
            transition: all .2s cubic-bezier(.4, 0, .2, 1);
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .db-switch-btn.active {
            background: #FFFFFF;
            color: var(--ink);
            box-shadow: 0 3px 8px rgba(0, 0, 0, .08);
            border-bottom: 3px solid var(--line);
        }

        .db-switch-btn.active.v1 {
            color: var(--green-d);
            border-bottom-color: var(--green);
        }

        .db-switch-btn.active.v2 {
            color: #7A4AA8;
            border-bottom-color: var(--purple);
        }



        .random-card {
            padding: 18px 20px;
            border-radius: 22px;
            background: #FFFFFF;
            border: 2px solid #89E219;
            box-shadow: 0 5px 0 #58CC02;
            width: 100%;

            margin: 0 auto;


        }

        .random-card .kicker {
            font-size: 10.5px;
            font-weight: 900;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: #58CC02;
        }

        .random-card h2 {
            font-size: 21px;
            font-weight: 900;
            letter-spacing: -.4px;
            margin-top: 4px;
            color: #2B5A00;
        }

        .random-card p {
            font-size: 13px;
            font-weight: 700;
            margin: 6px 0 14px;
            color: #4A7A00;
            line-height: 1.45;
        }

        .random-card .btn-3d {
            padding: 14px 18px;

            font-size: 14px;
        }


        .btn-3d {
            display: inline-block;
            padding: 18px;
            border: none;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 900;
            letter-spacing: 0.5px;
            cursor: pointer;
            border-bottom: 4px solid rgba(0, 0, 0, .25);
            transition: transform .08s ease, border-bottom-width .08s ease;
            width: 100%;
            text-align: center;
        }

        .btn-3d:active {
            transform: translateY(2px);
            border-bottom-width: 2px;
        }

        .btn-gold {
            background: #FFC800;
            border-bottom-color: #E5A800;
            color: #5C4300;
        }


        .section-banner {
            padding: 20px;
            border-radius: 0px;
            background: #e8f8f0;
            color: #1a3a2e;

        }

        .section-banner .kicker {
            font-size: 10px;
            font-weight: 900;
            letter-spacing: .16em;
            text-transform: uppercase;
            color: #10B981;
        }

        .section-banner h2 {
            font-size: 21px;
            font-weight: 900;
            margin-top: 6px;
            line-height: 1.15;
            color: #14261a;
        }

        .section-banner p {
            font-size: 13px;
            font-weight: 600;
            margin-top: 8px;
            color: #4a6b5a;
            line-height: 1.5;
        }

        .section-banner .roadmap {
            display: flex;
            gap: 8px;
            margin-top: 14px;
            flex-wrap: wrap;
        }

        .section-banner .roadmap span {
            background: #e8f8f0;
            border-radius: 12px;
            padding: 5px 12px;
            font-size: 11px;
            font-weight: 800;
            color: #059669;
            box-shadow: 3px 3px 6px #c8d8d0, -3px -3px 6px #ffffff;
        }


        .play {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100dvh;
            overflow: hidden;
            position: relative
        }

        .play-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 0 0 8px;
        }

        .q-block {
            padding: 2px 20px 6px
        }


        .q-block h2 {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: -.5px;
            color: var(--ink);
            line-height: 1.25;
        }

        .q-block p {
            font-size: 14px;
            color: var(--muted);
            font-weight: 700;
            margin-top: 6px;
            line-height: 1.5;
        }

        .stage {
            flex: 1;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2px 4px;
            position: relative;

        }

        .stage svg {
            width: 100%;
            height: 100%;
            max-height: 100%;
            overflow: visible
        }

        .stage .atom-hit {
            cursor: pointer
        }

        .stage .atom-shape {
            transition: all .18s cubic-bezier(.4, 0, .2, 1)
        }

        .stage .atom-hit:active .atom-shape {
            transform: scale(1.1);
            transform-box: fill-box;
            transform-origin: center
        }

        .answer {
            padding: 8px 20px 12px
        }

        .name-slot {
            min-height: 56px;
            border: 2px dashed var(--line);
            border-radius: 14px;
            padding: 10px 14px;
            margin-bottom: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
            font-family: Georgia, serif;
            font-size: 19px;
            font-weight: 900;
            color: var(--ink);
        }

        .name-slot.empty::before {
            content: 'Touche les morceaux pour assembler le nom';
            font-family: inherit;
            font-size: 12.5px;
            font-weight: 700;
            color: var(--muted);
            font-style: italic;
        }

        .name-slot .piece {
            background: var(--green);
            color: #fff;
            padding: 5px 11px;
            border-radius: 9px;
            font-size: 16px;
            font-weight: 900;
            font-family: Georgia, serif;
            animation: popIn .22s cubic-bezier(.34, 1.4, .5, 1);
            box-shadow: 0 3px 0 var(--green-d);
            cursor: pointer;
        }

        @keyframes popIn {
            from {
                transform: scale(.6);
                opacity: 0
            }
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center
        }

        .chip {
            padding: 11px 16px;
            background: var(--bg);
            border: 2px solid var(--line);
            border-radius: 12px;
            font-family: Georgia, serif;
            font-size: 16px;
            font-weight: 900;
            color: var(--ink);
            cursor: pointer;
            box-shadow: 0 3px 0 var(--line);
            transition: transform .1s;
        }

        .chip:active {
            transform: translateY(3px);
            box-shadow: none
        }

        .chip.used {
            opacity: .25;
            pointer-events: none
        }

        .play-footer {
            flex: none;
            padding: 14px 20px calc(18px + env(safe-area-inset-bottom));
            background: var(--bg);
            border-top: 2px solid var(--line);
        }

        .btn-3d {
            display: block;
            width: 100%;
            padding: 16px 20px;
            background: var(--green);
            border-bottom: 5px solid var(--green-d);
            border-radius: 16px;
            color: #fff;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: .08em;
            font-size: 15px;
            transition: transform .08s, border-bottom-width .08s;
            text-align: center;
        }

        .btn-3d:active {
            transform: translateY(5px);
            border-bottom-width: 0
        }

        .btn-3d:disabled {
            background: var(--line);
            border-bottom-color: #D4D4D4;
            color: var(--muted);
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #fff;
            color: var(--ink);
            border-bottom-color: rgba(0, 0, 0, .15)
        }

        .btn-blue {
            background: var(--blue);
            border-bottom-color: var(--blue-d);
            color: #fff
        }

        .btn-red {
            background: var(--red);
            border-bottom-color: var(--red-d);
            color: #fff
        }


        .sheet-wrap {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(60, 60, 60, .5);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            animation: fadeIn .22s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0
            }
        }

        .sheet {
            width: 100%;
            max-width: 500px;
            padding: 28px 22px calc(24px + env(safe-area-inset-bottom));
            border-radius: 26px 26px 0 0;
            animation: slideUp .35s cubic-bezier(.4, 0, .2, 1);
            max-height: 90vh;
            overflow-y: auto;
        }

        .sheet.good {
            background: #E8FFD0;
            color: var(--green-d)
        }

        .sheet.bad {
            background: #FFEBEC;
            color: var(--red-d)
        }

        .sheet.neutral {
            background: #fff;
            color: var(--ink)
        }

        @keyframes slideUp {
            from {
                transform: translateY(60px);
                opacity: 0
            }
        }

        .sheet-icon {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin: 0 auto 14px;
        }

        .sheet.good .sheet-icon {
            color: var(--green)
        }

        .sheet.bad .sheet-icon {
            color: var(--red)
        }

        .sheet-title {
            text-align: center;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: -.4px;
            margin-bottom: 8px
        }

        .sheet-text {
            text-align: center;
            font-size: 15px;
            font-weight: 700;
            line-height: 1.5;
            margin-bottom: 6px
        }

        .sheet-text b {
            font-weight: 900;
            color: inherit
        }

        .sheet-hint {
            background: rgba(255, 255, 255, .7);
            border-radius: 12px;
            padding: 12px 14px;
            margin-top: 14px;
            font-size: 13px;
            font-weight: 700;
            line-height: 1.5;
            text-align: left;
        }

        .diag {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 99px;
            background: #fff;
            color: var(--red-d);
            font-size: 11px;
            font-weight: 900;
            letter-spacing: .08em;
            text-transform: uppercase;
        }

        .sheet-actions {
            margin-top: 20px
        }

        .sheet-actions .btn-3d {
            background: #fff;
            color: var(--ink);
            border-bottom-color: rgba(0, 0, 0, .15)
        }

        .sheet.good .sheet-actions .btn-3d {
            background: var(--green);
            border-bottom-color: var(--green-d);
            color: #fff
        }

        .sheet.bad .sheet-actions .btn-3d {
            background: var(--red);
            border-bottom-color: var(--red-d);
            color: #fff
        }

        .sheet.good .sheet-actions .btn-secondary {
            background: #fff;
            color: var(--ink);
            border-bottom-color: rgba(0, 0, 0, .15)
        }

        .sheet.good .sheet-actions .btn-gold {
            background: var(--gold);
            border-bottom-color: var(--gold-d);
            color: #5C4300
        }

        .prefix-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 16px
        }

        .prefix-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: var(--bg-soft);
            border-radius: 12px;
            font-weight: 800;
            font-size: 15px;
        }

        .prefix-item .num {
            color: var(--green);
            font-weight: 900;
            font-size: 17px;
            min-width: 26px;
            text-align: center
        }

        .prefix-item .txt {
            color: var(--ink)
        }

        .tipbox {
            background: #FFF8DC;
            border: 2px solid var(--gold);
            color: #7A5A00;
            border-radius: 14px;
            padding: 12px 14px;
            margin-top: 14px;
            font-size: 13px;
            font-weight: 700;
            line-height: 1.55;
            text-align: left;
        }

        .tipbox b {
            color: #5C4300;
            font-weight: 900
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 110px;
            transform: translateX(-50%);
            max-width: 88%;
            z-index: 200;
            background: #3C3C3C;
            color: #fff;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 800;
            line-height: 1.4;
            text-align: center;
            box-shadow: 0 6px 18px rgba(0, 0, 0, .25);
            animation: popIn .25s cubic-bezier(.34, 1.4, .5, 1);
        }

        * {
            -webkit-user-select: none;

            -moz-user-select: none;

            -ms-user-select: none;

            user-select: none;

            -webkit-touch-callout: none;

            -webkit-tap-highlight-color: transparent;
        }

        .hidden {
            display: none !important
        }


        .world-toggle {
            margin-left: 8px;
            width: 30px;
            height: 30px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--muted);
            background: var(--bg-soft);
            transition: transform .25s ease, background .15s ease;
            flex: none;
        }

        .world-toggle:active {
            background: var(--line);
        }

        .world-toggle svg {
            transition: transform .3s cubic-bezier(.4, 0, .2, 1);
        }


        .world-section.collapsed .world-toggle svg {
            transform: rotate(-90deg);
        }


        .levels {
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow: hidden;
            max-height: 2000px;

            opacity: 1;
            transition: max-height .35s cubic-bezier(.4, 0, .2, 1),
                opacity .25s ease,
                margin-top .3s ease;
            margin-top: 0;
        }

        .world-section.collapsed .levels {
            max-height: 0;
            opacity: 0;
            margin-top: 0;
            pointer-events: none;
        }


        .world-section.collapsed .world-title {
            opacity: .65;
            transition: opacity .2s ease;

            align-self: center;
            font-size: 20px;
            font-weight: 900;
            color: #E53935;
            opacity: .6;
        }


        .fixed-tips {
            margin-top: 18px;
            padding: 14px 16px;
            background: rgba(255, 255, 255, .65);
            border-radius: 14px;
            border-left: 4px solid #FF4B4B;
            font-size: 12.5px;
            line-height: 1.55;
            color: #7A1A1A;
            text-align: left;
        }

        .fixed-tips .ft-title {
            font-size: 11px;
            font-weight: 900;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: #E53935;
            margin-bottom: 6px;
        }

        .fixed-tips .ft-body b {
            color: #5C0000;
            font-weight: 900;
        }


        .victory-wave-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 120;
            overflow: hidden;
        }


        .screen-radiance {
            position: absolute;
            border-radius: 50%;
            left: 50%;
            bottom: 20%;
            width: 140vmax;
            height: 140vmax;
            transform: translate(-50%, 50%) scale(0.1);
            background: radial-gradient(circle, rgba(88, 204, 2, 0.45) 0%, rgba(88, 204, 2, 0.15) 50%, transparent 75%);
            animation: radianceExpand 1s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        @keyframes radianceExpand {
            0% {
                transform: translate(-50%, 50%) scale(0.05);
                opacity: 1;
            }

            60% {
                opacity: 0.8;
            }

            100% {
                transform: translate(-50%, 50%) scale(1.4);
                opacity: 0;
            }
        }


        .shockwave-ring {
            position: absolute;
            border-radius: 50%;
            left: 50%;
            bottom: 30%;
            transform: translate(-50%, 50%) scale(0);
            border: 4px solid #58CC02;
            box-shadow: 0 0 16px rgba(88, 204, 2, 0.8), inset 0 0 12px rgba(255, 255, 255, 0.6);
            animation: ringSurge 1.1s cubic-bezier(0.1, 0.7, 0.2, 1) forwards;
        }

        .shockwave-ring:nth-child(2) {
            border-color: #89E219;
            animation-delay: 0.15s;
            border-width: 5px;
        }

        .shockwave-ring:nth-child(3) {
            border-color: #FFFFFF;
            animation-delay: 0.3s;
            border-width: 3px;
        }

        @keyframes ringSurge {
            0% {
                width: 30px;
                height: 30px;
                opacity: 1;
                transform: translate(-50%, 50%) scale(0.2);
            }

            70% {
                opacity: 0.85;
            }

            100% {
                width: 1200px;
                height: 1200px;
                opacity: 0;
                transform: translate(-50%, 50%) scale(2.2);
            }
        }


        @keyframes svgRippleAnim {
            0% {
                r: 12px;
                stroke-width: 6px;
                opacity: 1;
            }

            100% {
                r: 42px;
                stroke-width: 0px;
                opacity: 0;
            }
        }

        .svg-click-ripple {
            fill: none;
            stroke: #1CB0F6;
            animation: svgRippleAnim 0.45s ease-out forwards;
            pointer-events: none;
        }


        .sheet-drag-handle {
            width: 44px;
            height: 5px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 99px;
            margin: -14px auto 16px;
            cursor: grab;
            touch-action: none;

        }

        .sheet {
            touch-action: pan-y;
            will-change: transform, opacity;
            transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.3, 1), opacity 0.25s ease;
        }

        .sheet.dragging {
            transition: none !important;

        }


        #splash-screen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: var(--green);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), transform 0.5s ease;
        }


        .floating-formula {
            position: absolute;
            color: rgba(255, 255, 255, 0.18);
            font-family: monospace;
            font-weight: 900;
            pointer-events: none;
            user-select: none;
            animation: floatFormula 7s ease-in-out infinite alternate;
        }

        @keyframes floatFormula {
            0% {
                transform: translateY(0px) rotate(0deg);
            }

            100% {
                transform: translateY(-35px) rotate(18deg);
            }
        }


        .splash-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            z-index: 2;
            animation: splashPulse 1.8s ease-in-out infinite alternate;
        }

        @keyframes splashPulse {
            0% {
                transform: scale(0.96);
            }

            100% {
                transform: scale(1.04);
            }
        }

        .splash-icon {
            width: 82px;
            height: 82px;
            background: #fff;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            box-shadow: 0 8px 0 var(--green-d);
        }

        .splash-title {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: -0.5px;
        }


        .splash-loader-bar {
            width: 170px;
            height: 10px;
            background: rgba(0, 0, 0, 0.18);
            border-radius: 99px;
            overflow: hidden;
            margin-top: 18px;
        }

        .splash-loader-fill {
            height: 100%;
            width: 0%;
            background: #fff;
            border-radius: 99px;
            transition: width 1.8s cubic-bezier(0.1, 0.8, 0.2, 1);
        }

        @keyframes simpleVictoryFlash {
            0% {
                opacity: .35;
            }

            100% {
                opacity: 0;
            }
        }


        .rad-badge circle {
            fill: #FFF;
            stroke: #F59E0B;
            stroke-width: 3px;
        }

        .rad-badge text {
            fill: #D97706;
            font-weight: 900;
            font-size: 13px;
        }


        .update-toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-140px);
            width: calc(100% - 32px);
            max-width: 440px;
            background: #FFFFFF;
            border: 2px solid var(--line, #E5E5E5);
            border-bottom: 5px solid var(--line-d, #CECECE);
            border-radius: 20px;
            padding: 16px 18px;
            z-index: 99999;
            box-shadow: 0 16px 36px rgba(0, 0, 0, .22);
            transition: transform .45s cubic-bezier(.34, 1.56, .64, 1);
            font-family: inherit;
        }

        .update-toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .update-card-content {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .update-icon-wrap {
            width: 52px;
            height: 52px;
            flex-shrink: 0;
            background: #EAFCF0;
            border: 2px solid #58CC02;
            border-bottom: 4px solid #46A302;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            animation: duoBob 2s ease-in-out infinite;
        }

        @keyframes duoBob {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-4px) scale(1.05);
            }
        }

        .update-info {
            flex: 1;
            min-width: 0;
        }

        .update-title {
            font-size: 16px;
            font-weight: 900;
            color: var(--ink, #3C3C3C);
            margin: 0 0 3px 0;
            line-height: 1.25;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .update-desc {
            font-size: 13px;
            font-weight: 700;
            color: var(--muted, #777777);
            margin: 0;
            line-height: 1.35;
        }

        .update-actions {
            display: flex;
            gap: 10px;
            margin-top: 14px;
        }

        .btn-update-now {
            flex: 1;
            background: var(--green, #58CC02);
            color: #FFFFFF;
            border: none;
            border-bottom: 4px solid var(--green-d, #46A302);
            border-radius: 14px;
            padding: 12px 14px;
            font-size: 14px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: .06em;
            cursor: pointer;
            transition: transform .08s ease, border-bottom-width .08s ease;
            text-align: center;
        }

        .btn-update-now:active {
            transform: translateY(3px);
            border-bottom-width: 1px;
        }

        .btn-update-later {
            background: #F7F7F7;
            color: var(--muted, #AFAFAF);
            border: 2px solid var(--line, #E5E5E5);
            border-bottom: 4px solid var(--line-d, #CECECE);
            border-radius: 14px;
            padding: 12px 16px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            transition: transform .08s ease, border-bottom-width .08s ease;
            text-align: center;
        }

        .btn-update-later:active {
            transform: translateY(3px);
            border-bottom-width: 1px;
        }
    </style>
</head>

<body>
    <div id="app"></div>
    <div id="v2-frame-wrap" style="display:none;position:fixed;inset:0;z-index:9000;background:#fff;">
        <iframe id="v2-frame" style="width:100%;height:100%;border:none;display:block;" src="about:blank"></iframe>
    </div>
    <script type="text/plain" id="v2-src">
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#58CC02">
    <title>NomenDuo v2 — Nomenclature</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        :root {
            --green: #58CC02;
            --green-d: #46A302;
            --green-l: #D7FFB8;
            --red: #FF4B4B;
            --red-d: #E53935;
            --blue: #1CB0F6;
            --blue-d: #1899D6;
            --gold: #FFC800;
            --gold-d: #E5A400;
            --purple: #CE82FF;
            --purple-d: #A568CC;
            --ink: #3C3C3C;
            --muted: #AFAFAF;
            --line: #E5E5E5;
            --bg: #FFF;
            --bg-soft: #F7F7F7;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            background: #fff;
            color: var(--ink);
            font-weight: 600;
            font-size: 15px;
            line-height: 1.4;
            -webkit-font-smoothing: antialiased;
        }

        button {
            font-family: inherit;
            cursor: pointer;
            border: none;
            background: none;
            color: inherit;
            font-weight: inherit;
        }

        #app {
            max-width: 500px;
            height: 100dvh;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            background: #fff;
            overflow: hidden;
        }


        .topbar {
            flex: none;
            padding: 14px 16px 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: #fff;
            z-index: 5;
        }

        .close-x {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: var(--muted);
            font-weight: 900;
        }

        .close-x:active {
            background: var(--bg-soft);
        }

        .progress-track {
            flex: 1;
            height: 14px;
            background: var(--line);
            border-radius: 99px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--green);
            border-radius: 99px;
            transition: width .5s cubic-bezier(.4, 0, .2, 1);
            position: relative;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            left: 8px;
            right: 8px;
            top: 3px;
            height: 4px;
            border-radius: 99px;
            background: rgba(255, 255, 255, .35);
        }

        .hearts {
            display: flex;
            align-items: center;
            gap: 4px;
            color: var(--red);
            font-weight: 900;
            font-size: 16px;
        }


        .home {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 40px;
        }

        .home-hero {
            padding: 24px 20px 12px;
            background: linear-gradient(180deg, #E8FFD0 0%, transparent 100%);
        }

        .home-hero h1 {
            font-size: 30px;
            font-weight: 900;
            letter-spacing: -.7px;
        }

        .home-hero h1 .accent {
            color: var(--green);
        }

        .home-hero p {
            color: var(--muted);
            font-weight: 700;
            font-size: 12px;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: .08em;
        }

        .worlds {
            padding: 22px 20px 0;
            display: flex;
            flex-direction: column;
            gap: 26px;
        }

        .world-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }

        .world-title .badge {
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 13px;
            letter-spacing: .1em;
            color: #fff;
            min-width: 34px;
            text-align: center;
        }

        .world-title h2 {
            font-size: 17px;
            font-weight: 900;
            letter-spacing: -.3px;
        }

        .world-title .count {
            margin-left: auto;
            font-size: 12px;
            color: var(--muted);
            font-weight: 800;
        }

        .world-subtitle {
            font-size: 12px;
            color: var(--muted);
            font-weight: 700;
            margin-bottom: 14px;
            line-height: 1.35;
        }

        .levels {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .level-row {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-soft);
            border-radius: 16px;
            padding: 12px 14px;
            border: 2px solid transparent;
            text-align: left;
            width: 100%;
            transition: transform .1s;
        }

        .level-row:active {
            transform: scale(.98);
        }

        .level-row.done {
            background: var(--green-l);
            border-color: var(--green);
        }

        .level-badge {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            flex: none;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            border: 2px solid var(--line);
            font-size: 17px;
            font-weight: 900;
            color: var(--ink);
            box-shadow: 0 3px 0 var(--line);
        }

        .level-row.done .level-badge {
            background: var(--green);
            border-color: var(--green-d);
            color: #fff;
            box-shadow: 0 3px 0 var(--green-d);
        }

        .level-meta {
            flex: 1;
            min-width: 0;
        }

        .level-meta h3 {
            font-size: 14px;
            font-weight: 900;
            letter-spacing: -.2px;
            font-family: Georgia, serif;
        }

        .level-meta p {
            font-size: 11.5px;
            color: var(--muted);
            font-weight: 700;
            margin-top: 2px;
        }

        .level-stars {
            color: var(--gold);
            font-size: 15px;
            letter-spacing: 1px;
        }

        .level-arrow {
            font-size: 18px;
            color: var(--muted);
            font-weight: 900;
        }


        .play {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100dvh;
            overflow: hidden;
        }

        .play-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 0 0 8px;
        }

        .q-block {
            padding: 4px 20px 8px;
        }

        .q-block h2 {
            font-size: 21px;
            font-weight: 900;
            letter-spacing: -.4px;
            line-height: 1.25;
        }

        .q-block p {
            font-size: 13.5px;
            color: var(--muted);
            font-weight: 700;
            margin-top: 6px;
            line-height: 1.5;
        }

        .stage {
            flex: 1;
            min-height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            position: relative;
        }

        .stage svg {
            width: 100%;
            height: 100%;
            max-height: 100%;
            overflow: visible;
        }

        .answer {
            padding: 8px 20px 12px;
        }

        .play-footer {
            flex: none;
            padding: 14px 20px calc(18px + env(safe-area-inset-bottom));
            background: #fff;
            border-top: 2px solid var(--line);
        }


        .btn-3d {
            display: block;
            width: 100%;
            padding: 16px 20px;
            background: var(--green);
            border-bottom: 5px solid var(--green-d);
            border-radius: 16px;
            color: #fff;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: .08em;
            font-size: 15px;
            transition: transform .08s, border-bottom-width .08s;
            text-align: center;
        }

        .btn-3d:active {
            transform: translateY(5px);
            border-bottom-width: 0;
        }

        .btn-3d:disabled {
            background: var(--line);
            border-bottom-color: #D4D4D4;
            color: var(--muted);
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #fff;
            color: var(--ink);
            border-bottom-color: rgba(0, 0, 0, .15);
        }

        .btn-red {
            background: var(--red);
            border-bottom-color: var(--red-d);
            color: #fff;
        }


        .func-duel {
            display: flex;
            align-items: stretch;
            gap: 8px;
        }

        .func-duel .func-btn {
            flex: 1;
        }

        .func-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .func-btn {
            padding: 18px 12px;

            background: #fff;
            border: 2px solid var(--line);
            border-bottom: 4px solid var(--line);
            border-radius: 14px;
            text-align: center;

            transition: all .12s;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .func-btn:active {
            transform: translateY(2px);
            border-bottom-width: 2px;
        }

        .func-btn.selected {
            border-color: var(--blue);
            border-bottom-color: var(--blue-d);
            background: #E8F6FE;
        }

        .func-btn.selected .fname {
            color: var(--blue-d);
        }

        .func-btn .fname {
            font-size: 14px;
            font-weight: 900;
            color: var(--ink);
        }

        .func-btn .fsuffix {
            font-family: Georgia, serif;
            font-size: 11.5px;
            font-weight: 800;
            color: var(--muted);
            font-style: italic;
        }

        .func-btn .fpicto {
            font-size: 22px;
            margin-bottom: 2px;
        }

        .vs-badge {
            align-self: center;
            font-size: 14px;
            font-weight: 900;
            color: var(--red);
            background: #fff;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            flex: none;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid var(--red);
            box-shadow: 0 3px 0 rgba(0, 0, 0, .08);
        }


        .name-slot {
            min-height: 54px;
            border: 2px dashed var(--line);
            border-radius: 14px;
            padding: 10px 14px;
            margin-bottom: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
            font-family: Georgia, serif;
            font-size: 18px;
            font-weight: 900;
            color: var(--ink);
        }

        .name-slot.empty::before {
            content: 'Touche les morceaux pour assembler le nom';
            font-family: inherit;
            font-size: 12px;
            font-weight: 700;
            color: var(--muted);
            font-style: italic;
        }

        .name-slot .piece {
            background: var(--green);
            color: #fff;
            padding: 5px 10px;
            border-radius: 9px;
            font-size: 15px;
            font-weight: 900;
            font-family: Georgia, serif;
            cursor: pointer;
            box-shadow: 0 3px 0 var(--green-d);
            animation: popIn .22s cubic-bezier(.34, 1.4, .5, 1);
        }

        @keyframes popIn {
            from {
                transform: scale(.6);
                opacity: 0;
            }
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        .chip {
            padding: 10px 15px;
            background: #fff;
            border: 2px solid var(--line);
            border-radius: 12px;
            font-family: Georgia, serif;
            font-size: 15px;
            font-weight: 900;
            color: var(--ink);
            box-shadow: 0 3px 0 var(--line);
            transition: transform .1s;
        }

        .chip:active {
            transform: translateY(3px);
            box-shadow: none;
        }

        .chip.used {
            opacity: .25;
            pointer-events: none;
        }


        .sheet-wrap {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(60, 60, 60, .5);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            animation: fadeIn .2s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
        }

        .sheet {
            width: 100%;
            max-width: 500px;
            padding: 26px 22px calc(22px + env(safe-area-inset-bottom));
            border-radius: 26px 26px 0 0;
            animation: slideUp .3s cubic-bezier(.4, 0, .2, 1);
        }

        .sheet.good {
            background: #E8FFD0;
            color: var(--green-d);
        }

        .sheet.bad {
            background: #FFEBEC;
            color: var(--red-d);
        }

        .sheet.neutral {
            background: #fff;
            color: var(--ink);
        }

        @keyframes slideUp {
            from {
                transform: translateY(60px);
                opacity: 0;
            }
        }

        .sheet-icon {
            width: 66px;
            height: 66px;
            border-radius: 50%;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 12px;
        }

        .sheet.good .sheet-icon {
            color: var(--green);
        }

        .sheet.bad .sheet-icon {
            color: var(--red);
        }

        .sheet-title {
            text-align: center;
            font-size: 20px;
            font-weight: 900;
            margin-bottom: 6px;
        }

        .sheet-text {
            text-align: center;
            font-size: 14px;
            font-weight: 700;
            line-height: 1.5;
            margin-bottom: 4px;
        }

        .sheet-text b {
            font-weight: 900;
            color: inherit;
        }

        .diag {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 99px;
            background: #fff;
            color: var(--red-d);
            font-size: 10.5px;
            font-weight: 900;
            letter-spacing: .08em;
            text-transform: uppercase;
        }

        .sheet-actions {
            margin-top: 18px;
        }

        .sheet.good .sheet-actions .btn-3d {
            background: var(--green);
            border-bottom-color: var(--green-d);
            color: #fff;
        }

        .sheet.bad .sheet-actions .btn-3d {
            background: var(--red);
            border-bottom-color: var(--red-d);
            color: #fff;
        }

        .sheet.neutral .sheet-actions .btn-3d {
            background: #fff;
            border-bottom-color: rgba(0, 0, 0, .15);
            color: var(--ink);
        }

        .cmp-wrap {
            display: flex;
            align-items: stretch;
            gap: 8px;
            margin: 14px 0 4px;
        }

        .cmp-box {
            flex: 1;
            border-radius: 14px;
            padding: 10px 12px;
            background: rgba(255, 255, 255, .75);
            text-align: center;
        }

        .cmp-label {
            font-size: 10px;
            font-weight: 900;
            letter-spacing: .12em;
            text-transform: uppercase;
            opacity: .65;
            margin-bottom: 5px;
        }

        .cmp-text {
            font-family: Georgia, serif;
            font-size: 15px;
            font-weight: 900;
            line-height: 1.25;
            word-break: break-word;
        }

        .cmp-wrong .cmp-text {
            color: #E53935;
            text-decoration: line-through;
            text-decoration-thickness: 2px;
            text-decoration-color: rgba(229, 57, 53, .4);
        }

        .cmp-good .cmp-text {
            color: #46A302;
        }

        .cmp-vs {
            align-self: center;
            font-size: 18px;
            font-weight: 900;
            color: #E53935;
            opacity: .6;
        }

            inset: 0;
            height: 100dvh;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;

            animation: fadeIn .4s;
        }

        .fs-screen.fs-win {
            background: linear-gradient(180deg, #58CC02 0%, #46A302 100%);
        }

        .fs-screen.fs-lose {
            background: linear-gradient(180deg, #FF4B4B 0%, #C62828 100%);
        }

        .fs-content {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin: auto 0;
        }

        .fs-hero {
            font-size: 100px;
            line-height: 1;
            margin-bottom: 16px;
            animation: heroIn .6s cubic-bezier(.34, 1.56, .64, 1) both;
        }

        @keyframes heroIn {
            from {
                transform: scale(.3) rotate(-15deg);
                opacity: 0;
            }
        }

        .fs-title {
            font-size: 28px;
            font-weight: 900;
            color: #fff;
            letter-spacing: -.4px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, .2);
            margin-bottom: 8px;
        }

        .fs-text {
            font-size: 16px;
            color: rgba(255, 255, 255, .92);
            font-weight: 700;
            line-height: 1.4;
            max-width: 90%;
            margin-bottom: 8px;
        }

        .fs-text b {
            color: #fff;
            font-weight: 900;
            font-family: Georgia, serif;
            font-size: 18px;
        }

        .star-row {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 12px 0 4px;
            font-size: 44px;
        }

        .star-row .st {
            display: inline-block;
            color: rgba(0, 0, 0, .22);
            transform: scale(.3);
            opacity: 0;
            animation: starIn .7s cubic-bezier(.34, 1.8, .5, 1) forwards;
        }

        .star-row .st.on {
            color: #FFC800;
            text-shadow: 0 3px 0 #E5A400;
        }

        @keyframes starIn {
            0% {
                transform: scale(0) rotate(-120deg);
                opacity: 0;
            }

            60% {
                transform: scale(1.5) rotate(15deg);
                opacity: 1;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .fs-footer {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 500px;
            display: flex;
            gap: 12px;
        }

        .fs-btn-main {
            background: #fff !important;
            border-bottom: 5px solid #E5E5E5 !important;
            font-weight: 900;
            color: #46A302 !important;
        }

        .fs-btn-sec {
            background: rgba(255, 255, 255, .2) !important;
            border-bottom: 5px solid rgba(0, 0, 0, .18) !important;
            color: #fff !important;
            backdrop-filter: blur(8px);
        }


        .toast {
            position: fixed;
            left: 50%;
            bottom: 110px;
            transform: translateX(-50%);
            max-width: 88%;
            z-index: 200;
            background: #3C3C3C;
            color: #fff;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 800;
            line-height: 1.4;
            text-align: center;
            box-shadow: 0 6px 18px rgba(0, 0, 0, .25);
            animation: popIn .25s cubic-bezier(.34, 1.4, .5, 1);
        }

        .app-shake {
            animation: shakeX .45s;
        }

        @keyframes shakeX {

            0%,
            100% {
                transform: translateX(0);
            }

            15% {
                transform: translateX(-10px);
            }

            30% {
                transform: translateX(9px);
            }

            45% {
                transform: translateX(-7px);
            }

            60% {
                transform: translateX(5px);
            }

            75% {
                transform: translateX(-3px);
            }
        }

        .svg-click-ripple {
            fill: none;
            stroke: #1CB0F6;
            animation: svgRippleAnim .45s ease-out forwards;
            pointer-events: none;
        }

        @keyframes svgRippleAnim {
            0% {
                r: 12px;
                stroke-width: 6px;
                opacity: 1;
            }

            100% {
                r: 42px;
                stroke-width: 0px;
                opacity: 0;
            }
        }

        const CARBON_GROUPS = ['C', 'CH', 'CH₂', 'CH₃', 'Cp'];
        function isCarbonGroup(el) { return CARBON_GROUPS.includes(el); }
        function isPureCarbon(el) { return el === 'C'; }

        function getGroupColor(el) {
            if (el === 'CH' || el === 'CH₂' || el === 'CH₃' || el === 'Cp') return '#4A4A4A';
            if (el === 'O' || el === 'OH' || el === 'OCH₃' || el === 'CHO') return '#EF4444';
            if (el === 'N' || el === 'NH₂' || el === 'NO₂' || el === 'CN') return '#3B82F6';
            if (el === 'Cl') return '#10B981';
            if (el === 'Br') return '#B45309';
            if (el === 'F') return '#EC4899';
            if (el === 'I') return '#8B5CF6';
            return '#CE82FF';
        }
        function getLabelSize(label) {
            const n = label.length;
            if (n <= 2) return { r: 22, fs: 15 };
            if (n <= 3) return { r: 26, fs: 13 };
            if (n <= 4) return { r: 30, fs: 11 };
            return { r: 34, fs: 10 };
        }


        function adjacencyOf(mol) {
            const adj = {};
            mol.atoms.forEach(a => adj[a.id] = []);
            mol.bonds.forEach(b => { adj[b[0]].push(b[1]); adj[b[1]].push(b[0]); });
            return adj;
        }

        function getOptimalLabelPos(mol, a, dist = 22) {
            const adj = adjacencyOf(mol);
            const nbrIds = adj[a.id] || [];
            const bondAngles = nbrIds.map(nid => {
                const nbr = mol.atoms.find(x => x.id === nid);
                return nbr ? Math.atan2(nbr.y - a.y, nbr.x - a.x) : 0;
            });
            if (bondAngles.length === 0) return { x: a.x, y: a.y - dist };
            let bestAngle = 0, maxMinDiff = -1;
            for (let deg = 0; deg < 360; deg += 10) {
                const rad = deg * (Math.PI / 180);
                let minDiff = Math.PI;
                for (const bAngle of bondAngles) {
                    let diff = Math.abs(rad - bAngle);
                    if (diff > Math.PI) diff = 2 * Math.PI - diff;
                    if (diff < minDiff) minDiff = diff;
                }
                if (minDiff > maxMinDiff) { maxMinDiff = minDiff; bestAngle = rad; }
            }
            return {
                x: a.x + Math.cos(bestAngle) * dist,
                y: a.y + Math.sin(bestAngle) * dist
            };
        }

        function bondEndRadius(a) {
            if (a.el === 'C') return 0;
            if (isCarbonGroup(a.el)) return 0;
            return getLabelSize(a.el).r;
        }
        function renderMolecule(mol, opts = {}) {
            const { chain = [], subs = [], interactive = false } = opts;
            const numbering = {};
            chain.forEach((id, i) => numbering[id] = i + 1);
            const chainSet = new Set(chain);
            const chainBondKeys = new Set();
            for (let i = 0; i < chain.length - 1; i++) {
                chainBondKeys.add([chain[i], chain[i + 1]].sort().join('-'));
            }

            if (chain.length >= 3) {
                const closingKey = [chain[0], chain[chain.length - 1]].sort().join('-');
                if (mol.bonds.some(b => [b[0], b[1]].sort().join('-') === closingKey)) {
                    chainBondKeys.add(closingKey);
                }
            }

            const pad = 60;
            const xs = mol.atoms.map(a => a.x);
            const ys = mol.atoms.map(a => a.y);
            const minX = Math.min(...xs) - pad, maxX = Math.max(...xs) + pad;
            const minY = Math.min(...ys) - pad, maxY = Math.max(...ys) + pad;
            const vw = maxX - minX, vh = maxY - minY;

            let svg = `<svg viewBox="${minX} ${minY} ${vw} ${vh}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">`;


            mol.bonds.forEach(bd => {
                const a1 = mol.atoms.find(a => a.id === bd[0]);
                const a2 = mol.atoms.find(a => a.id === bd[1]);
                if (!a1 || !a2) return;
                const key = [bd[0], bd[1]].sort().join('-');
                const inChain = chainBondKeys.has(key);
                const color = inChain ? '#58CC02' : '#4A4A4A';
                const width = inChain ? 5.5 : 3.0;
                const r1 = bondEndRadius(a1), r2 = bondEndRadius(a2);
                svg += bondPath(a1, a2, bd[2] || 1, color, width, r1, r2);
            });


            mol.atoms.forEach(a => {
                const inChain = chainSet.has(a.id);
                const isSub = subs.includes(a.id);
                svg += `<g class="atom-hit" ${interactive ? `data-atom="${a.id}"` : ''}>`;
                svg += `<circle cx="${a.x}" cy="${a.y}" r="28" fill="#000" opacity="0" style="pointer-events:all;cursor:pointer;"/>`;

                if (isPureCarbon(a.el)) {
                    if (inChain || isSub) {
                        const color = isSub ? '#FFC800' : '#58CC02';
                        svg += `<circle class="atom-shape" cx="${a.x}" cy="${a.y}" r="5.5" fill="${color}" stroke="#fff" stroke-width="1.5"/>`;
                    } else {
                        svg += `<circle class="atom-shape" cx="${a.x}" cy="${a.y}" r="6" fill="transparent" stroke="none"/>`;
                    }
                } else if (isCarbonGroup(a.el)) {

                    if (inChain || isSub) {
                        const color = isSub ? '#FFC800' : '#58CC02';
                        svg += `<circle class="atom-shape" cx="${a.x}" cy="${a.y}" r="5.5" fill="${color}" stroke="#fff" stroke-width="1.5"/>`;
                    } else {
                        svg += `<circle class="atom-shape" cx="${a.x}" cy="${a.y}" r="6" fill="transparent" stroke="none"/>`;
                    }
                } else {

                    let bgColor = getGroupColor(a.el);
                    if (isSub) bgColor = '#FFC800';
                    const sz = getLabelSize(a.el);
                    svg += `<circle class="atom-shape" cx="${a.x}" cy="${a.y}" r="${sz.r}" fill="${bgColor}" stroke="#fff" stroke-width="2.5"/>`;
                    svg += `<text x="${a.x}" y="${a.y + sz.fs * 0.35}" text-anchor="middle" font-size="${sz.fs}" font-weight="900" fill="#fff" font-family="-apple-system,sans-serif">${a.el}</text>`;
                }

                if (numbering[a.id]) {
                    const pos = getOptimalLabelPos(mol, a, 26);
                    svg += `<text x="${pos.x}" y="${pos.y + 4}" text-anchor="middle" font-size="13" font-weight="900" fill="#46A302" font-family="-apple-system,sans-serif" class="num-badge">${numbering[a.id]}</text>`;
                }
                svg += '</g>';
            });


            if (mol.isAromatic && mol.chain && mol.chain.length >= 6) {
                const ringAtoms = mol.chain.map(id => mol.atoms.find(a => a.id === id)).filter(Boolean);
                const cx = ringAtoms.reduce((s, a) => s + a.x, 0) / ringAtoms.length;
                const cy = ringAtoms.reduce((s, a) => s + a.y, 0) / ringAtoms.length;
                const rx = Math.max(...ringAtoms.map(a => Math.abs(a.x - cx)));
                const ry = Math.max(...ringAtoms.map(a => Math.abs(a.y - cy)));
                const r = Math.min(rx, ry) * 0.55;
                svg += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#4A4A4A" stroke-width="3" opacity="0.55"/>`;
            }

            svg += '</svg>';
            return svg;
        }

        function bondPath(a1, a2, order, color, width, r1, r2) {
            const dx = a2.x - a1.x, dy = a2.y - a1.y;
            const len = Math.hypot(dx, dy) || 1;
            const ux = dx / len, uy = dy / len;
            const px = -uy, py = ux;
            const x1 = a1.x + ux * r1, y1 = a1.y + uy * r1;
            const x2 = a2.x - ux * r2, y2 = a2.y - uy * r2;
            const isChain = width > 4;
            const hitLine = `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#000" opacity="0" stroke-width="28" class="bond-hit" style="pointer-events:stroke;cursor:pointer;"/>`;
            let inner = '';
            if (order === 1) {
                const w = isChain ? 5.5 : 3.0;
                inner = `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${w}" stroke-linecap="round"/>`;
            } else if (order === 2) {
                const off = isChain ? 5.0 : 4.0, w = isChain ? 3.0 : 2.5;
                const ox = px * off, oy = py * off;
                const attr = `stroke="${color}" stroke-width="${w}" stroke-linecap="round"`;
                inner = `<line x1="${x1 + ox}" y1="${y1 + oy}" x2="${x2 + ox}" y2="${y2 + oy}" ${attr}/>`
                    + `<line x1="${x1 - ox}" y1="${y1 - oy}" x2="${x2 - ox}" y2="${y2 - oy}" ${attr}/>`;
            } else {
                const off = isChain ? 6.8 : 5.5, w = isChain ? 2.6 : 2.2;
                const ox = px * off, oy = py * off;
                const attr = `stroke="${color}" stroke-width="${w}" stroke-linecap="round"`;
                inner = `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" ${attr}/>`
                    + `<line x1="${x1 + ox}" y1="${y1 + oy}" x2="${x2 + ox}" y2="${y2 + oy}" ${attr}/>`
                    + `<line x1="${x1 - ox}" y1="${y1 - oy}" x2="${x2 - ox}" y2="${y2 - oy}" ${attr}/>`;
            }
            const gid = [a1.id, a2.id].sort().join('-');
            return `<g class="bond" data-bond="${gid}" data-order="${order}">${hitLine}${inner}</g>`;
        }

        function startRandomV2(fromW, fromL) {

        function prepareSteps(mol, rawSteps) {

            let steps = rawSteps.filter(step => {
                if (step === 'func' && mol.functionChoices.length <= 1) return false;
                if (step === 'chain' && mol.chain.length <= 1) return false;
                return true;
            });

            const order = ['func', 'chain', 'subs', 'name'];
            steps = steps.slice().sort((a, b) => order.indexOf(a) - order.indexOf(b));

            if (!steps.includes('name')) steps.push('name');
            return steps;
        }

        function renderStep(step, mol) {
            if (step === 'func') {

                const correctId = mol.priorityFunction;
                const correctFunc = ALL_FUNCTIONS.find(f => f.id === correctId) || { id: correctId, label: mol.functionChoices[0].label };

                let pool = ALL_FUNCTIONS.filter(f => f.id !== correctId);
                pool = shuffle(pool).slice(0, 5);

                let finalChoices = [correctFunc, ...pool];
                finalChoices = shuffle(finalChoices);

                let buttonsHTML = `<div class="func-grid">
                ${finalChoices.map(c => `<button class="func-btn" data-fid="${c.id}">
                    <div class="fname">${c.label}</div>
                </button>`).join('')}
            </div>`;

                return {
                    title: 'Fonction prioritaire',
                    subtitle: 'Quelle fonction donne le suffixe ?',
                    molecule: renderMolecule(mol),
                    answers: buttonsHTML
                };
            }

            if (step === 'chain') {
                const tapped = state.stepState.tapped || [];
                return {
                    title: 'Chaîne principale',
                    subtitle: 'Touche les carbones dans l\'ordre de numérotation.',
                    molecule: renderMolecule(mol, { chain: tapped, interactive: true }),
                    answers: `<div style="text-align:center;color:#AFAFAF;font-weight:800;font-size:13px">
                Atomes : <b style="color:#58CC02" id="chain-count">${tapped.length}</b>
            </div>`
                };
            }

            if (step === 'name') {
                const pool = buildNamePool(mol);
                const selected = state.stepState.namePieces || [];
                const usedSet = new Set(selected);
                let poolHTML = '';
                pool.forEach(tok => {
                    const used = usedSet.has(tok) ? ' used' : '';
                    poolHTML += `<button class="chip${used}" data-tok="${escapeHtml(tok)}">${escapeHtml(tok)}</button>`;
                });
                let slotHTML = '';
                selected.forEach(tok => {
                    slotHTML += `<span class="piece" data-tok="${escapeHtml(tok)}">${escapeHtml(tok)}</span>`;
                });
                return {
                    title: 'Assemble le nom',
                    subtitle: 'Touche les morceaux dans le bon ordre.',
                    molecule: renderMolecule(mol, { chain: state.chainSequence }),
                    answers: `<div class="name-slot${selected.length === 0 ? ' empty' : ''}" id="name-slot">${slotHTML}</div>
                     <div class="chips" id="chips">${poolHTML}</div>`
                };
            }

            return { title: '', subtitle: '', molecule: '', answers: '' };
        }
