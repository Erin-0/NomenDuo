        function fallbackVariants(tok) {
            const out = [];
            const numMatch = tok.match(/(\d+)/);
            if (numMatch) {
                const n = parseInt(numMatch[1], 10);
                [n + 1, n - 1].forEach(nn => {
                    if (nn > 0 && nn !== n) out.push(tok.replace(numMatch[1], String(nn)));
                });
            }
            if (tok.startsWith('cyclo')) out.push(tok.slice(5));
            if (tok.endsWith('ane')) out.push(tok.slice(0, -3) + 'ène');
            if (tok.endsWith('ène')) out.push(tok.slice(0, -3) + 'ane');
            return out;
        }


        function generateSmartDistractors(mol) {
            const correctSet = new Set(mol.tokens);
            const nameDistractors = new Set();
            const locantDistractors = new Set();

            mol.tokens.forEach(tok => {

                let variants = FRAGMENT_ALTERNATIVES[tok] || [];


                if (variants.length === 0) {
                    if (tok.includes('ényl')) variants.push(tok.replace('ényl', 'ynyl'), tok.replace('ényl', 'yl'));
                    if (tok.includes('ynyl')) variants.push(tok.replace('ynyl', 'ényl'), tok.replace('ynyl', 'yl'));
                    if (tok.includes('chloro')) variants.push(tok.replace('chloro', 'bromo'), tok.replace('chloro', 'fluoro'));
                    if (tok.includes('bromo')) variants.push(tok.replace('bromo', 'chloro'), tok.replace('bromo', 'iodo'));
                    if (tok.includes('méthyl')) variants.push(tok.replace('méthyl', 'éthyl'));
                    if (tok.includes('éthyl')) variants.push(tok.replace('éthyl', 'méthyl'), tok.replace('éthyl', 'propyl'));
                    if (tok.startsWith('N-')) variants.push(tok.replace('N-', 'N,N-di'), tok.replace('N-', ''));
                }

                variants.forEach(v => {
                    if (v && v.trim() && !correctSet.has(v)) nameDistractors.add(v);
                });


                const numMatch = tok.match(/^(\d+)(.*)$/);
                if (numMatch) {
                    const n = parseInt(numMatch[1], 10);
                    const altNum = (n === 1) ? 2 : (n - 1);
                    const locVariant = altNum + numMatch[2];
                    if (!correctSet.has(locVariant)) locantDistractors.add(locVariant);
                }
            });


            const finalPicks = shuffle([...nameDistractors]);


            if (finalPicks.length < 5) {
                finalPicks.push(...shuffle([...locantDistractors]).slice(0, 2));
            }

            return finalPicks;
        }


        function buildNamePool(mol) {
            const correct = mol.tokens.slice();
            const correctSet = new Set(correct);
            const pool = new Set(correct);


            (mol.distractors || []).forEach(d => {
                if (d && d.trim() && !correctSet.has(d)) pool.add(d);
            });


            generateSmartDistractors(mol).forEach(d => pool.add(d));


            const arr = [...pool];
            if (arr.length > 9) {
                const manual = (mol.distractors || []).filter(x => pool.has(x));
                const auto = arr.filter(x => !correctSet.has(x) && !manual.includes(x));
                const needed = Math.max(0, 9 - correct.length - manual.length);
                return shuffle([...correct, ...manual, ...shuffle(auto).slice(0, needed)]);
            }

            return shuffle(arr);
        }

        function attachStepListeners(step, mol) {
            const stage = document.getElementById('stage');

            if (step === 'func') {
                const answerBox = document.getElementById('answer');
                answerBox.querySelectorAll('.func-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        answerBox.querySelectorAll('.func-btn').forEach(b => b.classList.remove('selected'));
                        btn.classList.add('selected');
                        state.stepState.chosenFunction = btn.dataset.fid;
                        updateVerifyState();
                    });
                });
            }

            if (step === 'chain') {
                const svg = stage.querySelector('svg');
                stage.querySelectorAll('[data-atom]').forEach(g => {
                    g.addEventListener('click', () => {
                        const id = g.dataset.atom;
                        const atom = mol.atoms.find(a => a.id === id);
                        if (!atom) return;
                        if (!isCarbonGroup(atom.el)) {
                            shakeApp();
                            toast('❌ <b>' + atom.el + '</b> ne peut pas être dans la chaîne.');
                            return;
                        }
                        triggerSvgRipple(svg, atom.x, atom.y);
                        let seq = (state.stepState.tapped || []).slice();
                        const idx = seq.indexOf(id);
                        if (idx >= 0) seq = seq.slice(0, idx);
                        else if (seq.length === 0) seq = [id];
                        else {
                            const last = seq[seq.length - 1];
                            const bonded = mol.bonds.some(b =>
                                (b[0] === last && b[1] === id) || (b[1] === last && b[0] === id));
                            if (!bonded) { shakeApp(); toast('⚠️ Touche un carbone adjacent.'); return; }
                            seq.push(id);
                        }
                        state.stepState.tapped = seq;

                        const chainBondKeys = new Set();
                        for (let i = 0; i < seq.length - 1; i++) {
                            chainBondKeys.add([seq[i], seq[i + 1]].sort().join('-'));
                        }

                        if (seq.length >= 3) {
                            const closingKey = [seq[0], seq[seq.length - 1]].sort().join('-');
                            if (mol.bonds.some(b => [b[0], b[1]].sort().join('-') === closingKey)) {
                                chainBondKeys.add(closingKey);
                            }
                        }
                        stage.querySelectorAll('.bond').forEach(bondG => {
                            const inChain = chainBondKeys.has(bondG.dataset.bond);
                            const order = parseInt(bondG.dataset.order || '1', 10);
                            let sw = inChain ? '5.5' : '3.0';
                            if (order === 2) sw = inChain ? '3.0' : '2.5';
                            if (order === 3) sw = inChain ? '2.6' : '2.2';
                            bondG.querySelectorAll('line').forEach(line => {
                                line.setAttribute('stroke', inChain ? '#58CC02' : '#4A4A4A');
                                line.setAttribute('stroke-width', sw);
                            });
                        });
                        stage.querySelectorAll('[data-atom]').forEach(elG => {
                            const aId = elG.dataset.atom;
                            const aData = mol.atoms.find(a => a.id === aId);
                            if (!aData) return;
                            const isSel = seq.includes(aId);
                            if (isPureCarbon(aData.el) || isCarbonGroup(aData.el)) {
                                const sh = elG.querySelector('.atom-shape');
                                if (sh) {
                                    sh.setAttribute('r', isSel ? '5.5' : '6');
                                    sh.setAttribute('fill', isSel ? '#58CC02' : 'transparent');
                                    sh.setAttribute('stroke', isSel ? '#fff' : 'none');
                                    sh.setAttribute('stroke-width', isSel ? '1.5' : '0');
                                }
                            } else if (isCarbonGroup(aData.el)) {
                                const sh = elG.querySelector('.atom-shape');
                                if (sh) sh.setAttribute('fill', isSel ? '#46A302' : '#4A4A4A');
                            }
                            elG.querySelectorAll('.num-badge').forEach(b => b.remove());
                            const orderNum = seq.indexOf(aId) + 1;
                            if (orderNum > 0) {
                                const pos = getOptimalLabelPos(mol, aData, 26);
                                const badge = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                                badge.setAttribute('class', 'num-badge');
                                badge.setAttribute('x', pos.x);
                                badge.setAttribute('y', pos.y + 4);
                                badge.setAttribute('text-anchor', 'middle');
                                badge.setAttribute('font-size', '13');
                                badge.setAttribute('font-weight', '900');
                                badge.setAttribute('fill', '#46A302');
                                badge.setAttribute('font-family', '-apple-system,sans-serif');
                                badge.textContent = orderNum;
                                elG.appendChild(badge);
                            }
                        });
                        const cnt = document.getElementById('chain-count');
                        if (cnt) cnt.textContent = seq.length;
                        updateVerifyState();
                    });
                });
            }

            if (step === 'name') {
                const chipsBox = document.getElementById('chips');
                const slot = document.getElementById('name-slot');
                const refreshSlot = () => {
                    const arr = (state.stepState.namePieces || []);
                    const usedSet = new Set(arr);
                    chipsBox.querySelectorAll('.chip').forEach(c => {
                        c.classList.toggle('used', usedSet.has(c.dataset.tok));
                    });
                    slot.innerHTML = '';
                    arr.forEach(tok => {
                        const piece = el('<span class="piece">' + escapeHtml(tok) + '</span>');
                        piece.addEventListener('click', () => {
                            const cur = (state.stepState.namePieces || []).slice();
                            const i = cur.indexOf(tok);
                            if (i >= 0) cur.splice(i, 1);
                            state.stepState.namePieces = cur;
                            refreshSlot();
                            updateVerifyState();
                        });
                        slot.appendChild(piece);
                    });
                    slot.classList.toggle('empty', arr.length === 0);
                };
                chipsBox.querySelectorAll('.chip').forEach(c => {
                    c.addEventListener('click', () => {
                        const tok = c.dataset.tok;
                        const arr = (state.stepState.namePieces || []).slice();
                        if (arr.includes(tok)) return;
                        arr.push(tok);
                        state.stepState.namePieces = arr;
                        refreshSlot();
                        updateVerifyState();
                    });
                });
                refreshSlot();
            }
        }

        function triggerSvgRipple(svg, cx, cy) {
            const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            c.setAttribute('cx', cx); c.setAttribute('cy', cy);
            c.setAttribute('class', 'svg-click-ripple');
            svg.appendChild(c);
            setTimeout(() => c.remove(), 500);
        }

        function updateVerifyState() {
            const btn = document.getElementById('btn-verify');
            if (!btn) return;
            const step = state.steps[state.stepIdx];
            const q = state.stepState;
            let ready = false;
            if (step === 'func') ready = !!q.chosenFunction;
            else if (step === 'chain') ready = (q.tapped || []).length >= 2;
            else if (step === 'name') ready = (q.namePieces || []).length >= 1;
            btn.disabled = !ready;
        }


        function verifyStep() {
            const step = state.steps[state.stepIdx];
            const mol = currentMol();
            const q = state.stepState;
            let ok = false, title = '', text = '', diag = '', compare = null;

            if (step === 'func') {
                const chosen = q.chosenFunction;
                const correct = mol.priorityFunction;
                if (chosen === correct) {
                    ok = true;
                    title = 'Fonction prioritaire correcte';
                    text = 'Elle donne le suffixe et impose la numérotation.';
                } else {
                    diag = 'Priorité';
                    title = 'Fonction prioritaire incorrecte';

                    const correctLabel = (ALL_FUNCTIONS.find(c => c.id === correct) || { label: correct }).label;
                    const chosenLabel = (ALL_FUNCTIONS.find(c => c.id === chosen) || { label: chosen }).label;
                    text = `Tu as choisi <b>${chosenLabel}</b>. C'est la <b>${correctLabel}</b> qui est prioritaire.`;
                }
            }
            else if (step === 'chain') {
                const tapped = q.tapped || [];
                const correctChain = mol.chain;


                if (!sameSet(tapped, correctChain)) {
                    diag = 'Chaîne';
                    title = 'Mauvaise sélection';
                    text = `La chaîne doit contenir exactement <b>${correctChain.length}</b> carbones, dont la fonction principale.`;
                }

                else if (tapped[0] !== correctChain[0]) {
                    diag = 'Direction';
                    title = 'Mauvais sens de numérotation';
                    text = 'Sélection correcte, mais commence par l\'autre extrémité (C1 = fonction prioritaire).';
                }

                else {
                    const isDirectMatch = tapped.every((id, i) => id === correctChain[i]);


                    const isCycle = (mol.ringOrder || mol.isAromatic || (mol.family && mol.family.includes('cycl')));
                    let isAllowedReverse = false;


                    if (isCycle && !isDirectMatch) {
                        const reverseChain = [correctChain[0], ...correctChain.slice(1).reverse()];
                        const isReverseMatch = tapped.every((id, i) => id === reverseChain[i]);

                        if (isReverseMatch) {

                            const getLocs = (seq) => {
                                const rSet = new Set(seq);
                                return seq.map((aId, idx) => {
                                    const hasBranch = mol.bonds.some(b =>
                                        (b[0] === aId && !rSet.has(b[1])) ||
                                        (b[1] === aId && !rSet.has(b[0]))
                                    );
                                    return hasBranch ? (idx + 1) : null;
                                }).filter(Boolean);
                            };

                            const locsForward = getLocs(correctChain);
                            const locsReverse = getLocs(reverseChain);


                            if (locsForward.join(',') === locsReverse.join(',')) {
                                isAllowedReverse = true;
                            }
                        }
                    }

                    if (isDirectMatch || isAllowedReverse) {
                        ok = true;
                        state.chainSequence = tapped;
                        title = 'Chaîne correcte';
                        text = `<b>${tapped.length}</b> carbones, numérotation correcte.`;
                    } else {
                        diag = 'Direction';
                        title = isCycle ? 'Mauvais sens de rotation' : 'Ordre incorrect';
                        text = isCycle
                            ? 'Tu as commencé par le bon carbone (C1), mais tu as tourné dans le <b>mauvais sens</b> autour du cycle (indices trop élevés : 1,5,6 au lieu de 1,2,3).'
                            : 'Les carbones n\'ont pas été sélectionnés dans le bon ordre.';
                    }
                }
            }
            else if (step === 'name') {
                const pieces = q.namePieces || [];
                const proposed = normalize(pieces.join(''));
                const correct = normalize(mol.name);
                if (proposed === correct) {
                    ok = true;
                    title = 'Nom correct !';
                    text = `<b>${mol.name}</b>`;
                } else {
                    diag = 'Nom';
                    title = 'Presque…';
                    text = 'Assemblage incorrect.';

            }

                state.mistakes++;
                state.hearts = Math.max(0, state.hearts - 1);
                saveAll();
                if (state.hearts <= 0) { showHeartsOut(); return; }
            }
            showSheet({ ok, title, text, diag, onContinue: ok ? nextStep : null, compare });
        }

            const cmpHTML = compare

            <div class="cmp-box cmp-wrong">
                <div class="cmp-label">Ta réponse</div>

            <div class="cmp-vs">→</div>
            <div class="cmp-box cmp-good">
                <div class="cmp-label">Correct</div>
                <div class="cmp-text">${escapeHtml(compare.correct)}</div>
            </div>
        </div>`
                : '';
            const wrap = el(`
        <div class="sheet-wrap">
            <div class="sheet ${ok ? 'good' : 'bad'}">
                <div class="sheet-icon">${ok ? '✓' : '✕'}</div>
                ${(!ok && diag) ? `<div style="text-align:center;margin-bottom:10px"><span class="diag">${diag}</span></div>` : ''}
                <div class="sheet-title">${title}</div>
                <div class="sheet-text">${text}</div>
                ${cmpHTML}
                <div class="sheet-actions">
                    <button class="btn-3d" id="sheet-btn">${onContinue ? 'Continuer' : 'Réessayer'}</button>
                </div>
            </div>
        </div>
    `);
            document.body.appendChild(wrap);
            if (!ok) shakeApp();
            wrap.querySelector('#sheet-btn').addEventListener('click', () => {
                wrap.remove();
                if (onContinue) onContinue();
                else { state.stepState = {}; renderPlay(); }
            });
        }


        function showHeartsOut() {
            const wrap = el(`
        <div class="fs-screen fs-lose">
            <div class="fs-content">

            <div class="fs-footer">
                <button class="btn-3d fs-btn-main" id="sheet-btn" style="flex:1">Retour aux missions</button>
            </div>
        </div>
    `);
            document.body.appendChild(wrap);
            shakeApp();
            wrap.querySelector('#sheet-btn').addEventListener('click', () => {
                wrap.remove();
                state.hearts = 3;
                saveAll();
                exitV2Home();
            });
        }


        function nextStep() {
            state.stepIdx++;
            if (state.stepIdx >= state.steps.length) finishLevel();
            else { state.stepState = {}; renderPlay(); }
        }

        function finishLevel() {
            const world = WORLDS[state.worldIdx];
            const key = world.id + ':' + state.levelIdx;
            const stars = state.mistakes === 0 ? 3 : state.mistakes === 1 ? 2 : 1;
            const prev = state.progress[key];
            state.progress[key] = { done: true, stars: Math.max(stars, prev?.stars || 0) };
            saveAll();
            const mol = MOLECULES[world.levels[state.levelIdx].mol];
            const curW = state.worldIdx, curL = state.levelIdx;
            const isRandom = !!state.random;


            if (window.parent !== window) {

                window.parent.postMessage({
                    type: 'v2-win',
                    molName: mol.name,
                    stars: stars,
                    worldId: world.id,
                    worldIdx: state.worldIdx,
                    levelIdx: state.levelIdx,
                    isRandom: !!state.random
                }, '*');
                return;
            }

            const hasNext = isRandom || curL < world.levels.length - 1;
            const nextLabel = isRandom ? '🎲 Défi suivant' : (hasNext ? 'Suivant →' : 'Terminer');
            const homeLabel = isRandom ? '← Retour' : 'Missions';

            const wrap = el(`
                <div class="fs-screen fs-win">

                </div>
            </div>
            <div class="fs-footer">
                <button class="btn-3d fs-btn-sec" id="btn-home" style="flex:1">${homeLabel}</button>
                <button class="btn-3d fs-btn-main" id="btn-next" style="flex:1">${nextLabel}</button>
            </div>
        </div>
    `);
            document.body.appendChild(wrap);
            wrap.querySelector('#btn-home').addEventListener('click', () => {
                wrap.remove();
                if (isRandom) exitV2Home();
                else renderHome();
            });

            wrap.querySelector('#btn-next').addEventListener('click', () => {
                wrap.remove();
                if (isRandom) startRandomV2(curW, curL);
                else if (hasNext) openLevel(curW, curL + 1);
                else renderHome();
            });

        }

        function showQuitConfirm() {
            const wrap = el(`
        <div class="sheet-wrap">

            WORLDS.forEach((w, wi) => w.levels.forEach((_, li) => {
                all.push([wi, li]);
            }));


            const recent = new Set(history.map(h => h[0] + ':' + h[1]));
            recent.add(excludeW + ':' + excludeL);

            let pool = all.filter(([wi, li]) => !recent.has(wi + ':' + li));


            if (pool.length === 0) {
                history = [];
                pool = all.filter(([wi, li]) => !(wi === excludeW && li === excludeL));
            }


            const [wi, li] = pool[Math.floor(Math.random() * pool.length)];


            history.push([wi, li]);
            if (history.length > RANDOM_HISTORY_MAX) history.shift();
            try {
                localStorage.setItem('nomenduo_rnd_hist', JSON.stringify(history));
            } catch (e) { }

            return [wi, li];
        }
        function startRandom(fromW, fromL) {
            state._lastPct = null;
            const [wi, li] = pickRandomLevel(fromW, fromL);
            openLevel(wi, li, true);
        }



        const CHAIN_PREFIXES = ['méth', 'éth', 'prop', 'but', 'pent', 'hex', 'hept', 'oct', 'non', 'déc', 'undéc', 'dodéc'];
        const CHAIN_SUFFIXES = ['ane', 'ène', 'yne'];
        const UNSAT_SUFFIXES = ['ène', 'yne'];


        const ALKYL_FAMILIES = [
            ['méthyl'],
            ['éthyl'],
            ['propyl', 'isopropyle'],
            ['butyl', 'isobutyle', 'sec-butyle', 'tert-butyle'],
            ['pentyl', 'isopentyle', 'néopentyle'],
        ];


        const HALO_FAMILY = ['fluoro', 'chloro', 'bromo', 'iodo'];


        function detectChainPrefix(word) {
            const lower = word.toLowerCase();
            for (let i = CHAIN_PREFIXES.length - 1; i >= 0; i--) {
                if (lower.startsWith(CHAIN_PREFIXES[i])) {
                    return { prefix: CHAIN_PREFIXES[i], rest: word.slice(CHAIN_PREFIXES[i].length), index: i };
                }
            }
            return null;
        }


        function chainNameVariants(word) {
            const out = new Set();
            const lower = word.toLowerCase();
            const cp = detectChainPrefix(word);


            if (cp) {
                for (const di of [-2, -1, 1, 2]) {
                    const ni = cp.index + di;
                    if (ni < 0 || ni >= CHAIN_PREFIXES.length) continue;
                    out.add(CHAIN_PREFIXES[ni] + cp.rest);
                }
            }


            for (const s of UNSAT_SUFFIXES) {
                if (lower.endsWith(s) && lower.length > s.length + 1) {
                    for (const s2 of UNSAT_SUFFIXES) {
                        if (s2 !== s) out.add(word.slice(0, -s.length) + s2);
                    }
                    if (!/\d/.test(word)) out.add(word.slice(0, -s.length) + 'ane');
                    break;
                }
            }

            if (lower.endsWith('diène')) out.add(word.slice(0, -5) + 'diyne');
            if (lower.endsWith('diyne')) out.add(word.slice(0, -5) + 'diène');


            if (lower.startsWith('cyclo')) {
                out.add(word.slice(5));
            } else if (cp && cp.index >= 2) {
                out.add('cyclo' + word);
            }

            return [...out];
        }


        function alkylVariants(word) {
            const out = new Set();
            const lower = word.toLowerCase();
            for (let fi = 0; fi < ALKYL_FAMILIES.length; fi++) {
                const fam = ALKYL_FAMILIES[fi];
                for (const member of fam) {
                    if (lower.includes(member)) {

                        for (const other of fam) {
                            if (other !== member) out.add(word.replace(member, other));
                        }

                        if (fi > 0) out.add(word.replace(member, ALKYL_FAMILIES[fi - 1][0]));
                        if (fi < ALKYL_FAMILIES.length - 1) out.add(word.replace(member, ALKYL_FAMILIES[fi + 1][0]));
                        return [...out];
                    }
                }
            }
            return [...out];
        }


        function haloVariants(word) {
            const out = new Set();
            const lower = word.toLowerCase();
            for (const h of HALO_FAMILY) {
                if (lower.includes(h)) {
                    for (const other of HALO_FAMILY) {
                        if (other !== h) out.add(word.replace(h, other));
                    }
                    return [...out];
                }
            }
            return [...out];
        }


        function unsatVariants(word) {
            const out = new Set();
            const lower = word.toLowerCase();
            if (lower.includes('én')) out.add(word.replace(/én/g, 'yn'));
            if (lower.includes('yn')) out.add(word.replace(/yn/g, 'én'));
            if (lower.includes('diène')) out.add(word.replace('diène', 'diyne'));
            if (lower.includes('diyne')) out.add(word.replace('diyne', 'diène'));
            return [...out];
        }


        function generateLocantVariants(token) {
            const variants = new Set();
            let m = token.match(/^(-?)(\d+(?:,\d+)*)-(.*)$/);
            if (!m) return [];
            const sign = m[1], nums = m[2].split(',').map(Number), suffix = m[3];
            for (let i = 0; i < nums.length; i++) {
                for (const d of [-1, 1]) {
                    if (nums[i] + d >= 1) {
                        const nn = nums.slice(); nn[i] = nums[i] + d;
                        nn.sort((a, b) => a - b);
                        variants.add(sign + nn.join(',') + '-' + suffix);
                    }
                }
            }
            return [...variants];
        }


        const GENERIC_NAME_POOL = [
            'méthane', 'éthane', 'propane', 'butane', 'pentane', 'hexane', 'heptane', 'octane',
            'éthène', 'propène', 'but-1-ène', 'but-2-ène',
            'éthyne', 'propyne', 'but-1-yne', 'but-2-yne',
            'cyclopropane', 'cyclobutane', 'cyclopentane', 'cyclohexane',
        ];


        function buildNamePool(mol, targetSize = 15) {
            const correct = mol.tokens.slice();
            const correctStr = correct.join('').toLowerCase().replace(/\s/g, '');
            const out = new Set(correct);


            (mol.distractors || []).forEach(d => out.add(d));


            correct.forEach(tok => {
                alkylVariants(tok).forEach(v => out.add(v));
                haloVariants(tok).forEach(v => out.add(v));
                chainNameVariants(tok).forEach(v => out.add(v));
                unsatVariants(tok).forEach(v => out.add(v));
            });


            correct.forEach(tok => {
                const lv = shuffle(generateLocantVariants(tok));
                if (lv.length) out.add(lv[0]);
            });


            [...out].forEach(x => {
                if (!x || !x.trim()) out.delete(x);
                if (x.toLowerCase().replace(/\s/g, '') === correctStr && !correct.includes(x)) out.delete(x);
            });


            if (out.size < 8) {
                for (const g of shuffle(GENERIC_NAME_POOL)) {
                    if (out.size >= 10) break;
                    if (g.toLowerCase().replace(/\s/g, '') === correctStr) continue;
                    out.add(g);
                }
            }


            let arr = [...out];
            const maxSize = Math.max(targetSize, correct.length + 8);
            if (arr.length > maxSize) {
                const correctInArr = arr.filter(x => correct.includes(x));
                const handPicked = (mol.distractors || []).filter(x => arr.includes(x));
                const rest = shuffle(arr.filter(x => !correct.includes(x) && !handPicked.includes(x)));
                const keepRest = Math.max(0, maxSize - correctInArr.length - handPicked.length);
                arr = [...correctInArr, ...handPicked, ...rest.slice(0, keepRest)];
            }

            return shuffle(arr);
        }


        const HALOGENS = { F: 'fluoro', Cl: 'chloro', Br: 'bromo', I: 'iodo' };

        function adjacencyOf(mol) {
            const adj = {};
            mol.atoms.forEach(a => adj[a.id] = []);
            mol.bonds.forEach(b => { adj[b[0]].push(b[1]); adj[b[1]].push(b[0]); });
            return adj;
        }


        const _chainCache = {};

        function getValidChains(mol) {
            if (_chainCache[mol.id]) return _chainCache[mol.id];
            const adj = adjacencyOf(mol);
            const elOf = {}; mol.atoms.forEach(a => elOf[a.id] = a.el);
            const orderOf = (a, b) => {
                const bd = mol.bonds.find(x => (x[0] === a && x[1] === b) || (x[0] === b && x[1] === a));
                return bd ? (bd[2] || 1) : 1;
            };

            const paths = [];
            const dfs = (path, mult) => {
                paths.push({ path: path.slice(), mult });
                const last = path[path.length - 1];
                (adj[last] || []).forEach(n => {
                    if (elOf[n] !== 'C' || path.includes(n)) return;
                    path.push(n);
                    dfs(path, mult + (orderOf(last, n) > 1 ? 1 : 0));
                    path.pop();
                });
            };
            mol.atoms.filter(a => a.el === 'C').forEach(a => dfs([a.id], 0));


            const maxMult = Math.max(...paths.map(p => p.mult));
            const m1 = paths.filter(p => p.mult === maxMult);


            const maxLen = Math.max(...m1.map(p => p.path.length));
            const m2 = m1.filter(p => p.path.length === maxLen);


            const countBranches = (path) => {
                let branches = 0;
                path.forEach(cId => {
                    (adj[cId] || []).forEach(nbr => {
                        if (!path.includes(nbr) && elOf[nbr] === 'C') branches++;
                    });
                });
                return branches;
            };

            const maxBranches = Math.max(...m2.map(p => countBranches(p.path)));
            const chains = m2.filter(p => countBranches(p.path) === maxBranches).map(p => p.path);

            return (_chainCache[mol.id] = { chains, maxMult, maxLen, maxBranches });
        }


        function getSubstituents(mol, seq) {
            const adj = adjacencyOf(mol);
            const chainSet = new Set(seq);
            const seen = new Set();
            const out = [];

            mol.atoms.forEach(a => {
                if (chainSet.has(a.id) || seen.has(a.id)) return;
                const comp = [];
                const queue = [a.id];
                seen.add(a.id);
                let attach = null;

                while (queue.length) {
                    const x = queue.shift();
                    comp.push(x);
                    (adj[x] || []).forEach(y => {
                        if (chainSet.has(y)) { if (attach === null) attach = y; }
                        else if (!seen.has(y)) { seen.add(y); queue.push(y); }
                    });
                }
                if (attach === null) return;


                if (comp.length === 1 && mol.atoms.find(z => z.id === comp[0]).el !== 'C') {
                    const atom = mol.atoms.find(z => z.id === comp[0]);
                    out.push({ name: HALOGENS[atom.el] || 'substituant', loc: seq.indexOf(attach) + 1, atoms: comp });
                    return;
                }


                const rootId = comp.find(cId => (adj[cId] || []).includes(attach)) || comp[0];


                let hasDouble = false, hasTriple = false, unsatPos = 1;
                mol.bonds.forEach(b => {
                    if (comp.includes(b[0]) && comp.includes(b[1])) {
                        const order = b[2] || 1;
                        if (order === 2) { hasDouble = true; unsatPos = (b[0] === rootId || b[1] === rootId) ? 1 : 2; }
                        if (order === 3) { hasTriple = true; unsatPos = (b[0] === rootId || b[1] === rootId) ? 1 : 2; }
                    }
                });

                let name = 'alkyl';


                if (hasDouble) {
                    if (comp.length === 2) name = 'éthényl';
                    else if (comp.length === 3) name = `prop-${unsatPos}-ényl`;
                }
                else if (hasTriple) {
                    if (comp.length === 2) name = 'éthynyl';
                    else if (comp.length === 3) name = `prop-${unsatPos}-ynyl`;
                }

                else {
                    const cCount = comp.length;
                    if (cCount === 1) name = 'méthyl';
                    else if (cCount === 2) name = 'éthyl';
                    else if (cCount === 3) {

                        const rootNeighborsInComp = (adj[rootId] || []).filter(id => comp.includes(id));
                        name = (rootNeighborsInComp.length === 2) ? 'isopropyle' : 'propyle';
                    }
                    else if (cCount === 4) {
                        const rootNeighborsInComp = (adj[rootId] || []).filter(id => comp.includes(id));
                        const rootDeg = rootNeighborsInComp.length;

                        if (rootDeg === 3) name = 'tert-butyle';
                        else if (rootDeg === 2) name = 'sec-butyle';
                        else {

                            const onlyNeighbor = rootNeighborsInComp[0];
                            const neighborDeg = (adj[onlyNeighbor] || []).filter(id => comp.includes(id)).length;
                            name = (neighborDeg === 3) ? 'isobutyle' : 'butyle';
                        }
                    }
                }

                out.push({ name, loc: seq.indexOf(attach) + 1, atoms: comp });
            });

            return out;
        }

        function numberingOf(mol, seq) {
            const pos = {};
            seq.forEach((id, i) => pos[id] = i + 1);
            const enes = [], ynes = [];
            mol.bonds.forEach(bd => {
                const o = bd[2] || 1;
                if (o > 1 && pos[bd[0]] && pos[bd[1]]) {
                    const l = Math.min(pos[bd[0]], pos[bd[1]]);
                    (o === 2 ? enes : ynes).push(l);
                }
            });
            const num = (a, b) => a - b;
            enes.sort(num); ynes.sort(num);
            const unsat = [...enes, ...ynes].sort(num);
            const subs = getSubstituents(mol, seq);
            const subLocs = subs.map(s => s.loc).sort(num);
            const alpha = subs.slice()
                .sort((x, y) => x.name.localeCompare(y.name, 'fr') || x.loc - y.loc)
                .map(s => s.loc);
            return { unsat, enes, ynes, subs, subLocs, alpha };
        }

        function cmpNum(a, b) {
            let c = cmpLocants(a.unsat, b.unsat);
            if (c) return { c, reason: 'unsat' };
            c = cmpLocants(a.enes, b.enes);
            if (c) return { c, reason: 'ene' };
            c = cmpLocants(a.subLocs, b.subLocs);
            if (c) return { c, reason: 'subs' };
            c = cmpLocants(a.alpha, b.alpha);
            if (c) return { c, reason: 'alpha' };
            return { c: 0, reason: null };
        }

        function isValidCycle(mol, seq) {
            const n = seq.length;
            if (n < 3) return false;
            for (let i = 0; i < n; i++) {
                const a = seq[i], b = seq[(i + 1) % n];
                const bonded = mol.bonds.some(bd =>
                    (bd[0] === a && bd[1] === b) || (bd[1] === a && bd[0] === b));
                if (!bonded) return false;
            }
            return true;
        }

        function bestRingNumbering(mol) {

            const ring = mol.ringOrder || (mol.isAromatic ? mol.chain : null);
            if (!ring) return null;
            const n = ring.length;
            let best = null;
            for (let start = 0; start < n; start++) {
                for (const dir of [1, -1]) {
                    const seq = [];
                    for (let i = 0; i < n; i++) {
                        const idx = ((start + i * dir) % n + n) % n;
                        seq.push(ring[idx]);
                    }
                    const nm = numberingOf(mol, seq);
                    if (!best || cmpNum(nm, best.nm).c < 0) {
                        best = { seq, nm };
                    }
                }
            }
            return best;
        }

        function getOptimalLabelPos(mol, a, dist = 22) {
            const adj = adjacencyOf(mol);
            const nbrIds = adj[a.id] || [];


            const bondAngles = nbrIds.map(nid => {
                const nbr = mol.atoms.find(x => x.id === nid);
                return nbr ? Math.atan2(nbr.y - a.y, nbr.x - a.x) : 0;
            });

            if (bondAngles.length === 0) return { x: a.x, y: a.y - dist };

            let bestAngle = 0;
            let maxMinDiff = -1;


            for (let deg = 0; deg < 360; deg += 10) {
                const rad = deg * (Math.PI / 180);
                let minDiff = Math.PI;

                for (const bAngle of bondAngles) {
                    let diff = Math.abs(rad - bAngle);
                    if (diff > Math.PI) diff = 2 * Math.PI - diff;
                    if (diff < minDiff) minDiff = diff;
                }


                if (minDiff > maxMinDiff) {
                    maxMinDiff = minDiff;
                    bestAngle = rad;
                }
            }

            return {
                x: a.x + Math.cos(bestAngle) * dist,
                y: a.y + Math.sin(bestAngle) * dist
            };
        }


        function renderMolecule(mol, opts = {}) {
            const { chain = [], subs = [], bad = [], good = [], interactive = false } = opts;

            const numbering = {};
            chain.forEach((id, i) => numbering[id] = i + 1);
            const chainSet = new Set(chain);
            const chainBondKeys = new Set();
            for (let i = 0; i < chain.length - 1; i++) {
                chainBondKeys.add([chain[i], chain[i + 1]].sort().join('-'));
            }
            const ringClosed = mol.ringOrder && chain.length === mol.ringOrder.length && sameSet(chain, mol.ringOrder);
            if (ringClosed) {
                chainBondKeys.add([chain[0], chain[chain.length - 1]].sort().join('-'));
            }

            const pad = 52;
            const xs = mol.atoms.map(a => a.x);
            const ys = mol.atoms.map(a => a.y);
            const minX = Math.min(...xs) - pad, maxX = Math.max(...xs) + pad;
            const minY = Math.min(...ys) - pad, maxY = Math.max(...ys) + pad;
            const vw = maxX - minX, vh = maxY - minY;

            let svg = '<svg viewBox="' + minX + ' ' + minY + ' ' + vw + ' ' + vh + '" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">';


            mol.bonds.forEach(bd => {
                const a1 = mol.atoms.find(a => a.id === bd[0]);
                const a2 = mol.atoms.find(a => a.id === bd[1]);
                if (!a1 || !a2) return;
                const key = [bd[0], bd[1]].sort().join('-');
                const inChain = chainBondKeys.has(key);
                const color = inChain ? '#58CC02' : '#4A4A4A';
                const width = inChain ? 5.5 : 3.0;

                const r1 = a1.el !== 'C' ? 22 : 0;
                const r2 = a2.el !== 'C' ? 22 : 0;
                svg += bondPath(a1, a2, bd[2] || 1, color, width, r1, r2);
            });


            mol.atoms.forEach(a => {
                const isHetero = a.el !== 'C';
                const inChain = chainSet.has(a.id);
                const isSub = subs.includes(a.id);
                const isBad = bad.includes(a.id);
                const isGood = good.includes(a.id);

                const HAL_COLORS = { O: '#FF4B4B', N: '#1CB0F6', Cl: '#0D9488', Br: '#A16207', F: '#EC4899', I: '#9333EA', S: '#FFC800' };

                svg += '<g class="atom-hit" ' + (interactive ? 'data-atom="' + a.id + '"' : '') + '>';


                svg += '<circle cx="' + a.x + '" cy="' + a.y + '" r="32" fill="#000" opacity="0" class="atom-hit-circle" style="pointer-events:all;cursor:pointer;"/>';

                if (isHetero) {

                    let bgColor = HAL_COLORS[a.el] || '#CE82FF';
                    if (isBad) bgColor = '#FF4B4B';
                    if (isGood) bgColor = '#58CC02';
                    const circR = 20;
                    svg += '<circle class="atom-shape" cx="' + a.x + '" cy="' + a.y + '" r="' + circR + '" fill="' + bgColor + '" stroke="#fff" stroke-width="2.5"/>';
                    const fs = a.el.length > 1 ? 14 : 16;
                    svg += '<text x="' + a.x + '" y="' + (a.y + fs * 0.35) + '" text-anchor="middle" font-size="' + fs + '" font-weight="900" fill="#fff" font-family="-apple-system,sans-serif">' + a.el + '</text>';
                } else {

                    if (inChain || isSub || isBad || isGood) {
                        const dotColor = isBad ? '#FF4B4B' : (isSub ? '#FFC800' : '#58CC02');

                        svg += '<circle class="atom-shape" cx="' + a.x + '" cy="' + a.y + '" r="5.5" fill="' + dotColor + '" stroke="#fff" stroke-width="1.5"/>';
                    } else {



                        svg += '<circle class="atom-shape" cx="' + a.x + '" cy="' + a.y + '" r="6" fill="transparent" stroke="none" stroke-width="0"/>';
                    }
                }


                if (numbering[a.id]) {
                    const pos = getOptimalLabelPos(mol, a, 24);
                    svg += '<text x="' + pos.x + '" y="' + (pos.y + 4) + '" text-anchor="middle" font-size="13" font-weight="900" fill="#46A302" font-family="-apple-system,sans-serif" class="num-badge">' + numbering[a.id] + '</text>';
                }

                svg += '</g>';
            });

            svg += '</svg>';
            return svg;
        }


        function bondPath(a1, a2, order, color, width, r1, r2) {
            const dx = a2.x - a1.x, dy = a2.y - a1.y;
            const len = Math.hypot(dx, dy) || 1;
            const ux = dx / len, uy = dy / len;
            const px = -uy, py = ux;
            const x1 = a1.x + ux * r1, y1 = a1.y + uy * r1;
            const x2 = a2.x - ux * r2, y2 = a2.y - uy * r2;

            const isChain = width > 4;


            const hitLine = `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#000" opacity="0" stroke-width="28" class="bond-hit" style="pointer-events:stroke;cursor:pointer;"/>`;

            let inner = '';
            if (order === 1) {
                const w = isChain ? 5.5 : 3.0;
                inner = `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${w}" stroke-linecap="round"/>`;
            } else if (order === 2) {
                const off = isChain ? 5.0 : 4.0;
                const w = isChain ? 3.0 : 2.5;
                const ox = px * off, oy = py * off;
                const attr = `stroke="${color}" stroke-width="${w}" stroke-linecap="round"`;
                inner = `<line x1="${x1 + ox}" y1="${y1 + oy}" x2="${x2 + ox}" y2="${y2 + oy}" ${attr}/>`
                    + `<line x1="${x1 - ox}" y1="${y1 - oy}" x2="${x2 - ox}" y2="${y2 - oy}" ${attr}/>`;
            } else {
                const off = isChain ? 6.8 : 5.5;
                const w = isChain ? 2.6 : 2.2;
                const ox = px * off, oy = py * off;
                const attr = `stroke="${color}" stroke-width="${w}" stroke-linecap="round"`;
                inner = `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" ${attr}/>`
                    + `<line x1="${x1 + ox}" y1="${y1 + oy}" x2="${x2 + ox}" y2="${y2 + oy}" ${attr}/>`
                    + `<line x1="${x1 - ox}" y1="${y1 - oy}" x2="${x2 - ox}" y2="${y2 - oy}" ${attr}/>`;
            }

            const gid = [a1.id, a2.id].sort().join('-');
            return `<g class="bond" data-bond="${gid}" data-order="${order}">${hitLine}${inner}</g>`;
        }

        function buildV2Doc(query) {
            const src = document.getElementById('v2-src').textContent
                .replace(/<\\\/script/g, '<\/script');
            const inject = '<script>window.__V2_QUERY = ' + JSON.stringify(query) + ';<\/script>';
            return src.replace('<head>', function () { return '<head>' + inject; });
        }
        function openV2Random() {
            const wrap = document.getElementById('v2-frame-wrap');
            const frame = document.getElementById('v2-frame');
            if (!wrap || !frame) return;
            frame.srcdoc = buildV2Doc('?random=1');
            wrap.style.display = 'block';
            try { SFX.play('start'); } catch (e) { }
        }
        function openV2Level(wi, li) {
            const wrap = document.getElementById('v2-frame-wrap');
            const frame = document.getElementById('v2-frame');
            if (!wrap || !frame) return;
            frame.srcdoc = buildV2Doc('?w=' + wi + '&l=' + li);
            wrap.style.display = 'block';

        function openLevel(wi, li, isRandom = false) {
            state._lastPct = null;
            const world = WORLDS[wi];
            const level = world.levels[li];
            const mol = MOLECULES[level.mol];


            const carbonCount = mol.atoms.filter(a => a.el === 'C').length;
            const needChainStep = carbonCount > 1;

            let steps = level.steps.filter(s => s !== 'chain');
            if (needChainStep) {
                steps.unshift('chain');
            }

            state.worldIdx = wi;
            state.levelIdx = li;
            state.random = !!isRandom;
            state.steps = steps;
            state.stepIdx = 0;
            state.stepState = {};
            state.chainSequence = [];
            state.confirmedSubs = [];
            state.mistakes = 0;


            if (!needChainStep) {
                state.chainSequence = mol.atoms.filter(a => a.el === 'C').map(a => a.id);
            }

            renderPlay();
        }


        function renderPlay() {
            state.view = 'play';
            const mol = currentMol();
            const step = state.steps[state.stepIdx];
            const totalSteps = state.steps.length;
            const progress = Math.round((state.stepIdx / totalSteps) * 100);
            const content = renderStep(step, mol);

            const isLastStep = state.stepIdx === state.steps.length - 1;
            const isRappelVisible = (step === 'name') && isLastStep;

            const footerHTML = isRappelVisible
                ? '<div style="display:flex;gap:10px;align-items:stretch">'

                + (state.random ? '<span class="rnd-tag">🎲</span>' : '')
                + sndButtonHTML()
                + '<div class="hearts"><span class="heart">❤️</span> <span class="hnum">' + state.hearts + '</span></div>'
                + '</div>'
                + '<div class="play-body">'
