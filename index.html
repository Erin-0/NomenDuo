<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#58CC02">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NomenDuo">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>NomenDuo — Nomenclature</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0
        }

        :root {
            --green: #58CC02;
            --green-d: #46A302;
            --green-l: #D7FFB8;
            --blue: #1CB0F6;
            --blue-d: #1899D6;
            --red: #FF4B4B;
            --red-d: #E53935;
            --red-l: #FFDFE0;
            --gold: #FFC800;
            --gold-d: #E5A400;
            --ink: #3C3C3C;
            --ink2: #4B4B4B;
            --muted: #AFAFAF;
            --line: #E5E5E5;
            --bg: #FFFFFF;
            --bg-soft: #F7F7F7;
            --purple: #CE82FF;
            --purple-d: #A568CC;
        }

        html,
        body {
            height: 100%;
            overflow: hidden
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            background: var(--bg);
            color: var(--ink);
            -webkit-font-smoothing: antialiased;
            font-size: 15px;
            line-height: 1.4;
            font-weight: 600;
        }

        button {
            font-family: inherit;
            cursor: pointer;
            border: none;
            background: none;
            color: inherit;
            font-weight: inherit
        }

        #app {
            max-width: 500px;
            height: 100dvh;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            position: relative;
            overflow: hidden;
        }

        /* ====== TOP HUD ====== */
        .topbar {
            flex: none;
            padding: 14px 16px 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg);
            z-index: 5;
        }

        .topbar .close-x {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: var(--muted);
            font-weight: 900;
            transition: background .15s;
        }

        .topbar .close-x:active {
            background: var(--bg-soft)
        }

        .progress-track {
            flex: 1;
            height: 14px;
            background: var(--line);
            border-radius: 99px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: var(--green);
            border-radius: 99px;
            transition: width .4s cubic-bezier(.4, 0, .2, 1);
            box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .08);
        }

        .hearts {
            display: flex;
            align-items: center;
            gap: 4px;
            color: var(--red);
            font-weight: 900;
            font-size: 17px;
        }

        .hearts .heart {
            font-size: 18px
        }

        .rnd-tag {
            font-size: 11px;
            font-weight: 900;
            color: #7A5A00;
            background: #FFF1B8;
            padding: 3px 8px;
            border-radius: 99px;
            letter-spacing: .04em;
        }

        /* ====== HOME ====== */
        .home {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 0 0 60px
        }

        .home-hero {
            padding: 24px 20px 12px;
            background: linear-gradient(180deg, #E8FFD0 0%, transparent 100%);
        }

        .home-hero h1 {
            font-size: 30px;
            font-weight: 900;
            letter-spacing: -.7px;
            color: var(--ink);
            line-height: 1.1;
        }

        .home-hero h1 .accent {
            color: var(--green)
        }

        .home-hero p {
            color: var(--muted);
            font-weight: 700;
            font-size: 13px;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: .08em;
        }

        .home-stats {
            display: flex;
            gap: 10px;
            padding: 0 20px;
            margin-top: 6px
        }

        .stat-chip {
            background: var(--bg-soft);
            border-radius: 14px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 900;
            font-size: 14px;
        }

        .stat-chip .ico {
            font-size: 18px
        }

        .stat-chip b {
            color: var(--ink);
            font-weight: 900
        }

        .stat-chip span {
            color: var(--muted);
            font-weight: 800;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .05em
        }

        .worlds {
            padding: 22px 20px 0;
            display: flex;
            flex-direction: column;
            gap: 26px
        }

        .world-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px
        }

        .world-title .badge {
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 10.5px;
            font-weight: 900;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: #fff;
            min-width: 34px;
            text-align: center;
        }

        .world-title h2 {
            font-size: 18px;
            font-weight: 900;
            letter-spacing: -.3px
        }

        .world-title .count {
            margin-left: auto;
            font-size: 12px;
            color: var(--muted);
            font-weight: 800
        }

        .levels {
            display: flex;
            flex-direction: column;
            gap: 12px
        }

        .level-row {
            display: flex;
            align-items: center;
            gap: 14px;
            background: var(--bg-soft);
            border-radius: 18px;
            padding: 14px 16px;
            border: 2px solid transparent;
            transition: transform .12s;
            text-align: left;
            width: 100%;
        }

        .level-row:active {
            transform: scale(.98)
        }

        .level-row.done {
            background: var(--green-l);
            border-color: var(--green)
        }

        .level-badge {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            flex: none;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            border: 2px solid var(--line);
            font-size: 20px;
            font-weight: 900;
            color: var(--ink);
            box-shadow: 0 3px 0 var(--line);
        }

        .level-row.done .level-badge {
            background: var(--green);
            border-color: var(--green-d);
            color: #fff;
            box-shadow: 0 3px 0 var(--green-d);
        }

        .level-meta {
            flex: 1;
            min-width: 0
        }

        .level-meta h3 {
            font-size: 15px;
            font-weight: 900;
            letter-spacing: -.2px;
            color: var(--ink)
        }

        .level-meta p {
            font-size: 12px;
            color: var(--muted);
            font-weight: 700;
            margin-top: 3px
        }

        .level-stars {
            color: var(--gold);
            font-size: 16px;
            letter-spacing: 1px
        }

        .level-arrow {
            font-size: 18px;
            color: var(--muted);
            font-weight: 900
        }

        /* Carte jeu aléatoire */
        /* Carte jeu aléatoire — adaptée à la largeur de l'app */
        .random-card {
            padding: 18px 20px;
            border-radius: 22px;
            background: #FFFFFF;
            border: 2px solid #89E219;
            box-shadow: 0 5px 0 #58CC02;
            width: 100%;
            /* ✅ يملأ عرض الحاوية */
            margin: 0 auto;
            /* ✅ تمركز */
            /* ✅ لا يوجد max-width — يتكيف مع الحاوية */
        }

        .random-card .kicker {
            font-size: 10.5px;
            font-weight: 900;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: #58CC02;
        }

        .random-card h2 {
            font-size: 21px;
            font-weight: 900;
            letter-spacing: -.4px;
            margin-top: 4px;
            color: #2B5A00;
        }

        .random-card p {
            font-size: 13px;
            font-weight: 700;
            margin: 6px 0 14px;
            color: #4A7A00;
            line-height: 1.45;
        }

        .random-card .btn-3d {
            padding: 14px 18px;
            /* ✅ تقليل الحشو ليتناسب */
            font-size: 14px;
        }

        /* ===== الزر ===== */
        .btn-3d {
            display: inline-block;
            padding: 18px;
            border: none;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 900;
            letter-spacing: 0.5px;
            cursor: pointer;
            border-bottom: 4px solid rgba(0, 0, 0, .25);
            transition: transform .08s ease, border-bottom-width .08s ease;
            width: 100%;
            text-align: center;
        }

        .btn-3d:active {
            transform: translateY(2px);
            border-bottom-width: 2px;
        }

        .btn-gold {
            background: #FFC800;
            border-bottom-color: #E5A800;
            color: #5C4300;
        }

        /* Section banner - Neumorphism Mint */
        .section-banner {
            padding: 20px;
            border-radius: 0px;
            background: #e8f8f0;
            color: #1a3a2e;

        }

        .section-banner .kicker {
            font-size: 10px;
            font-weight: 900;
            letter-spacing: .16em;
            text-transform: uppercase;
            color: #10B981;
        }

        .section-banner h2 {
            font-size: 21px;
            font-weight: 900;
            margin-top: 6px;
            line-height: 1.15;
            color: #14261a;
        }

        .section-banner p {
            font-size: 13px;
            font-weight: 600;
            margin-top: 8px;
            color: #4a6b5a;
            line-height: 1.5;
        }

        .section-banner .roadmap {
            display: flex;
            gap: 8px;
            margin-top: 14px;
            flex-wrap: wrap;
        }

        .section-banner .roadmap span {
            background: #e8f8f0;
            border-radius: 12px;
            padding: 5px 12px;
            font-size: 11px;
            font-weight: 800;
            color: #059669;
            box-shadow: 3px 3px 6px #c8d8d0, -3px -3px 6px #ffffff;
        }

        /* ====== PLAY ====== */
        .play {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100dvh;
            overflow: hidden;
            position: relative
        }

        .play-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 0 0 8px;
        }

        .q-block {
            padding: 2px 20px 6px
        }

        /* ← كان 4px 20px 10px */
        .q-block h2 {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: -.5px;
            color: var(--ink);
            line-height: 1.25;
        }

        .q-block p {
            font-size: 14px;
            color: var(--muted);
            font-weight: 700;
            margin-top: 6px;
            line-height: 1.5;
        }

        .stage {
            flex: 1;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2px 4px;
            position: relative;
            /* ← حشو أصغر = مساحة أكبر */
        }

        .stage svg {
            width: 100%;
            height: 100%;
            max-height: 100%;
            overflow: visible
        }

        .stage .atom-hit {
            cursor: pointer
        }

        .stage .atom-shape {
            transition: all .18s cubic-bezier(.4, 0, .2, 1)
        }

        .stage .atom-hit:active .atom-shape {
            transform: scale(1.1);
            transform-box: fill-box;
            transform-origin: center
        }

        .answer {
            padding: 8px 20px 12px
        }

        .name-slot {
            min-height: 56px;
            border: 2px dashed var(--line);
            border-radius: 14px;
            padding: 10px 14px;
            margin-bottom: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
            font-family: Georgia, serif;
            font-size: 19px;
            font-weight: 900;
            color: var(--ink);
        }

        .name-slot.empty::before {
            content: 'Touche les morceaux pour assembler le nom';
            font-family: inherit;
            font-size: 12.5px;
            font-weight: 700;
            color: var(--muted);
            font-style: italic;
        }

        .name-slot .piece {
            background: var(--green);
            color: #fff;
            padding: 5px 11px;
            border-radius: 9px;
            font-size: 16px;
            font-weight: 900;
            font-family: Georgia, serif;
            animation: popIn .22s cubic-bezier(.34, 1.4, .5, 1);
            box-shadow: 0 3px 0 var(--green-d);
            cursor: pointer;
        }

        @keyframes popIn {
            from {
                transform: scale(.6);
                opacity: 0
            }
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center
        }

        .chip {
            padding: 11px 16px;
            background: var(--bg);
            border: 2px solid var(--line);
            border-radius: 12px;
            font-family: Georgia, serif;
            font-size: 16px;
            font-weight: 900;
            color: var(--ink);
            cursor: pointer;
            box-shadow: 0 3px 0 var(--line);
            transition: transform .1s;
        }

        .chip:active {
            transform: translateY(3px);
            box-shadow: none
        }

        .chip.used {
            opacity: .25;
            pointer-events: none
        }

        .play-footer {
            flex: none;
            padding: 14px 20px calc(18px + env(safe-area-inset-bottom));
            background: var(--bg);
            border-top: 2px solid var(--line);
        }

        .btn-3d {
            display: block;
            width: 100%;
            padding: 16px 20px;
            background: var(--green);
            border-bottom: 5px solid var(--green-d);
            border-radius: 16px;
            color: #fff;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: .08em;
            font-size: 15px;
            transition: transform .08s, border-bottom-width .08s;
            text-align: center;
        }

        .btn-3d:active {
            transform: translateY(5px);
            border-bottom-width: 0
        }

        .btn-3d:disabled {
            background: var(--line);
            border-bottom-color: #D4D4D4;
            color: var(--muted);
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #fff;
            color: var(--ink);
            border-bottom-color: rgba(0, 0, 0, .15)
        }

        .btn-blue {
            background: var(--blue);
            border-bottom-color: var(--blue-d);
            color: #fff
        }

        .btn-red {
            background: var(--red);
            border-bottom-color: var(--red-d);
            color: #fff
        }

        /* ====== FEEDBACK SHEET ====== */
        .sheet-wrap {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(60, 60, 60, .5);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            animation: fadeIn .22s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0
            }
        }

        .sheet {
            width: 100%;
            max-width: 500px;
            padding: 28px 22px calc(24px + env(safe-area-inset-bottom));
            border-radius: 26px 26px 0 0;
            animation: slideUp .35s cubic-bezier(.4, 0, .2, 1);
            max-height: 90vh;
            overflow-y: auto;
        }

        .sheet.good {
            background: #E8FFD0;
            color: var(--green-d)
        }

        .sheet.bad {
            background: #FFEBEC;
            color: var(--red-d)
        }

        .sheet.neutral {
            background: #fff;
            color: var(--ink)
        }

        @keyframes slideUp {
            from {
                transform: translateY(60px);
                opacity: 0
            }
        }

        .sheet-icon {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin: 0 auto 14px;
        }

        .sheet.good .sheet-icon {
            color: var(--green)
        }

        .sheet.bad .sheet-icon {
            color: var(--red)
        }

        .sheet-title {
            text-align: center;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: -.4px;
            margin-bottom: 8px
        }

        .sheet-text {
            text-align: center;
            font-size: 15px;
            font-weight: 700;
            line-height: 1.5;
            margin-bottom: 6px
        }

        .sheet-text b {
            font-weight: 900;
            color: inherit
        }

        .sheet-hint {
            background: rgba(255, 255, 255, .7);
            border-radius: 12px;
            padding: 12px 14px;
            margin-top: 14px;
            font-size: 13px;
            font-weight: 700;
            line-height: 1.5;
            text-align: left;
        }

        .diag {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 99px;
            background: #fff;
            color: var(--red-d);
            font-size: 11px;
            font-weight: 900;
            letter-spacing: .08em;
            text-transform: uppercase;
        }

        .sheet-actions {
            margin-top: 20px
        }

        .sheet-actions .btn-3d {
            background: #fff;
            color: var(--ink);
            border-bottom-color: rgba(0, 0, 0, .15)
        }

        .sheet.good .sheet-actions .btn-3d {
            background: var(--green);
            border-bottom-color: var(--green-d);
            color: #fff
        }

        .sheet.bad .sheet-actions .btn-3d {
            background: var(--red);
            border-bottom-color: var(--red-d);
            color: #fff
        }

        .sheet.good .sheet-actions .btn-secondary {
            background: #fff;
            color: var(--ink);
            border-bottom-color: rgba(0, 0, 0, .15)
        }

        .sheet.good .sheet-actions .btn-gold {
            background: var(--gold);
            border-bottom-color: var(--gold-d);
            color: #5C4300
        }

        .prefix-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 16px
        }

        .prefix-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: var(--bg-soft);
            border-radius: 12px;
            font-weight: 800;
            font-size: 15px;
        }

        .prefix-item .num {
            color: var(--green);
            font-weight: 900;
            font-size: 17px;
            min-width: 26px;
            text-align: center
        }

        .prefix-item .txt {
            color: var(--ink)
        }

        .tipbox {
            background: #FFF8DC;
            border: 2px solid var(--gold);
            color: #7A5A00;
            border-radius: 14px;
            padding: 12px 14px;
            margin-top: 14px;
            font-size: 13px;
            font-weight: 700;
            line-height: 1.55;
            text-align: left;
        }

        .tipbox b {
            color: #5C4300;
            font-weight: 900
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 110px;
            transform: translateX(-50%);
            max-width: 88%;
            z-index: 200;
            background: #3C3C3C;
            color: #fff;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 800;
            line-height: 1.4;
            text-align: center;
            box-shadow: 0 6px 18px rgba(0, 0, 0, .25);
            animation: popIn .25s cubic-bezier(.34, 1.4, .5, 1);
        }

        * {
            -webkit-user-select: none;
            /* Safari */
            -moz-user-select: none;
            /* Firefox */
            -ms-user-select: none;
            /* IE/Edge */
            user-select: none;
            /* Standard */
            -webkit-touch-callout: none;
            /* iOS - يمنع قائمة النسخ عند الضغط الطويل */
            -webkit-tap-highlight-color: transparent;
        }

        .hidden {
            display: none !important
        }

        /* زر الانسدال */
        .world-toggle {
            margin-left: 8px;
            width: 30px;
            height: 30px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--muted);
            background: var(--bg-soft);
            transition: transform .25s ease, background .15s ease;
            flex: none;
        }

        .world-toggle:active {
            background: var(--line);
        }

        .world-toggle svg {
            transition: transform .3s cubic-bezier(.4, 0, .2, 1);
        }

        /* عند الانسدال: السهم يدور 180° */
        .world-section.collapsed .world-toggle svg {
            transform: rotate(-90deg);
        }

        /* انسدال الـ levels */
        .levels {
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow: hidden;
            max-height: 2000px;
            /* قيمة كبيرة كافية لاستيعاب المحتوى */
            opacity: 1;
            transition: max-height .35s cubic-bezier(.4, 0, .2, 1),
                opacity .25s ease,
                margin-top .3s ease;
            margin-top: 0;
        }

        .world-section.collapsed .levels {
            max-height: 0;
            opacity: 0;
            margin-top: 0;
            pointer-events: none;
        }

        /* (اختياري) خلفية خفيفة للقسم عند الانسدال */
        .world-section.collapsed .world-title {
            opacity: .65;
            transition: opacity .2s ease;
        }

        /* ====== ANIMATIONS & FX (ajout) ====== */
        .snd-toggle {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            flex: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            background: var(--bg-soft);
            transition: transform .15s, background .15s;
        }

        .snd-toggle:active {
            transform: scale(.88)
        }

        .snd-toggle.off {
            opacity: .55
        }

        .home-hero {
            position: relative
        }

        .home-hero .snd-toggle {
            position: absolute;
            top: 18px;
            right: 18px
        }

        /* entrée de page */
        .home-hero h1 {
            animation: heroIn .55s cubic-bezier(.34, 1.4, .5, 1) both
        }

        .home-hero p {
            animation: fadeIn .8s .2s both
        }

        @keyframes heroIn {
            from {
                transform: translateY(-14px) scale(.92);
                opacity: 0
            }
        }

        .stat-chip {
            animation: chipIn .5s cubic-bezier(.34, 1.4, .5, 1) both
        }

        .stat-chip:nth-child(2) {
            animation-delay: .08s
        }

        @keyframes chipIn {
            from {
                transform: translateY(14px) scale(.85);
                opacity: 0
            }
        }

        .random-card,
        .section-banner,
        .world-section {
            animation: cardIn .5s cubic-bezier(.34, 1.3, .5, 1) both
        }

        .world-section:nth-of-type(2) {
            animation-delay: .05s
        }

        @keyframes cardIn {
            from {
                transform: translateY(22px);
                opacity: 0
            }
        }

        .level-row {
            animation: rowIn .4s cubic-bezier(.34, 1.3, .5, 1) both
        }

        .level-row:nth-child(2) {
            animation-delay: .04s
        }

        .level-row:nth-child(3) {
            animation-delay: .08s
        }

        .level-row:nth-child(4) {
            animation-delay: .12s
        }

        .level-row:nth-child(5) {
            animation-delay: .16s
        }

        .level-row:nth-child(n+6) {
            animation-delay: .2s
        }

        @keyframes rowIn {
            from {
                transform: translateX(-18px);
                opacity: 0
            }
        }

        .random-card .btn-3d {
            animation: pulseBtn 2.2s ease-in-out infinite
        }

        @keyframes pulseBtn {

            0%,
            100% {
                transform: scale(1)
            }

            50% {
                transform: scale(1.025)
            }
        }

        .random-card h2 {
            display: inline-block
        }

        .random-card:hover h2 {
            animation: wobble .6s
        }

        @keyframes wobble {

            0%,
            100% {
                transform: rotate(0)
            }

            25% {
                transform: rotate(-4deg)
            }

            75% {
                transform: rotate(4deg)
            }
        }

        /* écran de jeu */
        .play {
            animation: playIn .35s cubic-bezier(.4, 0, .2, 1)
        }

        @keyframes playIn {
            from {
                opacity: 0;
                transform: translateX(24px)
            }
        }

        .q-block h2 {
            animation: fadeIn .4s .05s both
        }

        .stage svg {
            animation: molIn .5s cubic-bezier(.34, 1.3, .5, 1) both
        }

        @keyframes molIn {
            from {
                transform: scale(.85);
                opacity: 0
            }
        }

        .chip {
            animation: chipPop .35s cubic-bezier(.34, 1.5, .5, 1) both
        }

        .chip:nth-child(2) {
            animation-delay: .04s
        }

        .chip:nth-child(3) {
            animation-delay: .08s
        }

        .chip:nth-child(4) {
            animation-delay: .12s
        }

        .chip:nth-child(5) {
            animation-delay: .16s
        }

        .chip:nth-child(n+6) {
            animation-delay: .2s
        }

        @keyframes chipPop {
            from {
                transform: scale(.6) translateY(10px);
                opacity: 0
            }
        }

        .name-slot .piece:active {
            transform: scale(.92)
        }

        /* barre de progression brillante */
        .progress-fill {
            position: relative;
            overflow: hidden;
            transition: width .6s cubic-bezier(.34, 1.3, .5, 1)
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            left: 8px;
            right: 8px;
            top: 3px;
            height: 4px;
            border-radius: 99px;
            background: rgba(255, 255, 255, .35);
        }

        .progress-fill.boost {
            animation: fillBoost .7s ease-out
        }

        @keyframes fillBoost {
            0% {
                filter: brightness(1)
            }

            40% {
                filter: brightness(1.35)
            }

            100% {
                filter: brightness(1)
            }
        }

        /* clic atome */
        /* أنيميشن ناعم: ضغطة صغيرة ثم عودة — بدون ارتداد */
        @keyframes atomTap {
            0% {
                transform: scale(1);
            }

            45% {
                transform: scale(1.10);
            }

            100% {
                transform: scale(1);
            }
        }

        .atom-shape.atom-tap {
            animation: atomTap .22s cubic-bezier(.4, 0, .2, 1);
            transform-box: fill-box;
            transform-origin: center;
        }

        /* feedback */
        .sheet.good {
            animation: slideUp .35s cubic-bezier(.34, 1.3, .5, 1)
        }

        .sheet.bad {
            animation: slideUp .3s cubic-bezier(.4, 0, .2, 1), shakeX .5s .25s
        }

        @keyframes shakeX {

            0%,
            100% {
                transform: translateX(0)
            }

            15% {
                transform: translateX(-10px)
            }

            30% {
                transform: translateX(9px)
            }

            45% {
                transform: translateX(-7px)
            }

            60% {
                transform: translateX(5px)
            }

            75% {
                transform: translateX(-3px)
            }
        }

        .sheet.good .sheet-icon {
            animation: iconPop .6s .1s cubic-bezier(.34, 1.8, .5, 1) both;
            position: relative
        }

        .sheet.good .sheet-icon::before,
        .sheet.good .sheet-icon::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 3px solid var(--green);
            opacity: 0;
            animation: ring .8s .15s ease-out;
        }

        .sheet.good .sheet-icon::after {
            animation-delay: .3s
        }

        @keyframes ring {
            0% {
                transform: scale(.8);
                opacity: .9
            }

            100% {
                transform: scale(1.9);
                opacity: 0
            }
        }

        @keyframes iconPop {
            0% {
                transform: scale(0) rotate(-40deg)
            }

            60% {
                transform: scale(1.25) rotate(8deg)
            }

            100% {
                transform: scale(1) rotate(0)
            }
        }

        .sheet.bad .sheet-icon {
            animation: iconDrop .55s .1s cubic-bezier(.34, 1.5, .5, 1) both
        }

        @keyframes iconDrop {
            0% {
                transform: translateY(-30px) scale(.4);
                opacity: 0
            }

            70% {
                transform: translateY(4px) scale(1.1);
                opacity: 1
            }

            100% {
                transform: none
            }
        }

        .sheet-title {
            animation: titleIn .4s .2s both
        }

        .sheet-text {
            animation: titleIn .4s .3s both
        }

        @keyframes titleIn {
            from {
                transform: translateY(10px);
                opacity: 0
            }
        }

        .sheet-actions .btn-3d {
            animation: titleIn .4s .4s both
        }

        .sheet.good .sheet-actions .btn-3d:not(.btn-secondary) {
            animation: titleIn .4s .4s both, pulseBtn 1.8s 1s ease-in-out infinite
        }

        /* flash plein écran */
        .flash {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 105;
            animation: flashA .55s ease-out forwards
        }

        .flash.good {
            background: radial-gradient(circle at 50% 80%, rgba(88, 204, 2, .35), transparent 65%)
        }

        .flash.bad {
            background: radial-gradient(circle at 50% 80%, rgba(255, 75, 75, .35), transparent 65%)
        }

        @keyframes flashA {
            0% {
                opacity: 0
            }

            25% {
                opacity: 1
            }

            100% {
                opacity: 0
            }
        }

        /* secousse de l'app */
        .app-shake {
            animation: shakeX .45s
        }

        /* cœurs */
        .heart.lose {
            display: inline-block;
            animation: heartLose .8s ease-out
        }

        @keyframes heartLose {
            0% {
                transform: scale(1)
            }

            15% {
                transform: scale(1.5)
            }

            30% {
                transform: scale(.8) rotate(-14deg)
            }

            45% {
                transform: scale(1.2) rotate(10deg)
            }

            70% {
                transform: scale(.9) rotate(-5deg)
            }

            100% {
                transform: scale(1)
            }
        }

        .hearts .hnum.lose {
            display: inline-block;
            animation: numDrop .6s ease-out
        }

        @keyframes numDrop {
            0% {
                transform: translateY(-12px);
                opacity: 0;
                color: #FF4B4B
            }

            100% {
                transform: none;
                opacity: 1
            }
        }

        .broken-heart {
            font-size: 58px;
            display: inline-block;
            animation: breakHeart 1.2s cubic-bezier(.34, 1.4, .5, 1) both
        }

        @keyframes breakHeart {
            0% {
                transform: scale(0)
            }

            30% {
                transform: scale(1.35)
            }

            45% {
                transform: scale(1) rotate(-8deg)
            }

            60% {
                transform: rotate(8deg)
            }

            75% {
                transform: rotate(-4deg)
            }

            100% {
                transform: none
            }
        }

        /* confettis */
        .fx-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 150;
            overflow: hidden
        }

        .confetti {
            position: absolute;
            will-change: transform, opacity
        }

        /* étoiles de fin */
        .star-row {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 16px 0 4px;
            font-size: 40px;
            line-height: 1
        }

        .star-row .st {
            display: inline-block;
            color: #E5E5E5;
            transform: scale(.3);
            opacity: 0
        }

        .star-row .st.on {
            color: #FFC800;
            text-shadow: 0 3px 0 #E5A400;
            animation: starIn .7s cubic-bezier(.34, 1.8, .5, 1) forwards
        }

        .star-row .st.off {
            animation: starOff .4s forwards
        }

        @keyframes starIn {
            0% {
                transform: scale(0) rotate(-120deg);
                opacity: 0
            }

            60% {
                transform: scale(1.5) rotate(15deg);
                opacity: 1
            }

            100% {
                transform: scale(1) rotate(0);
                opacity: 1
            }
        }

        @keyframes starOff {
            to {
                transform: scale(1);
                opacity: 1
            }
        }

        .trophy-bounce {
            display: inline-block;
            animation: trophy 1.1s cubic-bezier(.34, 1.5, .5, 1) both
        }

        @keyframes trophy {
            0% {
                transform: translateY(-60px) scale(.2) rotate(-30deg);
                opacity: 0
            }

            50% {
                transform: translateY(8px) scale(1.2) rotate(10deg);
                opacity: 1
            }

            70% {
                transform: translateY(-10px) rotate(-6deg)
            }

            100% {
                transform: none
            }
        }

        /* ===== FULL SCREEN VICTORY & GAME OVER SCREENS ===== */
        .fs-screen {
            position: fixed;
            inset: 0;
            height: 100dvh;
            width: 100vw;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow: hidden;
            padding: calc(16px + env(safe-area-inset-top, 0px)) 20px calc(24px + env(safe-area-inset-bottom, 0px));
            animation: fsFadeIn .4s ease-out both;
        }

        @keyframes fsFadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .fs-screen.fs-win {
            background: linear-gradient(180deg, #58CC02 0%, #46A302 100%);
        }

        .fs-screen.fs-lose {
            background: linear-gradient(180deg, #FF4B4B 0%, #C62828 100%);
        }

        .fs-content {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin: auto 0;
        }

        /* --- Hero Container & Non-clickable Duo Image --- */
        .fs-hero {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: min(72vw, 290px);
            aspect-ratio: 1 / 1;
            margin-bottom: 12px;
        }

        .fs-screen.fs-win .fs-hero {
            animation: heroWinEntrance .65s cubic-bezier(.34, 1.56, .64, 1) both;
        }

        .fs-screen.fs-lose .fs-hero {
            animation: heroLoseEntrance .75s cubic-bezier(.25, 1, .5, 1) both, heroLoseShake .5s .75s ease-in-out;
        }

        .fs-hero-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none !important;
            user-select: none !important;
            -webkit-user-drag: none !important;
            -webkit-touch-callout: none !important;
            transform-origin: bottom center;
        }

        .fs-screen.fs-win .fs-hero-img {
            animation: duoWinPump 2.8s ease-in-out .65s infinite;
        }

        .fs-screen.fs-lose .fs-hero-img {
            animation: duoLoseBreathe 4.5s ease-in-out .75s infinite;
        }

        /* Hero Shadow */
        .fs-hero-shadow {
            position: absolute;
            bottom: 4px;
            width: 65%;
            height: 16px;
            border-radius: 50%;
            background: rgba(0, 0, 0, .26);
            filter: blur(4px);
            z-index: -1;
            transform-origin: center;
        }

        .fs-screen.fs-win .fs-hero-shadow {
            animation: duoShadowWin 2.8s ease-in-out .65s infinite;
        }

        .fs-screen.fs-lose .fs-hero-shadow {
            animation: duoShadowLose 4.5s ease-in-out .75s infinite;
        }

        /* --- Typography --- */
        .fs-title {
            font-size: 30px;
            font-weight: 900;
            color: #FFFFFF;
            letter-spacing: -.4px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, .2);
            margin-bottom: 8px;
            animation: titleIn .4s .2s both;
        }

        .fs-text {
            font-size: 16px;
            color: rgba(255, 255, 255, .92);
            font-weight: 700;
            line-height: 1.4;
            max-width: 90%;
            margin-bottom: 12px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, .15);
            animation: titleIn .4s .3s both;
        }

        .fs-text b {
            color: #FFFFFF;
            font-weight: 900;
        }

        .fs-broken-heart {
            font-size: 54px;
            margin-bottom: 6px;
            animation: breakHeart 1.1s cubic-bezier(.34, 1.4, .5, 1) both;
        }

        /* Stars on Green Background */
        .fs-screen.fs-win .star-row {
            margin: 10px 0 0;
        }

        .fs-screen.fs-win .star-row .st.off {
            color: rgba(0, 0, 0, .22);
            text-shadow: none;
        }

        /* Footer & Buttons */
        .fs-footer {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 500px;
            display: flex;
            gap: 12px;
        }

        .fs-btn-main {
            background: #FFFFFF !important;
            border-bottom: 5px solid #E5E5E5 !important;
            font-weight: 900;
            letter-spacing: .08em;
            box-shadow: 0 8px 24px rgba(0, 0, 0, .15);
        }

        .fs-screen.fs-win .fs-btn-main {
            color: #46A302 !important;
        }

        .fs-screen.fs-lose .fs-btn-main {
            color: #E53935 !important;
        }

        .fs-screen.fs-win .fs-btn-sec {
            background: rgba(255, 255, 255, .2) !important;
            border-bottom: 5px solid rgba(0, 0, 0, .18) !important;
            color: #FFFFFF !important;
            backdrop-filter: blur(8px);
        }

        /* Effects Layer behind content */
        .fs-fx {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .fs-particle-star {
            position: absolute;
            user-select: none;
            pointer-events: none;
            line-height: 1;
            animation: fxTwinkle 1.8s ease-in-out infinite;
        }

        .fs-particle-line {
            position: absolute;
            width: 2.5px;
            border-radius: 99px;
            pointer-events: none;
            opacity: 0;
            animation: fxLineRise 1.6s ease-in-out infinite;
        }

        .fs-screen.fs-win .fs-particle-line {
            background: linear-gradient(to top, rgba(255, 255, 255, 0), rgba(215, 255, 184, .85) 50%, rgba(255, 255, 255, 0));
            box-shadow: 0 0 6px rgba(255, 255, 255, .7);
        }

        .fs-screen.fs-lose .fs-particle-line {
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0), rgba(255, 160, 160, .8) 50%, rgba(255, 255, 255, 0));
            box-shadow: 0 0 6px rgba(255, 100, 100, .5);
            animation-name: fxLineFall;
        }

        .fs-particle-heart {
            position: absolute;
            font-size: 18px;
            user-select: none;
            pointer-events: none;
            opacity: 0;
            animation: fxHeartFall 2.8s ease-in infinite;
        }

        /* Keyframes */
        @keyframes heroWinEntrance {
            0% {
                transform: scale(.3) translateY(80px) rotate(-12deg);
                opacity: 0;
            }

            65% {
                transform: scale(1.15) translateY(-8px) rotate(6deg);
                opacity: 1;
            }

            100% {
                transform: scale(1) translateY(0) rotate(0);
                opacity: 1;
            }
        }

        @keyframes duoWinPump {

            0%,
            55% {
                transform: translateY(0) scale(1, 1) rotate(0deg);
            }

            65% {
                transform: translateY(-4px) scale(1.08, 1.04) rotate(-3deg);
            }

            75% {
                transform: translateY(-8px) scale(1.05, 1.02) rotate(2deg);
            }

            88% {
                transform: translateY(-2px) scale(.99, 1.01) rotate(0deg);
            }

            100% {
                transform: translateY(0) scale(1, 1) rotate(0deg);
            }
        }

        @keyframes duoShadowWin {

            0%,
            55% {
                transform: scale(1);
                opacity: .28;
            }

            75% {
                transform: scale(.82);
                opacity: .14;
            }

            100% {
                transform: scale(1);
                opacity: .28;
            }
        }

        @keyframes heroLoseEntrance {
            0% {
                transform: translateY(-60px) scale(.8);
                opacity: 0;
            }

            70% {
                transform: translateY(8px) scale(1.03);
                opacity: 1;
            }

            100% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        @keyframes heroLoseShake {

            0%,
            100% {
                transform: translateX(0);
            }

            20% {
                transform: translateX(-8px) rotate(-2deg);
            }

            40% {
                transform: translateX(8px) rotate(2deg);
            }

            60% {
                transform: translateX(-5px);
            }

            80% {
                transform: translateX(4px);
            }
        }

        @keyframes duoLoseBreathe {

            0%,
            100% {
                transform: translateY(0) scale(1, 1);
            }

            50% {
                transform: translateY(3px) scale(1.01, .97);
            }
        }

        @keyframes duoShadowLose {

            0%,
            100% {
                transform: scale(1);
                opacity: .26;
            }

            50% {
                transform: scale(1.04);
                opacity: .32;
            }
        }

        @keyframes fxTwinkle {

            0%,
            100% {
                transform: scale(0) rotate(0deg);
                opacity: 0;
            }

            50% {
                transform: scale(1.2) rotate(90deg);
                opacity: .95;
            }
        }

        @keyframes fxLineRise {
            0% {
                transform: translateY(40px);
                opacity: 0;
            }

            30%,
            70% {
                opacity: .85;
            }

            100% {
                transform: translateY(-160px);
                opacity: 0;
            }
        }

        @keyframes fxLineFall {
            0% {
                transform: translateY(-40px);
                opacity: 0;
            }

            30%,
            70% {
                opacity: .85;
            }

            100% {
                transform: translateY(160px);
                opacity: 0;
            }
        }

        @keyframes fxHeartFall {
            0% {
                transform: translateY(-30px) rotate(-10deg);
                opacity: 0;
            }

            25% {
                opacity: .75;
            }

            100% {
                transform: translateY(180px) rotate(25deg);
                opacity: 0;
            }
        }

        /* flottant "+1" / combo */
        .float-msg {
            position: fixed;
            left: 50%;
            top: 38%;
            z-index: 160;
            pointer-events: none;
            transform: translateX(-50%);
            font-weight: 900;
            font-size: 30px;
            color: var(--green);
            text-shadow: 0 3px 0 rgba(0, 0, 0, .08);
            animation: floatUp 1s ease-out forwards;
        }

        @keyframes floatUp {
            0% {
                transform: translate(-50%, 10px) scale(.4);
                opacity: 0
            }

            25% {
                transform: translate(-50%, -10px) scale(1.2);
                opacity: 1
            }

            100% {
                transform: translate(-50%, -70px) scale(1);
                opacity: 0
            }
        }

        /* boutons */
        .btn-3d:not(:disabled) {
            transition: transform .08s, border-bottom-width .08s, filter .15s
        }

        #btn-verify:not(:disabled) {
            animation: readyPop .35s cubic-bezier(.34, 1.8, .5, 1)
        }

        @keyframes readyPop {
            0% {
                transform: scale(.96)
            }

            60% {
                transform: scale(1.04)
            }

            100% {
                transform: scale(1)
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important
            }
        }

        /* --- Comparaison de réponses --- */
        .cmp-wrap {
            display: flex;
            align-items: stretch;
            gap: 8px;
            margin: 16px 0 4px;
        }

        .cmp-box {
            flex: 1;
            border-radius: 14px;
            padding: 12px 14px;
            background: rgba(255, 255, 255, .75);
            text-align: center;
        }

        .cmp-label {
            font-size: 10.5px;
            font-weight: 900;
            letter-spacing: .12em;
            text-transform: uppercase;
            opacity: .65;
            margin-bottom: 6px;
        }

        .cmp-text {
            font-family: Georgia, serif;
            font-size: 17px;
            font-weight: 900;
            line-height: 1.25;
            word-break: break-word;
        }

        .cmp-wrong .cmp-text {
            color: #E53935;
            text-decoration: line-through;
            text-decoration-thickness: 2px;
            text-decoration-color: rgba(229, 57, 53, .4);
        }

        .cmp-good .cmp-text {
            color: #46A302;
        }

        .cmp-vs {
            align-self: center;
            font-size: 20px;
            font-weight: 900;
            color: #E53935;
            opacity: .6;
        }

        .fixed-tips {
            margin-top: 18px;
            padding: 14px 16px;
            background: rgba(255, 255, 255, .65);
            border-radius: 14px;
            border-left: 4px solid #FF4B4B;
            font-size: 12.5px;
            line-height: 1.55;
            color: #7A1A1A;
            text-align: left;
        }

        .fixed-tips .ft-title {
            font-size: 11px;
            font-weight: 900;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: #E53935;
            margin-bottom: 6px;
        }

        .fixed-tips .ft-body b {
            color: #5C0000;
            font-weight: 900;
        }

        /* طبقة تأثيرات الصدمة والموجة */
        .victory-wave-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 120;
            overflow: hidden;
        }

        /* توهج أخضر يغمر الشاشة بالكامل */
        .screen-radiance {
            position: absolute;
            border-radius: 50%;
            left: 50%;
            bottom: 20%;
            width: 140vmax;
            height: 140vmax;
            transform: translate(-50%, 50%) scale(0.1);
            background: radial-gradient(circle, rgba(88, 204, 2, 0.45) 0%, rgba(88, 204, 2, 0.15) 50%, transparent 75%);
            animation: radianceExpand 1s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        @keyframes radianceExpand {
            0% {
                transform: translate(-50%, 50%) scale(0.05);
                opacity: 1;
            }

            60% {
                opacity: 0.8;
            }

            100% {
                transform: translate(-50%, 50%) scale(1.4);
                opacity: 0;
            }
        }

        .shockwave-ring {
            position: absolute;
            border-radius: 50%;
            left: 50%;
            bottom: 30%;
            transform: translate(-50%, 50%) scale(0);
            border: 4px solid #58CC02;
            box-shadow: 0 0 16px rgba(88, 204, 2, 0.8), inset 0 0 12px rgba(255, 255, 255, 0.6);
            animation: ringSurge 1.1s cubic-bezier(0.1, 0.7, 0.2, 1) forwards;
        }

        .shockwave-ring:nth-child(2) {
            border-color: #89E219;
            animation-delay: 0.15s;
            border-width: 5px;
        }

        .shockwave-ring:nth-child(3) {
            border-color: #FFFFFF;
            animation-delay: 0.3s;
            border-width: 3px;
        }

        @keyframes ringSurge {
            0% {
                width: 30px;
                height: 30px;
                opacity: 1;
                transform: translate(-50%, 50%) scale(0.2);
            }

            70% {
                opacity: 0.85;
            }

            100% {
                width: 1200px;
                height: 1200px;
                opacity: 0;
                transform: translate(-50%, 50%) scale(2.2);
            }
        }

        @keyframes svgRippleAnim {
            0% {
                r: 12px;
                stroke-width: 6px;
                opacity: 1;
            }

            100% {
                r: 42px;
                stroke-width: 0px;
                opacity: 0;
            }
        }

            fill: none;
            stroke: #1CB0F6;
            animation: svgRippleAnim 0.45s ease-out forwards;

        }

        .sheet-drag-handle {
            width: 44px;
            height: 5px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 99px;
            margin: -14px auto 16px;
            cursor: grab;
            touch-action: none;
            /* منع السحب الافتراضي للمتصفح */
        }

        .sheet {
            touch-action: pan-y;
            will-change: transform, opacity;
            transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.3, 1), opacity 0.25s ease;
        }

        .sheet.dragging {
            transition: none !important;
            /* استجابة فورية وحية أثناء حركة الإصبع */
        }

        #splash-screen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: var(--green);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), transform 0.5s ease;
        }

        /* رموز كيميائية طافية متناثرة في الخلفية */
        .floating-formula {
            position: absolute;
            color: rgba(255, 255, 255, 0.18);
            font-family: monospace;
            font-weight: 900;
            pointer-events: none;
            user-select: none;
            animation: floatFormula 7s ease-in-out infinite alternate;
        }

        @keyframes floatFormula {
            0% {
                transform: translateY(0px) rotate(0deg);
            }

            100% {
                transform: translateY(-35px) rotate(18deg);
            }
        }

        /* شعار التطبيق مع حركة نبض */
        .splash-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            z-index: 2;
            animation: splashPulse 1.8s ease-in-out infinite alternate;
        }

        @keyframes splashPulse {
            0% {
                transform: scale(0.96);
            }

            100% {
                transform: scale(1.04);
            }
        }

        .splash-icon {
            width: 82px;
            height: 82px;
            background: #fff;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            box-shadow: 0 8px 0 var(--green-d);
        }

        .splash-title {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: -0.5px;
        }

        /* شريط التحميل */
        .splash-loader-bar {
            width: 170px;
            height: 10px;
            background: rgba(0, 0, 0, 0.18);
            border-radius: 99px;
            overflow: hidden;
            margin-top: 18px;
        }

        .splash-loader-fill {
            height: 100%;
            width: 0%;
            background: #fff;
            border-radius: 99px;
            transition: width 1.8s cubic-bezier(0.1, 0.8, 0.2, 1);

            0% {
                opacity: .35;
            }

            100% {
                opacity: 0;
            }
        }

        .rad-badge circle {
            fill: #FFF;
            stroke: #F59E0B;
            stroke-width: 3px;
        }

        .rad-badge text {
            fill: #D97706;
            font-weight: 900;
            font-size: 13px;
        }
    </style>
</head>

        /* débloque l'audio dès la 1re interaction (exigé par les navigateurs) */

        /* Bouton son : on/off */

            else if (t.id === 'btn-rappel') SFX.play('open');

        /* Helper pour particules plein écran (étoiles / lignes scintillantes / coeurs brisés) */
        function spawnFsParticles(container, heroEl, kind) {
            if (!container) return;
            const heroRect = heroEl ? heroEl.getBoundingClientRect() : null;
            const pad = 24;
            const safeBox = heroRect ? {
                left: heroRect.left - pad,
                top: heroRect.top - pad,
                right: heroRect.right + pad,
                bottom: heroRect.bottom + pad
            } : null;

            const isWin = kind === 'win';
            const starCount = isWin ? 18 : 6;
            const lineCount = isWin ? 16 : 14;
            const heartCount = isWin ? 0 : 8;

            const getNonHeroPos = () => {
                const W = window.innerWidth;
                const H = window.innerHeight;
                for (let retry = 0; retry < 25; retry++) {
                    const x = Math.random() * (W - 30);
                    const y = Math.random() * (H - 50);
                    if (!safeBox || x < safeBox.left || x > safeBox.right || y < safeBox.top || y > safeBox.bottom) {
                        return { x, y };
                    }
                }
                return { x: Math.random() * (W - 30), y: Math.random() * (H - 50) };
            };

            // Étoiles scintillantes
            const starColors = isWin ? ['#FFFFFF', '#D7FFB8', '#FFC800', '#FFFFFF'] : ['#FFA8A8', '#FFFFFF', '#FFCDD2'];

        /* ---------- Confettis ---------- */
        function confetti(opts) {
            opts = opts || {};
            const n = opts.count || 70;
            const colors = opts.colors || ['#58CC02', '#89E219', '#1CB0F6', '#FFC800', '#FF4B4B', '#CE82FF', '#FF9600'];
            const layer = document.createElement('div');
            layer.className = 'fx-layer';
            document.body.appendChild(layer);
            const ox = (opts.x != null ? opts.x : .5) * window.innerWidth;
            const oy = (opts.y != null ? opts.y : .75) * window.innerHeight;
            const spread = opts.spread || 1;
            for (let i = 0; i < n; i++) {
                const p = document.createElement('div');
                p.className = 'confetti';
                const size = 6 + Math.random() * 8;
                const shape = Math.random();
                p.style.cssText = 'left:' + ox + 'px;top:' + oy + 'px;width:' + size + 'px;height:' + (shape > .6 ? size : size * .5) + 'px;background:'

                layer.appendChild(p);
                const ang = (-Math.PI / 2) + (Math.random() - .5) * Math.PI * 1.15 * spread;
                const vel = (opts.power || 1) * (260 + Math.random() * 420);
                const dx = Math.cos(ang) * vel, dy = Math.sin(ang) * vel;
                const rot = (Math.random() - .5) * 1080;
                const fall = 500 + Math.random() * 300;
                p.animate([
                    { transform: 'translate(0,0) rotate(0deg) scale(1)', opacity: 1 },

            }
            setTimeout(() => layer.remove(), 2500);

           UTILITAIRES
