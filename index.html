        const $app = document.getElementById('app');
        function el(html) {
            const t = document.createElement('template');
            t.innerHTML = html.trim();
            return t.content.firstChild;
        }
        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }
        function shuffle(a) {
            const b = a.slice();
            for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[b[i], b[j]] = [b[j], b[i]]; }
            return b;
        }
        function sameSet(a, b) {
            if (a.length !== b.length) return false;
            const sb = new Set(b);
            return a.every(x => sb.has(x));
        }
        function cmpLocants(a, b) {
            const n = Math.max(a.length, b.length);
            for (let i = 0; i < n; i++) {
                const x = a[i] ?? Infinity, y = b[i] ?? Infinity;
                if (x !== y) return x - y;
            }
            return 0;
        }
        function toast(msg) {
            document.querySelectorAll('.toast').forEach(t => t.remove());
            const t = el('<div class="toast">' + msg + '</div>');
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 2800);
        }
        function currentMol() {
            return MOLECULES[WORLDS[state.worldIdx].levels[state.levelIdx].mol];
        }
        function hasHetero(mol) { return mol.atoms.some(a => a.el !== 'C'); }
        function hasMultiple(mol) { return mol.bonds.some(b => (b[2] || 1) > 1); }

        /* ============================================================
           JEU ALÉATOIRE
           ============================================================ */
        function pickRandomLevel(excludeW, excludeL) {
            const all = [];
            WORLDS.forEach((w, wi) => w.levels.forEach((_, li) => {
                if (!(wi === excludeW && li === excludeL)) all.push([wi, li]);
            }));
            return all[Math.floor(Math.random() * all.length)];
        }
        function startRandom(fromW, fromL) {
            state._lastPct = null;
            const [wi, li] = pickRandomLevel(fromW, fromL);
            openLevel(wi, li, true);
        }

        /* ============================================================
           DISTRACTEURS
           ============================================================ */
        const CHAIN_PREFIXES = ['méth', 'éth', 'prop', 'but', 'pent', 'hex', 'hept', 'oct', 'non', 'déc', 'undéc', 'dodéc'];
        const CHAIN_SUFFIXES = ['ane', 'ène', 'yne'];

        function generateLocantVariants(token) {
            const variants = new Set();
            let m = token.match(/^(\d+(?:,\d+)*)-(.*)$/);
            if (m) {
                const nums = m[1].split(',').map(Number);
                const suffix = m[2];
                for (let i = 0; i < nums.length; i++) {
                    for (const d of [-1, 1]) {
                        if (nums[i] + d >= 1) {
                            const nn = nums.slice(); nn[i] = nums[i] + d;
                            nn.sort((a, b) => a - b);
                            variants.add(nn.join(',') + '-' + suffix);
                        }
                    }
                }
            }
            m = token.match(/^-(\d+(?:,\d+)*)-(.*)$/);
            if (m) {
                const nums = m[1].split(',').map(Number);
                const suffix = m[2];
                for (let i = 0; i < nums.length; i++) {
                    for (const d of [-1, 1]) {
                        if (nums[i] + d >= 1) {
                            const nn = nums.slice(); nn[i] = nums[i] + d;
                            nn.sort((a, b) => a - b);
                            variants.add('-' + nn.join(',') + '-' + suffix);
                        }
                    }
                }
            }
            return [...variants];
        }

        function generateChainVariants(token) {
            const variants = new Set();
            const lower = token.toLowerCase();
            for (const ch of CHAIN_PREFIXES) {
                if (lower.startsWith(ch)) {
                    const rest = token.slice(ch.length);
                    if (rest === '' || CHAIN_SUFFIXES.includes(rest)) {
                        for (const ch2 of CHAIN_PREFIXES) {
                            if (ch2 === ch) continue;
                            variants.add(ch2 + rest);
                        }
                    }
                    break;
                }
            }
            for (const suf of CHAIN_SUFFIXES) {
                if (lower.endsWith(suf)) {
                    const base = token.slice(0, -suf.length);
                    for (const suf2 of CHAIN_SUFFIXES) {
                        if (suf2 === suf) continue;
                        variants.add(base + suf2);
                    }
                    break;
                }
            }
            return [...variants];
        }

        const GENERIC_NAME_POOL = [
            'méthane', 'éthane', 'propane', 'butane', 'pentane', 'hexane', 'heptane', 'octane', 'nonane', 'décane',
            'éthène', 'propène', 'but-1-ène', 'but-2-ène', 'pent-1-ène', 'pent-2-ène',
            'éthyne', 'propyne', 'but-1-yne', 'but-2-yne',
            'cyclopropane', 'cyclobutane', 'cyclopentane', 'cyclohexane', 'cycloheptane',
            'méthylpropane', 'méthylbutane', 'méthylpentane', 'méthylhexane',
            'diméthylpropane', 'diméthylbutane', 'diméthylpentane',
            'méthylcyclopropane', 'méthylcyclobutane', 'méthylcyclopentane', 'méthylcyclohexane',
            'diméthylcyclopropane', 'diméthylcyclobutane', 'diméthylcyclopentane', 'diméthylcyclohexane',
            'éthylpropane', 'éthylbutane', 'éthylpentane',
            'buta-1,3-diène', 'penta-1,3-diène', 'penta-1,4-diène', 'hexa-1,3-diène',
        ];

        function buildNamePool(mol, targetSize = 15) {
            const correct = mol.tokens.slice();
            const out = new Set(correct);
            (mol.distractors || []).forEach(d => out.add(d));
            correct.forEach(tok => {
                generateLocantVariants(tok).forEach(v => out.add(v));
                generateChainVariants(tok).forEach(v => out.add(v));
            });
            const correctNorm = mol.name.toLowerCase().replace(/\s/g, '');
            for (const g of shuffle(GENERIC_NAME_POOL)) {
                if (out.size >= targetSize) break;
                if (g.toLowerCase().replace(/\s/g, '') === correctNorm) continue;
                out.add(g);
            }
            let arr = [...out];
            const maxSize = Math.max(targetSize, correct.length + 7);
            if (arr.length > maxSize) {
                const correctInArr = arr.filter(x => correct.includes(x));
                const others = shuffle(arr.filter(x => !correct.includes(x)));
                arr = [...correctInArr, ...others.slice(0, maxSize - correctInArr.length)];
            }
            return shuffle(arr);
        }

        /* ============================================================
           MOTEUR IUPAC
           ============================================================ */
        const HALOGENS = { F: 'fluoro', Cl: 'chloro', Br: 'bromo', I: 'iodo' };

        function adjacencyOf(mol) {
            const adj = {};
            mol.atoms.forEach(a => adj[a.id] = []);
            mol.bonds.forEach(b => { adj[b[0]].push(b[1]); adj[b[1]].push(b[0]); });
            return adj;
        }

        /* Chaînes principales valides, calculées :
           chemins de carbones avec le MAX de liaisons multiples, puis le plus long. */
        const _chainCache = {};
        /* ============================================================
           محرك السلسلة الرئيسية: الروابط المتعددة -> الطول -> أقصى تفرعات
           ============================================================ */
        function getValidChains(mol) {
            if (_chainCache[mol.id]) return _chainCache[mol.id];
            const adj = adjacencyOf(mol);
            const elOf = {}; mol.atoms.forEach(a => elOf[a.id] = a.el);
            const orderOf = (a, b) => {
                const bd = mol.bonds.find(x => (x[0] === a && x[1] === b) || (x[0] === b && x[1] === a));
                return bd ? (bd[2] || 1) : 1;
            };

            const paths = [];
            const dfs = (path, mult) => {
                paths.push({ path: path.slice(), mult });
                const last = path[path.length - 1];
                (adj[last] || []).forEach(n => {
                    if (elOf[n] !== 'C' || path.includes(n)) return;
                    path.push(n);
                    dfs(path, mult + (orderOf(last, n) > 1 ? 1 : 0));
                    path.pop();
                });
            };
            mol.atoms.filter(a => a.el === 'C').forEach(a => dfs([a.id], 0));

            // 1. أقصى عدد من الروابط غير المشبعة
            const maxMult = Math.max(...paths.map(p => p.mult));
            const m1 = paths.filter(p => p.mult === maxMult);

            // 2. أطول سلسلة
            const maxLen = Math.max(...m1.map(p => p.path.length));
            const m2 = m1.filter(p => p.path.length === maxLen);

            // 3. قاعدة فك التعادل: السلسلة التي تمتلك أكبر عدد من التفرعات (Most branched)
            const countBranches = (path) => {
                let branches = 0;
                path.forEach(cId => {
                    (adj[cId] || []).forEach(nbr => {
                        if (!path.includes(nbr) && elOf[nbr] === 'C') branches++;
                    });
                });
                return branches;
            };

            const maxBranches = Math.max(...m2.map(p => countBranches(p.path)));
            const chains = m2.filter(p => countBranches(p.path) === maxBranches).map(p => p.path);

            return (_chainCache[mol.id] = { chains, maxMult, maxLen, maxBranches });
        }

        /* ============================================================
           محرك الجذور المطور: يدعم الجذور المتفرعة وغير المشبعة
           ============================================================ */
        function getSubstituents(mol, seq) {
            const adj = adjacencyOf(mol);
            const chainSet = new Set(seq);
            const seen = new Set();
            const out = [];

            mol.atoms.forEach(a => {
                if (chainSet.has(a.id) || seen.has(a.id)) return;
                const comp = [];
                const queue = [a.id];
                seen.add(a.id);
                let attach = null; // ذرة السلسلة الرئيسية المرتبط بها الجذر

                while (queue.length) {
                    const x = queue.shift();
                    comp.push(x);
                    (adj[x] || []).forEach(y => {
                        if (chainSet.has(y)) { if (attach === null) attach = y; }
                        else if (!seen.has(y)) { seen.add(y); queue.push(y); }
                    });
                }
                if (attach === null) return;

                // جذر هالوجيني
                if (comp.length === 1 && mol.atoms.find(z => z.id === comp[0]).el !== 'C') {
                    const atom = mol.atoms.find(z => z.id === comp[0]);
                    out.push({ name: HALOGENS[atom.el] || 'substituant', loc: seq.indexOf(attach) + 1, atoms: comp });
                    return;
                }

                // الذرة الأولى في الجذر المتصلة مباشرة بالسلسلة الرئيسية (Root Carbon)
                const rootId = comp.find(cId => (adj[cId] || []).includes(attach)) || comp[0];

                // فحص هل يحتوي الجذر على روابط غير مشبعة (C=C أو C≡C)
                let hasDouble = false, hasTriple = false, unsatPos = 1;
                mol.bonds.forEach(b => {
                    if (comp.includes(b[0]) && comp.includes(b[1])) {
                        const order = b[2] || 1;
                        if (order === 2) { hasDouble = true; unsatPos = (b[0] === rootId || b[1] === rootId) ? 1 : 2; }
                        if (order === 3) { hasTriple = true; unsatPos = (b[0] === rootId || b[1] === rootId) ? 1 : 2; }
                    }
                });

                let name = 'alkyl';

                // 1) جذور غير مشبعة (-ényle / -ynyle)
                if (hasDouble) {
                    if (comp.length === 2) name = 'éthényl'; // أو vinyle
                    else if (comp.length === 3) name = `prop-${unsatPos}-ényl`;
                }
                else if (hasTriple) {
                    if (comp.length === 2) name = 'éthynyl';
                    else if (comp.length === 3) name = `prop-${unsatPos}-ynyl`;
                }
                // 2) جذور ألكيلية مشبعة (Alkyles)
                else {
                    const cCount = comp.length;
                    if (cCount === 1) name = 'méthyl';
                    else if (cCount === 2) name = 'éthyl';
                    else if (cCount === 3) {
                        // حساب عدد ذرات الكربون المتصلة بذرة الجذر مباشرة
                        const rootNeighborsInComp = (adj[rootId] || []).filter(id => comp.includes(id));
                        name = (rootNeighborsInComp.length === 2) ? 'isopropyle' : 'propyle';
                    }
                    else if (cCount === 4) {
                        const rootNeighborsInComp = (adj[rootId] || []).filter(id => comp.includes(id));
                        const rootDeg = rootNeighborsInComp.length; // عدد الجيران داخل الجذر

                        if (rootDeg === 3) name = 'tert-butyle';
                        else if (rootDeg === 2) name = 'sec-butyle';
                        else {
                            // تمييز isobutyle عن butyle الخطي
                            // isobutyle: الجار الوحيد للـ root متصل بـ 3 كربونات
                            const onlyNeighbor = rootNeighborsInComp[0];
                            const neighborDeg = (adj[onlyNeighbor] || []).filter(id => comp.includes(id)).length;
                            name = (neighborDeg === 3) ? 'isobutyle' : 'butyle';
                        }
                    }
                }

                out.push({ name, loc: seq.indexOf(attach) + 1, atoms: comp });
            });

            return out;
        }

        function numberingOf(mol, seq) {
            const pos = {};
            seq.forEach((id, i) => pos[id] = i + 1);
            const enes = [], ynes = [];
            mol.bonds.forEach(bd => {
                const o = bd[2] || 1;
                if (o > 1 && pos[bd[0]] && pos[bd[1]]) {
                    const l = Math.min(pos[bd[0]], pos[bd[1]]);
                    (o === 2 ? enes : ynes).push(l);
                }
            });
            const num = (a, b) => a - b;
            enes.sort(num); ynes.sort(num);
            const unsat = [...enes, ...ynes].sort(num);
            const subs = getSubstituents(mol, seq);
            const subLocs = subs.map(s => s.loc).sort(num);
            const alpha = subs.slice()
                .sort((x, y) => x.name.localeCompare(y.name, 'fr') || x.loc - y.loc)
                .map(s => s.loc);
            return { unsat, enes, ynes, subs, subLocs, alpha };
        }

        function cmpNum(a, b) {
            let c = cmpLocants(a.unsat, b.unsat);
            if (c) return { c, reason: 'unsat' };
            c = cmpLocants(a.enes, b.enes);
            if (c) return { c, reason: 'ene' };
            c = cmpLocants(a.subLocs, b.subLocs);
            if (c) return { c, reason: 'subs' };
            c = cmpLocants(a.alpha, b.alpha);
            if (c) return { c, reason: 'alpha' };
            return { c: 0, reason: null };
        }

        function isValidCycle(mol, seq) {
            const n = seq.length;
            if (n < 3) return false;
            for (let i = 0; i < n; i++) {
                const a = seq[i], b = seq[(i + 1) % n];
                const bonded = mol.bonds.some(bd =>
                    (bd[0] === a && bd[1] === b) || (bd[1] === a && bd[0] === b));
                if (!bonded) return false;
            }
            return true;
        }

        function bestRingNumbering(mol) {
            const ring = mol.ringOrder;
            if (!ring) return null;
            const n = ring.length;
            let best = null;
            for (let start = 0; start < n; start++) {
                for (const dir of [1, -1]) {
                    const seq = [];
                    for (let i = 0; i < n; i++) {
                        const idx = ((start + i * dir) % n + n) % n;
                        seq.push(ring[idx]);
                    }
                    const nm = numberingOf(mol, seq);
                    if (!best || cmpNum(nm, best.nm).c < 0) {
                        best = { seq, nm };
                    }
                }
            }
            return best;
        }

        /* ============================================================
           RENDU SVG
           ============================================================ */
        function renderMolecule(mol, opts = {}) {
            const { chain = [], subs = [], bad = [], good = [], interactive = false } = opts;

            const numbering = {};
            chain.forEach((id, i) => numbering[id] = i + 1);
            const chainSet = new Set(chain);
            const chainBondKeys = new Set();
            for (let i = 0; i < chain.length - 1; i++) {
                chainBondKeys.add([chain[i], chain[i + 1]].sort().join('-'));
            }
            const ringClosed = mol.ringOrder && chain.length === mol.ringOrder.length && sameSet(chain, mol.ringOrder);
            if (ringClosed) {
                chainBondKeys.add([chain[0], chain[chain.length - 1]].sort().join('-'));
            }

            const pad = 42;
            const xs = mol.atoms.map(a => a.x);
            const ys = mol.atoms.map(a => a.y);
            const minX = Math.min(...xs) - pad, maxX = Math.max(...xs) + pad;
            const minY = Math.min(...ys) - pad, maxY = Math.max(...ys) + pad;
            const vw = maxX - minX, vh = maxY - minY;

            let svg = '<svg viewBox="' + minX + ' ' + minY + ' ' + vw + ' ' + vh + '" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">';

            mol.bonds.forEach(bd => {
                const a1 = mol.atoms.find(a => a.id === bd[0]);
                const a2 = mol.atoms.find(a => a.id === bd[1]);
                if (!a1 || !a2) return;
                const key = [bd[0], bd[1]].sort().join('-');
                if (!chainBondKeys.has(key)) {
                    svg += bondPath(a1, a2, bd[2] || 1, '#3C3C3C', 3.2, a1.el !== 'C' ? 26 : 22, a2.el !== 'C' ? 26 : 22);
                }
            });

            for (let i = 0; i < chain.length - 1; i++) {
                const a1 = mol.atoms.find(a => a.id === chain[i]);
                const a2 = mol.atoms.find(a => a.id === chain[i + 1]);
                if (!a1 || !a2) continue;
                const bond = mol.bonds.find(b => (b[0] === a1.id && b[1] === a2.id) || (b[0] === a2.id && b[1] === a1.id));
                svg += bondPath(a1, a2, bond ? (bond[2] || 1) : 1, '#58CC02', 6, 28, 28);
            }
            if (ringClosed) {
                const first = mol.atoms.find(a => a.id === chain[0]);
                const last = mol.atoms.find(a => a.id === chain[chain.length - 1]);
                if (first && last) {
                    const bond = mol.bonds.find(b => (b[0] === first.id && b[1] === last.id) || (b[0] === last.id && b[1] === first.id));
                    svg += bondPath(first, last, bond ? (bond[2] || 1) : 1, '#58CC02', 6, 28, 28);
                }
            }

            mol.atoms.forEach(a => {
                const isHetero = a.el !== 'C';
                const inChain = chainSet.has(a.id);
                const isSub = subs.includes(a.id);
                const isBad = bad.includes(a.id);
                const isGood = good.includes(a.id);
                const hitR = isHetero ? 36 : 32;

                let shapeFill = '#3C3C3C', shapeStroke = 'transparent', shapeStrokeW = 0, shapeR = 8;

                if (isHetero) {
                    const colors = { O: '#FF4B4B', N: '#1CB0F6', Cl: '#0D9488', Br: '#A16207', F: '#EC4899', I: '#9333EA', S: '#FFC800' };
                    shapeFill = colors[a.el] || '#CE82FF';
                    shapeR = 20; shapeStroke = '#fff'; shapeStrokeW = 3;
                }
                if (inChain) { shapeFill = '#58CC02'; shapeR = isHetero ? 22 : 12; shapeStroke = '#fff'; shapeStrokeW = 3; }
                if (isSub) { shapeFill = '#FFC800'; shapeR = isHetero ? 22 : 12; shapeStroke = '#fff'; shapeStrokeW = 3; }
                if (isBad) { shapeFill = '#FF4B4B'; shapeR = isHetero ? 24 : 14; shapeStroke = '#fff'; shapeStrokeW = 3; }
                if (isGood) { shapeFill = '#58CC02'; shapeR = isHetero ? 24 : 14; shapeStroke = '#fff'; shapeStrokeW = 3; }

                svg += '<g class="atom-hit" ' + (interactive ? 'data-atom="' + a.id + '"' : '') + '>';
                svg += '<circle cx="' + a.x + '" cy="' + a.y + '" r="' + hitR + '" fill="transparent"/>';
                svg += '<circle class="atom-shape" cx="' + a.x + '" cy="' + a.y + '" r="' + shapeR + '" fill="' + shapeFill + '" stroke="' + shapeStroke + '" stroke-width="' + shapeStrokeW + '"/>';

                if (isHetero) {
                    const fs = a.el.length > 1 ? 15 : 17;
                    svg += '<text x="' + a.x + '" y="' + (a.y + fs / 3) + '" text-anchor="middle" font-size="' + fs + '" font-weight="900" fill="#fff" font-family="-apple-system,sans-serif">' + a.el + '</text>';
                }

                if (numbering[a.id]) {
                    const nx = a.x, ny = a.y - 24;
                    svg += '<g><circle cx="' + nx + '" cy="' + ny + '" r="14" fill="#fff" stroke="#58CC02" stroke-width="3"/>';
                    svg += '<text x="' + nx + '" y="' + (ny + 5) + '" text-anchor="middle" font-size="14" font-weight="900" fill="#58CC02" font-family="-apple-system,sans-serif">' + numbering[a.id] + '</text></g>';
                }
                svg += '</g>';
            });

            svg += '</svg>';
            return svg;
        }

        function bondPath(a1, a2, order, color, width, r1, r2) {
            const dx = a2.x - a1.x, dy = a2.y - a1.y;
            const len = Math.hypot(dx, dy) || 1;
            const ux = dx / len, uy = dy / len;
            const px = -uy, py = ux;
            const x1 = a1.x + ux * r1, y1 = a1.y + uy * r1;
            const x2 = a2.x - ux * r2, y2 = a2.y - uy * r2;
            const attr = 'stroke="' + color + '" stroke-width="' + width + '" stroke-linecap="round" fill="none"';

            let inner = '';
            if (order === 1) {
                inner = '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" ' + attr + '/>';
            } else if (order === 2) {
                const off = width * 1.7, shrink = 0.22;
                const bx = x2 - x1, by = y2 - y1;
                const ox = px * off, oy = py * off;
                inner = '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" ' + attr + '/>'
                    + '<line x1="' + (x1 + bx * shrink + ox) + '" y1="' + (y1 + by * shrink + oy) + '" x2="' + (x2 - bx * shrink + ox) + '" y2="' + (y2 - by * shrink + oy) + '" ' + attr + '/>';
            } else {
                const off = width * 2.1, shrink = 0.22;
                const bx = x2 - x1, by = y2 - y1;
                inner = '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" ' + attr + '/>';
                [1, -1].forEach(sgn => {
                    const ox = px * off * sgn, oy = py * off * sgn;
                    inner += '<line x1="' + (x1 + bx * shrink + ox) + '" y1="' + (y1 + by * shrink + oy) + '" x2="' + (x2 - bx * shrink + ox) + '" y2="' + (y2 - by * shrink + oy) + '" ' + attr + '/>';
                });
            }

            // ✅ لف في مجموعة قابلة للتحديث
            const gid = [a1.id, a2.id].sort().join('-');
            return '<g class="bond" data-bond="' + gid + '">' + inner + '</g>';
        }

        /* ============================================================
           ACCUEIL
           ============================================================ */
        function renderHome() {
            state.view = 'home';
            state.random = false;
            const totalLevels = WORLDS.reduce((s, w) => s + w.levels.length, 0);
            const doneCount = Object.values(state.progress).filter(p => p.done).length;

            /* 1) Section « Jeu aléatoire » en première position */
            let worldsHTML = '<div class="random-card">'
                + '<div class="kicker">Mode libre</div>'
                + '<h2>🎲 Jeu aléatoire</h2>'
                + '<p></p>'
                + '<button class="btn-3d btn-gold" id="btn-random">Lancer un défi</button>'
                + '</div>';

            let bannerShown = false;
            WORLDS.forEach((w, wi) => {
                if (w.section && !bannerShown) {
                    bannerShown = true;
                    worldsHTML += '<div class="section-banner">'
                        + '<div class="kicker">Nouvelle section</div>'
                        + '<h2>Synthèse des composés mixtes:</h2>'


                        + '</div>';
                }
                const wDone = w.levels.filter((_, li) => state.progress[w.id + ':' + li]?.done).length;
                let levelsHTML = '';
                w.levels.forEach((lv, li) => {
                    const key = w.id + ':' + li;
                    const p = state.progress[key];
                    const mol = MOLECULES[lv.mol];
                    const stars = p?.stars || 0;
                    const starsHTML = p?.done
                        ? '<span class="level-stars">' + '★'.repeat(stars) + '☆'.repeat(3 - stars) + '</span>'
                        : '<span class="level-arrow">›</span>';

                    levelsHTML += '<button class="level-row' + (p?.done ? ' done' : '') + '" data-w="' + wi + '" data-l="' + li + '">'
                        + '<div class="level-badge">' + (p?.done ? '✓' : (li + 1)) + '</div>'
                        + '<div class="level-meta"><h3>' + escapeHtml(mol.formula) + '</h3><p>' + (mol.family || '') + '</p></div>'
                        + starsHTML
                        + '</button>';
                });

                const collapsedIds = JSON.parse(localStorage.getItem('nomenduo_collapsed') || '[]');
                const isCollapsed = collapsedIds.includes(w.id);

                worldsHTML += '<section class="world-section' + (isCollapsed ? ' collapsed' : '') + '" data-world="' + w.id + '">'
                    + '<div class="world-title">'
                    + '<span class="badge" style="background:' + w.color + '">' + w.icon + '</span>'
                    + '<h2>' + w.title + '</h2>'
                    + '<span class="count">' + wDone + '/' + w.levels.length + '</span>'
                    + '<button class="world-toggle" data-toggle="' + w.id + '" aria-label="Replier / Déplier">'
                    + '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>'
                    + '</button>'
                    + '</div>'
                    + '<div class="levels">' + levelsHTML + '</div>'
                    + '</section>';
            });

            const home = el(
                '<div class="home">'
                + '<div class="home-hero">'
                + sndButtonHTML()
                + '<h1>Nomen<span class="accent">Duo</span></h1>'
                + '<p>Atelier nomenclature IUPAC</p>'
                + '</div>'
                + '<div class="home-stats">'
                + '<div class="stat-chip"><span class="ico">🏆</span><div><b>' + doneCount + '</b> <span>niveaux</span></div></div>'
                + '<div class="stat-chip"><span class="ico">🧪</span><div><b>' + totalLevels + '</b> <span>défis</span></div></div>'
                + '</div>'
                + '<div class="worlds">' + worldsHTML + '</div>'
                + '</div>'
            );

            $app.innerHTML = '';
            $app.appendChild(home);
            home.querySelector('#btn-random').addEventListener('click', () => startRandom(null, null));
            home.querySelectorAll('.level-row').forEach(b => {
                b.addEventListener('click', () => openLevel(+b.dataset.w, +b.dataset.l, false));
            });
            home.querySelectorAll('.world-toggle').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const worldId = btn.dataset.toggle;
                    const section = home.querySelector('.world-section[data-world="' + worldId + '"]');
                    section.classList.toggle('collapsed');

                    /* حفظ الحالة */
                    const collapsedIds = new Set(JSON.parse(localStorage.getItem('nomenduo_collapsed') || '[]'));
                    if (section.classList.contains('collapsed')) collapsedIds.add(worldId);
                    else collapsedIds.delete(worldId);
                    localStorage.setItem('nomenduo_collapsed', JSON.stringify([...collapsedIds]));
                });
            });
        }

        /* ============================================================
           OUVERTURE D'UN NIVEAU
           ============================================================ */
        function openLevel(wi, li, isRandom = false) {
            state._lastPct = null;
            const world = WORLDS[wi];
            const level = world.levels[li];
            const mol = MOLECULES[level.mol];

            /* 🔧 FIX : ignorer l'étape "chain" s'il n'y a pas de chaîne à choisir
               (molécule à 1 seul carbone : méthane et dérivés) */
            const carbonCount = mol.atoms.filter(a => a.el === 'C').length;
            const needChainStep = carbonCount > 1;

            let steps = level.steps.filter(s => s !== 'chain');
            if (needChainStep) {
                steps.unshift('chain');
            }

            state.worldIdx = wi;
            state.levelIdx = li;
            state.random = !!isRandom;
            state.steps = steps;
            state.stepIdx = 0;
            state.stepState = {};
            state.chainSequence = [];
            state.confirmedSubs = [];
            state.mistakes = 0;

            /* 🔧 Pré-remplir la "chaîne" avec l'unique carbone pour que les étapes
               suivantes (subs, name) sachent quelle chaîne utiliser */
            if (!needChainStep) {
                state.chainSequence = mol.atoms.filter(a => a.el === 'C').map(a => a.id);
            }

            renderPlay();
        }

        /* ============================================================
           ÉCRAN DE JEU
        /* ============================================================
           ÉCRAN DE JEU (مصححة: تم حذف كود rad_num من هنا)
           ============================================================ */
        function renderPlay() {
            state.view = 'play';
            const mol = currentMol();
            const step = state.steps[state.stepIdx];
            const totalSteps = state.steps.length;
            const progress = Math.round((state.stepIdx / totalSteps) * 100);
            const content = renderStep(step, mol);

            const isLastStep = state.stepIdx === state.steps.length - 1;
            const isRappelVisible = (step === 'name') && isLastStep;

            const footerHTML = isRappelVisible
                ? '<div style="display:flex;gap:10px;align-items:stretch">'
                + '<button class="btn-3d btn-blue" id="btn-rappel" style="flex:0 0 auto;width:auto;padding:16px 18px;white-space:nowrap">💡 Rappel</button>'
                + '<button class="btn-3d" id="btn-verify" disabled style="flex:1">Vérifier</button>'
                + '</div>'
                : '<button class="btn-3d" id="btn-verify" disabled>Vérifier</button>';

            const play = el(
                '<div class="play">'
                + '<div class="topbar">'
                + '<button class="close-x" id="btn-close">✕</button>'
                + '<div class="progress-track"><div class="progress-fill" style="width:' + progress + '%"></div></div>'
                + (state.random ? '<span class="rnd-tag">🎲</span>' : '')
                + sndButtonHTML()
                + '<div class="hearts"><span class="heart">❤️</span> <span class="hnum">' + state.hearts + '</span></div>'
                + '</div>'
                + '<div class="play-body">'
                + '<div class="q-block">'
                + '<h2>' + content.title + '</h2>'
                + '<p>' + content.subtitle + '</p>'
                + '</div>'
                + '<div class="stage" id="stage">' + content.molecule + '</div>'
                + '<div class="answer" id="answer">' + content.answers + '</div>'
                + '</div>'
                + '<div class="play-footer">' + footerHTML + '</div>'
                + '</div>'
            );

            $app.innerHTML = '';
            $app.appendChild(play);

            document.getElementById('btn-close').onclick = () => showQuitConfirm();
            document.getElementById('btn-verify').onclick = () => verifyStep();
            const rappelBtn = document.getElementById('btn-rappel');
            if (rappelBtn) rappelBtn.onclick = () => showRappel();

            attachStepListeners(step, mol);
            updateVerifyState();

            const fill = document.querySelector('.progress-fill');
            if (fill) {
                const prevPct = state._lastPct == null ? progress : state._lastPct;
                fill.style.width = prevPct + '%';
                requestAnimationFrame(() => requestAnimationFrame(() => {
                    fill.style.width = progress + '%';
                    if (progress > prevPct) { fill.classList.add('boost'); }
                }));
                state._lastPct = progress;
            }
            if (state._heartLost) {
                state._heartLost = false;
                const h = document.querySelector('.hearts .heart'), n = document.querySelector('.hearts .hnum');
                if (h) h.classList.add('lose');
                if (n) n.classList.add('lose');
            }
        }

        /* ============================================================
           RENDU DES ÉTAPES (مصححة: هنا المكان الصحيح لـ rad_num)
           ============================================================ */
        function renderStep(step, mol) {
            const q = state.stepState;

            if (step === 'chain') {
                const tapped = q.tapped || [];
                let hintText = mol.ringOrder
                    ? 'Touche tous les atomes du cycle dans l\'ordre, en partant d\'un carbone substitué.'
                    : (hasMultiple(mol)
                        ? 'Elle doit contenir toutes les liaisons multiples · seuls les carbones comptent'
                        : 'La plus longue chaîne carbonée · elle doit être continue');
                return {
                    title: 'Choisis la chaîne principale',
                    subtitle: mol.ringOrder
                        ? 'Touche les atomes du cycle un par un. Le numéro 1 doit donner les plus petits indices aux substituants.'
                        : 'Touche les atomes un par un, dans l\'ordre. Chaque atome reçoit son numéro.',
                    hint: hintText,
                    molecule: renderMolecule(mol, { chain: tapped, interactive: true }),
                    answers: '<div style="text-align:center;color:#AFAFAF;font-weight:800;font-size:13px">'
                        + 'Atomes sélectionnés : <b style="color:#58CC02" id="chain-count">' + tapped.length + '</b>'
                        + (tapped.length > 0 ? ' · touche le dernier numéro pour annuler' : '')
                        + '</div>'
                };
            }

            if (step === 'subs') {
                const selected = q.subs || [];
                return {
                    title: 'Identifie les substituants',
                    subtitle: 'Touche tous les atomes qui ne font pas partie de la chaîne principale (ramifications et halogènes).',
                    hint: 'La chaîne est verte, avec sa numérotation',
                    molecule: renderMolecule(mol, { chain: state.chainSequence, subs: selected, interactive: true }),
                    answers: '<div style="text-align:center;color:#AFAFAF;font-weight:800;font-size:13px">'
                        + 'Atomes sélectionnés : <b style="color:#FFC800" id="subs-count">' + selected.length + '</b>'
                        + '</div>'
                };
            }

            // ✅ هنا المكان الصحيح حيث q معرّف وموجود!
            if (step === 'rad_num') {
                const tapped = q.radTapped || [];
                return {
                    title: 'Numérote le radical complexe',
                    subtitle: "Touche les atomes de la ramification dans l'ordre. <b>Le carbone 1' est TOUJOURS celui lié à la chaîne principale</b>.",
                    hint: "Règle d'or : l'indice 1' est imposé par le point d'attache, peu importe les liaisons multiples !",
                    molecule: renderMolecule(mol, { chain: state.chainSequence, subs: tapped, interactive: true }),
                    answers: '<div style="text-align:center;color:#AFAFAF;font-weight:800;font-size:13px">'
                        + 'Numérotation du radical : <b style="color:#F59E0B" id="rad-count">' + tapped.length + '</b>'
                        + (tapped.length > 0 ? " · touche le dernier pour annuler" : '')
                        + '</div>'
                };
            }

            if (step === 'name') {
                const pool = buildNamePool(mol);
                const selected = q.namePieces || [];
                const usedSet = new Set(selected);
                let poolHTML = '';
                pool.forEach(tok => {
                    const used = usedSet.has(tok) ? ' used' : '';
                    poolHTML += '<button class="chip' + used + '" data-tok="' + escapeHtml(tok) + '">' + escapeHtml(tok) + '</button>';
                });
                let slotHTML = '';
                selected.forEach(tok => {
                    slotHTML += '<span class="piece" data-tok="' + escapeHtml(tok) + '">' + escapeHtml(tok) + '</span>';
                });
                return {
                    title: 'Assemble le nom',
                    subtitle: 'Touche les morceaux dans le bon ordre pour former le nom IUPAC.',
                    hint: hasHetero(mol) ? 'Alphabétique : bromo · chloro · éthyl · fluoro · iodo · méthyl' : 'Ordre alphabétique des substituants.',
                    molecule: renderMolecule(mol, { chain: state.chainSequence, subs: state.confirmedSubs || [] }),
                    answers: '<div class="name-slot' + (selected.length === 0 ? ' empty' : '') + '" id="name-slot">' + slotHTML + '</div>'
                        + '<div class="chips" id="chips">' + poolHTML + '</div>'
                };
            }

            return { title: '', subtitle: '', molecule: '', answers: '' };
        }

        /* ============================================================
           INTERACTIONS
           ============================================================ */
        function attachStepListeners(step, mol) {
            const stage = document.getElementById('stage');

            /* ==========================================================
               ÉTAPES : chain & subs — clic sur les atomes
               ========================================================== */
            if (step === 'chain' || step === 'subs' || step === 'rad_num') {
                const svg = stage.querySelector('svg');

                stage.querySelectorAll('[data-atom]').forEach(g => {
                    g.addEventListener('click', (e) => {
                        const id = g.dataset.atom;
                        const atom = mol.atoms.find(a => a.id === id);
                        if (!atom) return;

                        /* ---------- ÉTAPE CHAIN ---------- */
                        if (step === 'chain') {

                            // ❌ Halogène : interdit dans la chaîne
                            if (atom.el !== 'C') {
                                SFX.play('wrong'); shakeApp(); vibrate(40);
                                toast('❌ <b>' + atom.el + '</b> est un halogène : il ne peut pas faire partie de la chaîne principale.');
                                return;
                            }

                            // ✅ Animation seulement si l'atome est valide
                            triggerSvgAtomRipple(svg, atom.x, atom.y);
                            tapAtomFx(g);

                            let seq = (state.stepState.tapped || []).slice();
                            const idx = seq.indexOf(id);

                            if (idx >= 0) {
                                seq = seq.slice(0, idx);
                                SFX.play('unselect');
                            } else if (seq.length === 0) {
                                seq = [id];
                                SFX.play('chip', 0);
                            } else {
                                const last = seq[seq.length - 1];
                                const bonded = mol.bonds.some(b =>
                                    (b[0] === last && b[1] === id) || (b[1] === last && b[0] === id));
                                if (bonded) {
                                    seq.push(id);
                                    SFX.play('chip', seq.length);
                                } else {
                                    SFX.play('unselect');
                                    return;
                                }
                            }
                            state.stepState.tapped = seq;

                            // ✅ Tint des liaisons appartenant à la chaîne
                            const chainBondKeys = new Set();
                            for (let i = 0; i < seq.length - 1; i++) {
                                chainBondKeys.add([seq[i], seq[i + 1]].sort().join('-'));
                            }
                            stage.querySelectorAll('.bond').forEach(bondG => {
                                const inChain = chainBondKeys.has(bondG.dataset.bond);
                                bondG.querySelectorAll('line').forEach(line => {
                                    line.setAttribute('stroke', inChain ? '#58CC02' : '#3C3C3C');
                                    line.setAttribute('stroke-width', inChain ? '6' : '3.2');
                                });
                            });

                            // ✅ Mise à jour visuelle des atomes (halogènes gardent leur couleur)
                            const HAL_COLORS = { O: '#FF4B4B', N: '#1CB0F6', Cl: '#0D9488', Br: '#A16207', F: '#EC4899', I: '#9333EA', S: '#FFC800' };

                            stage.querySelectorAll('[data-atom]').forEach(elG => {
                                const aId = elG.dataset.atom;
                                const aData = mol.atoms.find(a => a.id === aId);
                                const shape = elG.querySelector('.atom-shape');
                                const isSelected = seq.includes(aId);

                                if (shape && aData) {
                                    const isHetero = aData.el !== 'C';
                                    const baseFill = isHetero
                                        ? (HAL_COLORS[aData.el] || '#CE82FF')
                                        : '#3C3C3C';

                                    if (isSelected) {
                                        shape.setAttribute('fill', '#58CC02');
                                        shape.setAttribute('stroke', '#fff');
                                        shape.setAttribute('stroke-width', '3');
                                    } else {
                                        shape.setAttribute('fill', baseFill);
                                        shape.setAttribute('stroke', isHetero ? '#fff' : 'transparent');
                                        shape.setAttribute('stroke-width', isHetero ? '3' : '0');
                                    }
                                }

                                // Badge numéroté
                                const existingBadge = elG.querySelector('.num-badge');
                                if (existingBadge) existingBadge.remove();

                                const orderNum = seq.indexOf(aId) + 1;
                                if (orderNum > 0) {
                                    const at = mol.atoms.find(x => x.id === aId);
                                    const badgeG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                                    badgeG.setAttribute('class', 'num-badge');
                                    badgeG.innerHTML = `<circle cx="${at.x}" cy="${at.y - 24}" r="14" fill="#fff" stroke="#58CC02" stroke-width="3"/>
                                  <text x="${at.x}" y="${at.y - 19}" text-anchor="middle" font-size="14" font-weight="900" fill="#58CC02">${orderNum}</text>`;
                                    elG.appendChild(badgeG);
                                }
                            });

                            const cnt = document.getElementById('chain-count');
                            if (cnt) cnt.textContent = seq.length;
                            updateVerifyState();
                        }

                        /* ---------- ÉTAPE SUBS ---------- */
                        if (step === 'subs') {
                            const chainSet = new Set(state.chainSequence);
                            if (chainSet.has(id)) return;   // Atome de la chaîne → ignoré

                            // ✅ Animation seulement si l'atome est valide
                            triggerSvgAtomRipple(svg, atom.x, atom.y);
                            tapAtomFx(g);

                            let arr = (state.stepState.subs || []).slice();
                            const idx = arr.indexOf(id);

                            if (idx >= 0) {
                                arr.splice(idx, 1);
                                SFX.play('unselect');
                            } else {
                                arr.push(id);
                                SFX.play('select');
                                vibrate(8);
                            }
                            state.stepState.subs = arr;

                            // Mise à jour visuelle
                            const shape = g.querySelector('.atom-shape');
                            if (shape) {
                                const isSub = arr.includes(id);
                                const HAL_COLORS = { O: '#FF4B4B', N: '#1CB0F6', Cl: '#0D9488', Br: '#A16207', F: '#EC4899', I: '#9333EA', S: '#FFC800' };
                                const restoreColor = atom.el === 'C' ? '#3C3C3C' : (HAL_COLORS[atom.el] || '#3C3C3C');
                                shape.setAttribute('fill', isSub ? '#FFC800' : restoreColor);
                            }

                            const cnt = document.getElementById('subs-count');
                            if (cnt) cnt.textContent = arr.length;
                            updateVerifyState();
                        }
                        if (step === 'rad_num') {
                            const svg = stage.querySelector('svg');
                            const chainSet = new Set(state.chainSequence);

                            stage.querySelectorAll('[data-atom]').forEach(g => {
                                g.addEventListener('click', () => {
                                    const id = g.dataset.atom;
                                    // منع النقر على السلسلة الرئيسية (لأنها محددة سلفاً)
                                    if (chainSet.has(id)) return;

                                    let seq = (state.stepState.radTapped || []).slice();
                                    const idx = seq.indexOf(id);

                                    if (idx >= 0) {
                                        seq = seq.slice(0, idx);
                                        SFX.play('unselect');
                                    } else if (seq.length === 0) {
                                        seq = [id];
                                        SFX.play('chip', 0);
                                        tapAtomFx(g);
                                    } else {
                                        const last = seq[seq.length - 1];
                                        const bonded = mol.bonds.some(b => (b[0] === last && b[1] === id) || (b[1] === last && b[0] === id));
                                        if (bonded) {
                                            seq.push(id);
                                            SFX.play('chip', seq.length);
                                            tapAtomFx(g);
                                        } else {
                                            SFX.play('unselect');
                                            return;
                                        }
                                    }
                                    state.stepState.radTapped = seq;

                                    // تحديث الشارات البرتقالية (1', 2', 3'...)
                                    stage.querySelectorAll('[data-atom]').forEach(elG => {
                                        const aId = elG.dataset.atom;
                                        if (chainSet.has(aId)) return; // لا نلمس شارات السلسلة الرئيسية الخضراء

                                        const existingBadge = elG.querySelector('.rad-badge');
                                        if (existingBadge) existingBadge.remove();

                                        const orderNum = seq.indexOf(aId) + 1;
                                        if (orderNum > 0) {
                                            const at = mol.atoms.find(x => x.id === aId);
                                            const badgeG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                                            badgeG.setAttribute('class', 'rad-badge');
                                            badgeG.innerHTML = `<circle cx="${at.x}" cy="${at.y - 22}" r="13"/>
                                <text x="${at.x}" y="${at.y - 17}" text-anchor="middle">${orderNum}'</text>`;
                                            elG.appendChild(badgeG);
                                        }
                                    });

                                    const cnt = document.getElementById('rad-count');
                                    if (cnt) cnt.textContent = seq.length;
                                    updateVerifyState();
                                });
                            });
                        }
                    });
                });
            }

            /* ==========================================================
               ÉTAPE : name — clic sur les morceaux (chips)
               ========================================================== */
            if (step === 'name') {
                const chipsBox = document.getElementById('chips');
                const slot = document.getElementById('name-slot');

                const refreshSlot = () => {
                    const arr = (state.stepState.namePieces || []);
                    const usedSet = new Set(arr);

                    chipsBox.querySelectorAll('.chip').forEach(c => {
                        c.classList.toggle('used', usedSet.has(c.dataset.tok));
                    });

                    slot.innerHTML = '';
                    arr.forEach(tok => {
                        const piece = el('<span class="piece">' + escapeHtml(tok) + '</span>');
                        piece.addEventListener('click', () => {
                            const cur = (state.stepState.namePieces || []).slice();
                            const i = cur.indexOf(tok);
                            if (i >= 0) cur.splice(i, 1);
                            SFX.play('unselect');
                            state.stepState.namePieces = cur;
                            refreshSlot();
                            updateVerifyState();
                        });
                        slot.appendChild(piece);
                    });

                    slot.classList.toggle('empty', arr.length === 0);
                };

                chipsBox.querySelectorAll('.chip').forEach(c => {
                    c.addEventListener('click', () => {
                        const tok = c.dataset.tok;
                        const arr = (state.stepState.namePieces || []).slice();
                        if (arr.includes(tok)) return;
                        arr.push(tok);
                        SFX.play('chip', arr.length - 1);
                        vibrate(8);
                        state.stepState.namePieces = arr;
                        refreshSlot();
                        updateVerifyState();
                    });
                });

                refreshSlot();
            }
        }

        function updateVerifyState() {
            const btn = document.getElementById('btn-verify');
            if (!btn) return;
            const step = state.steps[state.stepIdx];
            const q = state.stepState;
            const mol = currentMol();
            let ready = false;
            if (step === 'chain') {
                const carbonCount = mol.atoms.filter(a => a.el === 'C').length;
                ready = mol.ringOrder
                    ? (q.tapped || []).length === mol.ringOrder.length
                    : (q.tapped || []).length >= Math.min(2, carbonCount);
            }
            else if (step === 'subs') ready = (q.subs || []).length >= 1;
            else if (step === 'name') ready = (q.namePieces || []).length >= 1;
            else if (step === 'rad_num') ready = (q.radTapped || []).length >= 1;
            if (ready && btn.disabled) { SFX.play('ready'); }
            btn.disabled = !ready;
        }

        /* ============================================================
           VÉRIFICATION
           ============================================================ */
        function verifyStep() {
            const step = state.steps[state.stepIdx];
            const mol = currentMol();
            const q = state.stepState;

            let ok = false, title = '', text = '', hint = '', diag = '', compare = null;

            if (step === 'chain') {
                const tapped = q.tapped || [];

                if (mol.ringOrder) {
                    const isComplete = sameSet(tapped, mol.ringOrder);
                    const isCycle = isComplete && isValidCycle(mol, tapped);

                    if (!isComplete) {
                        diag = 'Sélection de chaîne';
                        title = 'Cycle incomplet';
                        text = 'Tu dois sélectionner <b>tous</b> les atomes du cycle (' + mol.ringOrder.length + ').';
                        hint = 'Touche tous les carbones du cycle, un par un, sans en oublier.';
                    } else if (!isCycle) {
                        diag = 'Sélection de chaîne';
                        title = 'Ce n\'est pas un cycle valide';
                        text = 'Les atomes doivent être reliés les uns aux autres en boucle, dans l\'ordre.';
                    } else {
                        const userN = numberingOf(mol, tapped);
                        const best = bestRingNumbering(mol);
                        const r = cmpNum(userN, best.nm);
                        if (r.c === 0) {
                            ok = true;
                            title = 'Bien joué !';
                            text = 'Cycle numéroté correctement.';
                            if (best.nm.subLocs.length) text += ' Positions des substituants : <b>' + best.nm.subLocs.join(', ') + '</b>.';
                            state.chainSequence = tapped;
                        } else {
                            diag = 'Direction';
                            if (r.reason === 'alpha') {
                                title = 'Égalité des indices… départage alphabétique';
                                text = 'Les deux sens donnent les mêmes indices (<b>' + userN.subLocs.join(',') + '</b>). Le substituant cité en premier par ordre alphabétique reçoit le plus petit indice.';
                                diag = 'Ordre alphabétique';
                                hint = 'bromo &lt; chloro &lt; éthyl &lt; fluoro &lt; iodo &lt; méthyl.';
                            } else {
                                title = 'Mauvais sens de numérotation';
                                const userSum = userN.subLocs.reduce((s, v) => s + v, 0);
                                const bestSum = best.nm.subLocs.reduce((s, v) => s + v, 0);
                                text = `La numérotation doit donner les plus petits indices `
                                    + `(ex: <b>${best.nm.subLocs.join(',')}</b> bat <b>${userN.subLocs.join(',')}</b> `
                                    + `car leur somme est plus faible : ${bestSum} &lt; ${userSum}).`;
                                hint = 'Commence par l\'extrémité donnant les plus petits indices ('
                                    + userN.subLocs.join(',') + ' vs ' + best.nm.subLocs.join(',') + ').';
                            }

                        }
                    }
                } else {
                    const vc = getValidChains(mol);
                    const isValidChain = vc.chains.some(c => sameSet(tapped, c));
                    if (!isValidChain) {
                        diag = 'Sélection de chaîne';
                        let multInChain = 0;
                        for (let i = 0; i < tapped.length - 1; i++) {
                            const b = mol.bonds.find(bd => (bd[0] === tapped[i] && bd[1] === tapped[i + 1]) || (bd[1] === tapped[i] && bd[0] === tapped[i + 1]));
                            if (b && (b[2] || 1) > 1) multInChain++;
                        }
                        if (multInChain < vc.maxMult) {
                            title = 'Il manque une insaturation';
                            text = 'La chaîne principale doit contenir le <b>maximum de liaisons multiples</b> (C=C, C≡C), même si une autre chaîne est plus longue.';
                            hint = 'Cette molécule contient ' + vc.maxMult + ' liaison(s) multiple(s) à inclure dans la chaîne.';
                        } else {
                            title = 'Ce n\'est pas la chaîne principale';
                            text = 'La chaîne principale est la <b>plus longue chaîne carbonée</b> continue (carbones uniquement).';
                            hint = 'La plus longue chaîne contient ' + vc.maxLen + ' carbones. Vérifie que tous tes atomes sont reliés par des liaisons.';
                        }
                    } else {
                        const reversed = tapped.slice().reverse();
                        const A = numberingOf(mol, tapped);
                        const B = numberingOf(mol, reversed);
                        const r = cmpNum(A, B);
                        if (r.c <= 0) {
                            ok = true;
                            title = 'Bien joué !';
                            text = 'Chaîne principale : <b>' + tapped.length + '</b> carbones.';
                            const bits = [];
                            if (A.unsat.length) bits.push('insaturations en <b>' + A.unsat.join(', ') + '</b>');
                            if (A.subs.length) bits.push('substituants en <b>' + A.subLocs.join(', ') + '</b>');
                            if (bits.length) text += ' Numérotation : ' + bits.join(' · ') + '.';
                            else text += ' Aucune ramification.';
                            state.chainSequence = tapped;
                        } else {
                            diag = 'Direction';
                            if (r.reason === 'unsat') {
                                if (cmpLocants(A.subLocs, B.subLocs) < 0 && A.subs.length) {
                                    title = 'Les insaturations d\'abord !';
                                    text = 'Les liaisons multiples ont priorité sur les ramifications pour la numérotation.';
                                    hint = 'Insaturations : ' + A.unsat.join(',') + ' (ton sens) vs ' + B.unsat.join(',') + ' (autre sens). Les substituants (' + A.subLocs.join(',') + ' vs ' + B.subLocs.join(',') + ') ne comptent que si les insaturations sont à égalité.';
                                } else {
                                    title = 'Presque… mais mauvais sens';
                                    text = 'Commence par l\'extrémité qui donne les <b>plus petits indices</b> à l\'ensemble des insaturations.';
                                    hint = 'Commence par l\'extrémité donnant les plus petits indices (' + B.unsat.join(',') + ' vs ' + A.unsat.join(',') + ').';
                                }
                            } else if (r.reason === 'ene') {
                                title = 'Égalité stricte : qui est prioritaire ?';
                                text = 'En cas d\'égalité stricte, la double liaison (-ène) a priorité sur la triple liaison (-yne).';
                                hint = 'Les deux sens donnent le même ensemble (' + A.unsat.join(',') + '). Ton sens place la double liaison en ' + (A.enes.join(',') || '?') + ', l\'autre en ' + (B.enes.join(',') || '?') + '.';
                            } else if (r.reason === 'subs') {
                                title = 'Presque… mais mauvais sens';
                                text = 'Commence par l\'autre extrémité pour obtenir les <b>plus petits indices</b>.';
                                hint = 'Commence par l\'extrémité donnant les plus petits indices (' + B.subLocs.join(',') + ' vs ' + A.subLocs.join(',') + ').';
                            } else {
                                diag = 'Ordre alphabétique';
                                title = 'Égalité des indices : l\'alphabet décide';
                                text = 'Les deux sens donnent les mêmes indices (<b>' + A.subLocs.join(',') + '</b>). Le substituant cité en premier par ordre alphabétique reçoit le plus petit indice.';
                                hint = 'bromo &lt; chloro &lt; éthyl &lt; fluoro &lt; iodo &lt; méthyl.';
                            }

                        }

                    }
                }

            }
            else if (step === 'rad_num') {
                const tapped = q.radTapped || [];
                const radData = getValidRadicalChain(mol, state.chainSequence);

                if (!radData || tapped.length === 0) {
                    diag = 'Radical';
                    title = 'Sélection vide';
                    text = 'Tu dois numéroter la chaîne du radical.';
                }
                // ⚠️ الفخ الأكبر: هل بدأ من C1' الحقيقي؟
                else if (tapped[0] !== radData.rootId) {
                    diag = "Règle du C1'";
                    title = "Erreur sur le C1'";
                    text = "<b>Le carbone 1' doit obligatoirement être le point d'attache</b> à la chaîne principale. Tu ne peux pas commencer par l'autre extrémité !";
                    hint = "Repère l'atome du radical directement relié au carbone vert de la chaîne.";
                }
                // هل اختار أطول مسار داخل الجذر؟
                else if (!radData.validSequences.some(seq => seq.every((id, idx) => id === tapped[idx]))) {
                    diag = 'Longueur du radical';
                    title = 'Chaîne du radical incorrecte';
                    text = "Tu dois suivre la plus longue chaîne carbonée à l'intérieur du radical à partir de C1'.";
                }
                else {
                    ok = true;
                    title = 'Bravo !';
                    text = `Radical numéroté de <b>1' à ${tapped.length}'</b> dans le sens IUPAC parfait.`;
                    state.confirmedRadChain = tapped;
                }
            }

            else if (step === 'subs') {
                const selected = q.subs || [];
                const chainSet = new Set(state.chainSequence);
                const expected = mol.atoms.filter(a => !chainSet.has(a.id)).map(a => a.id);

                if (sameSet(selected, expected)) {
                    ok = true;
                    title = 'Parfait !';
                    const subsFound = getSubstituents(mol, state.chainSequence);
                    text = 'Substituants identifiés : <b>' + subsFound.map(s => s.name + ' (C' + s.loc + ')').join(', ') + '</b>.';
                } else {
                    diag = 'Substituants';
                    title = 'Pas tout à fait';
                    const missing = expected.filter(b => !selected.includes(b));
                    const extra = selected.filter(s => !expected.includes(s));
                    text = 'Vérifie quels atomes ne font pas partie de la chaîne principale (halogènes compris).';
                    if (missing.length) hint = 'Il en manque ' + missing.length + '. ';
                    if (extra.length) hint += 'Tu en as sélectionné ' + extra.length + ' en trop.';
                }
            }

            else if (step === 'name') {
                const pieces = q.namePieces || [];
                const proposed = pieces.join('').toLowerCase().replace(/\s/g, '');
                const correct = mol.name.toLowerCase().replace(/\s/g, '');
                if (proposed === correct) {
                    ok = true;
                    title = 'Excellent !';
                    text = 'Le nom est bien <b>' + mol.name + '</b>.';
                } else {
                    title = 'Presque…';
                    text = 'Compare les deux formulations :';
                    const studentStr = pieces.join('');
                    const sortedP = pieces.slice().sort().join('|');
                    const sortedC = mol.tokens.slice().sort().join('|');
                    if (sortedP === sortedC) {
                        diag = 'Ordre alphabétique';
                        hint = 'Tous les bons morceaux, mais dans le mauvais ordre. Substituants par ordre alphabétique (bromo, chloro, éthyl, fluoro, iodo, méthyl), puis la chaîne, puis les insaturations.';
                    } else {
                        diag = 'Assemblage du nom';

                    }
                    /* ✨ Nouvelle comparaison structurée */
                    compare = {
                        student: studentStr || '(vide)',
                        correct: mol.name
                    };
                }
            }

            if (!ok) {
                state.mistakes = (state.mistakes || 0) + 1;
                state.hearts = Math.max(0, state.hearts - 1);
                state._heartLost = true;
                saveAll();
                if (state.hearts <= 0) {
                    showHeartsOut();
                    return;
                }
            }

            showSheet({ ok, title, text, hint, diag, onContinue: ok ? nextStep : null, compare });
        }

        /* ============================================================
           FEEDBACK
           ============================================================ */
        function showSheet({ ok, title, text, hint, diag, onContinue, compare }) {
            const world = WORLDS[state.worldIdx];
            const tipHTML = world && world.tip
                ? '<div class="fixed-tips"><div class="ft-title">📌 Règles à retenir</div><div class="ft-body">' + world.tip + '</div></div>'
                : '';

            const cmpHTML = compare
                ? '<div class="cmp-wrap">'
                + '<div class="cmp-box cmp-wrong">'
                + '<div class="cmp-label">Ta réponse</div>'
                + '<div class="cmp-text">' + escapeHtml(compare.student || '(vide)') + '</div>'
                + '</div>'
                + '<div class="cmp-vs">→</div>'
                + '<div class="cmp-box cmp-good">'
                + '<div class="cmp-label">Bonne réponse</div>'
                + '<div class="cmp-text">' + escapeHtml(compare.correct) + '</div>'
                + '</div>'
                + '</div>'
                : '';

            const wrap = el(
                '<div class="sheet-wrap">'
                + '<div class="sheet ' + (ok ? 'good' : 'bad') + '">'
                + '<div class="sheet-icon">' + (ok ? '✓' : '✕') + '</div>'
                + (!ok && diag ? '<div style="text-align:center;margin-bottom:10px"><span class="diag">Diagnostic : ' + diag + '</span></div>' : '')
                + '<div class="sheet-title">' + title + '</div>'
                + '<div class="sheet-text">' + text + '</div>'
                + cmpHTML
                + (hint ? '<div class="sheet-hint">💡 ' + hint + '</div>' : '')
                + (!ok ? tipHTML : '')
                + '<div class="sheet-actions">'
                + '<button class="btn-3d" id="sheet-btn">' + (onContinue ? 'Continuer' : 'Réessayer') + '</button>'
                + '</div>'
                + '</div>'
                + '</div>'
            );
            document.body.appendChild(wrap);

            /* effets de réussite / d'échec */
            if (ok) {
                SFX.play('correct'); flashScreen('good'); vibrate([15, 30, 15]);
                confetti({ count: 46, y: .78, power: .85 });
                floatMsg('+1 ✨');
                setTimeout(() => SFX.play('sparkle'), 260);
                const fill = document.querySelector('.progress-fill');
                if (fill) fill.classList.add('boost');
            } else {
                SFX.play('wrong'); setTimeout(() => SFX.play('heartLoss'), 220);
                flashScreen('bad'); shakeApp(); vibrate([60, 40, 60]);
            }

            wrap.querySelector('#sheet-btn').addEventListener('click', () => {
                wrap.remove();
                if (onContinue) onContinue();
                else {
                    state.stepState = {};
                    renderPlay();
                }
            });
        }

        /* ============================================================
           RAPPEL
           ============================================================ */
        const PREFIXES = [

            [5, 'Pent-'], [6, 'Hex-'], [7, 'Hept-'], [8, 'Oct-'],

        ];
