<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#58CC02">
<title>NomenDuo — Nomenclature</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
:root{
  --green:#58CC02; --green-d:#46A302; --green-l:#D7FFB8;
  --blue:#1CB0F6; --blue-d:#1899D6;
  --red:#FF4B4B; --red-d:#E53935; --red-l:#FFDFE0;
  --gold:#FFC800; --gold-d:#E5A400;
  --ink:#3C3C3C; --ink2:#4B4B4B; --muted:#AFAFAF;
  --line:#E5E5E5; --bg:#FFFFFF; --bg-soft:#F7F7F7;
  --purple:#CE82FF; --purple-d:#A568CC;
}
html,body{height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  background:var(--bg); color:var(--ink);
  -webkit-font-smoothing:antialiased;
  font-size:15px; line-height:1.4;
  font-weight:600;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-weight:inherit}

#app{
  max-width:500px; height:100dvh; margin:0 auto;
  display:flex; flex-direction:column;
  background:var(--bg); position:relative; overflow:hidden;
}

/* ====== TOP HUD ====== */
.topbar{
  flex:none; padding:14px 16px 10px;
  display:flex; align-items:center; gap:12px;
  background:var(--bg); z-index:5;
}
.topbar .close-x{
  width:32px; height:32px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:22px; color:var(--muted); font-weight:900;
  transition:background .15s;
}
.topbar .close-x:active{background:var(--bg-soft)}
.progress-track{
  flex:1; height:14px; background:var(--line); border-radius:99px;
  overflow:hidden; position:relative;
}
.progress-fill{
  height:100%; background:var(--green); border-radius:99px;
  transition:width .4s cubic-bezier(.4,0,.2,1);
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.08);
}
.hearts{
  display:flex; align-items:center; gap:4px;
  color:var(--red); font-weight:900; font-size:17px;
}
.hearts .heart{font-size:18px}
.rnd-tag{
  font-size:11px; font-weight:900; color:#7A5A00; background:#FFF1B8;
  padding:3px 8px; border-radius:99px; letter-spacing:.04em;
}

/* ====== HOME ====== */
.home{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 0 60px}
.home-hero{
  padding:24px 20px 12px;
  background:linear-gradient(180deg,#E8FFD0 0%,transparent 100%);
}
.home-hero h1{
  font-size:30px; font-weight:900; letter-spacing:-.7px; color:var(--ink);
  line-height:1.1;
}
.home-hero h1 .accent{color:var(--green)}
.home-hero p{
  color:var(--muted); font-weight:700; font-size:13px;
  margin-top:8px; text-transform:uppercase; letter-spacing:.08em;
}
.home-stats{display:flex; gap:10px; padding:0 20px; margin-top:6px}
.stat-chip{
  background:var(--bg-soft); border-radius:14px;
  padding:10px 14px; display:flex; align-items:center; gap:8px;
  font-weight:900; font-size:14px;
}
.stat-chip .ico{font-size:18px}
.stat-chip b{color:var(--ink); font-weight:900}
.stat-chip span{color:var(--muted); font-weight:800; font-size:11px; text-transform:uppercase; letter-spacing:.05em}

.worlds{padding:22px 20px 0; display:flex; flex-direction:column; gap:26px}
.world-title{display:flex; align-items:center; gap:10px; margin-bottom:14px}
.world-title .badge{
  padding:4px 10px; border-radius:8px; font-size:10.5px;
  font-weight:900; letter-spacing:.1em; text-transform:uppercase;
  color:#fff; min-width:34px; text-align:center;
}
.world-title h2{font-size:18px; font-weight:900; letter-spacing:-.3px}
.world-title .count{margin-left:auto; font-size:12px; color:var(--muted); font-weight:800}
.levels{display:flex; flex-direction:column; gap:12px}
.level-row{
  display:flex; align-items:center; gap:14px;
  background:var(--bg-soft); border-radius:18px; padding:14px 16px;
  border:2px solid transparent; transition:transform .12s; text-align:left; width:100%;
}
.level-row:active{transform:scale(.98)}
.level-row.done{background:var(--green-l); border-color:var(--green)}
.level-badge{
  width:48px; height:48px; border-radius:14px; flex:none;
  display:flex; align-items:center; justify-content:center;
  background:#fff; border:2px solid var(--line);
  font-size:20px; font-weight:900; color:var(--ink);
  box-shadow:0 3px 0 var(--line);
}
.level-row.done .level-badge{
  background:var(--green); border-color:var(--green-d);
  color:#fff; box-shadow:0 3px 0 var(--green-d);
}
.level-meta{flex:1; min-width:0}
.level-meta h3{font-size:15px; font-weight:900; letter-spacing:-.2px; color:var(--ink)}
.level-meta p{font-size:12px; color:var(--muted); font-weight:700; margin-top:3px}
.level-stars{color:var(--gold); font-size:16px; letter-spacing:1px}
.level-arrow{font-size:18px; color:var(--muted); font-weight:900}

/* Carte jeu aléatoire */
/* Carte jeu aléatoire — adaptée à la largeur de l'app */
.random-card {
  padding: 18px 20px;
  border-radius: 22px;
  background: #FFFFFF;
  border: 2px solid #89E219;
  box-shadow: 0 5px 0 #58CC02;
  width: 100%;              /* ✅ يملأ عرض الحاوية */
  margin: 0 auto;           /* ✅ تمركز */
  /* ✅ لا يوجد max-width — يتكيف مع الحاوية */
}

.random-card .kicker {
  font-size: 10.5px;
  font-weight: 900;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: #58CC02;
}

.random-card h2 {
  font-size: 21px;
  font-weight: 900;
  letter-spacing: -.4px;
  margin-top: 4px;
  color: #2B5A00;
}

.random-card p {
  font-size: 13px;
  font-weight: 700;
  margin: 6px 0 14px;
  color: #4A7A00;
  line-height: 1.45;
}

.random-card .btn-3d {
  padding: 14px 18px;       /* ✅ تقليل الحشو ليتناسب */
  font-size: 14px;
}

  /* ===== الزر ===== */
  .btn-3d {
    display: inline-block;
    padding: 18px;
    border: none;
    border-radius: 14px;
    font-size: 14px;
    font-weight: 900;
    letter-spacing: 0.5px;
    cursor: pointer;
    border-bottom: 4px solid rgba(0,0,0,.25);
    transition: transform .08s ease, border-bottom-width .08s ease;
    width: 100%;
    text-align: center;
  }
  .btn-3d:active {
    transform: translateY(2px);
    border-bottom-width: 2px;
  }
  .btn-gold {
    background: #FFC800;
    border-bottom-color: #E5A800;
    color: #5C4300;
  }
/* Section banner - Neumorphism Mint */
.section-banner {
  padding: 20px;
  border-radius: 0px;
  background: #e8f8f0;
  color: #1a3a2e;
  
}

.section-banner .kicker {
  font-size: 10px;
  font-weight: 900;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: #10B981;
}

.section-banner h2 {
  font-size: 21px;
  font-weight: 900;
  margin-top: 6px;
  line-height: 1.15;
  color: #14261a;
}

.section-banner p {
  font-size: 13px;
  font-weight: 600;
  margin-top: 8px;
  color: #4a6b5a;
  line-height: 1.5;
}

.section-banner .roadmap {
  display: flex;
  gap: 8px;
  margin-top: 14px;
  flex-wrap: wrap;
}

.section-banner .roadmap span {
  background: #e8f8f0;
  border-radius: 12px;
  padding: 5px 12px;
  font-size: 11px;
  font-weight: 800;
  color: #059669;
  box-shadow: 3px 3px 6px #c8d8d0, -3px -3px 6px #ffffff;
}

/* ====== PLAY ====== */
.play{flex:1; display:flex; flex-direction:column; height:100dvh; overflow:hidden; position:relative}
.play-body{
  flex:1; display:flex; flex-direction:column;
  overflow-y:auto; -webkit-overflow-scrolling:touch;
  padding:0 0 8px;
}
.q-block{padding:4px 20px 10px}
.q-block h2{
  font-size:22px; font-weight:900; letter-spacing:-.5px; color:var(--ink);
  line-height:1.25;
}
.q-block p{
  font-size:14px; color:var(--muted); font-weight:700; margin-top:6px;
  line-height:1.5;
}
.q-hint{
  display:inline-block; margin-top:10px;
  padding:5px 12px; background:#E8F6FF; color:var(--blue-d);
  border-radius:8px; font-size:12px; font-weight:900;
  letter-spacing:.03em;
}
.stage{
  flex:1; min-height:200px;
  display:flex; align-items:center; justify-content:center;
  padding:6px 12px; position:relative;
}
.stage svg{width:100%; height:100%; max-height:100%; overflow:visible}
.stage .atom-hit{cursor:pointer}
.stage .atom-shape{transition:all .18s cubic-bezier(.4,0,.2,1)}
.stage .atom-hit:active .atom-shape{transform:scale(1.1); transform-box:fill-box; transform-origin:center}

.answer{padding:8px 20px 12px}
.name-slot{
  min-height:56px; border:2px dashed var(--line); border-radius:14px;
  padding:10px 14px; margin-bottom:12px;
  display:flex; flex-wrap:wrap; gap:6px; align-items:center;
  font-family:Georgia,serif; font-size:19px; font-weight:900; color:var(--ink);
}
.name-slot.empty::before{
  content:'Touche les morceaux pour assembler le nom';
  font-family:inherit; font-size:12.5px; font-weight:700;
  color:var(--muted); font-style:italic;
}
.name-slot .piece{
  background:var(--green); color:#fff; padding:5px 11px;
  border-radius:9px; font-size:16px; font-weight:900;
  font-family:Georgia,serif;
  animation:popIn .22s cubic-bezier(.34,1.4,.5,1);
  box-shadow:0 3px 0 var(--green-d); cursor:pointer;
}
@keyframes popIn{from{transform:scale(.6);opacity:0}}
.chips{display:flex; flex-wrap:wrap; gap:8px; justify-content:center}
.chip{
  padding:11px 16px; background:var(--bg); border:2px solid var(--line);
  border-radius:12px; font-family:Georgia,serif; font-size:16px;
  font-weight:900; color:var(--ink); cursor:pointer;
  box-shadow:0 3px 0 var(--line); transition:transform .1s;
}
.chip:active{transform:translateY(3px); box-shadow:none}
.chip.used{opacity:.25; pointer-events:none}

.play-footer{
  flex:none; padding:14px 20px calc(18px + env(safe-area-inset-bottom));
  background:var(--bg); border-top:2px solid var(--line);
}
.btn-3d{
  display:block; width:100%; padding:16px 20px;
  background:var(--green); border-bottom:5px solid var(--green-d);
  border-radius:16px; color:#fff; font-weight:900;
  text-transform:uppercase; letter-spacing:.08em; font-size:15px;
  transition:transform .08s, border-bottom-width .08s;
  text-align:center;
}
.btn-3d:active{transform:translateY(5px); border-bottom-width:0}
.btn-3d:disabled{
  background:var(--line); border-bottom-color:#D4D4D4; color:var(--muted);
  cursor:not-allowed;
}
.btn-secondary{background:#fff; color:var(--ink); border-bottom-color:rgba(0,0,0,.15)}
.btn-blue{background:var(--blue); border-bottom-color:var(--blue-d); color:#fff}
.btn-red{background:var(--red); border-bottom-color:var(--red-d); color:#fff}

/* ====== FEEDBACK SHEET ====== */
.sheet-wrap{
  position:fixed; inset:0; z-index:100;
  background:rgba(60,60,60,.5);
  display:flex; align-items:flex-end; justify-content:center;
  animation:fadeIn .22s;
}
@keyframes fadeIn{from{opacity:0}}
.sheet{
  width:100%; max-width:500px;
  padding:28px 22px calc(24px + env(safe-area-inset-bottom));
  border-radius:26px 26px 0 0;
  animation:slideUp .35s cubic-bezier(.4,0,.2,1);
  max-height:90vh; overflow-y:auto;
}
.sheet.good{background:#E8FFD0; color:var(--green-d)}
.sheet.bad{background:#FFEBEC; color:var(--red-d)}
.sheet.neutral{background:#fff; color:var(--ink)}
@keyframes slideUp{from{transform:translateY(60px); opacity:0}}
.sheet-icon{
  width:72px; height:72px; border-radius:50%;
  background:#fff; display:flex; align-items:center; justify-content:center;
  font-size:36px; margin:0 auto 14px;
}
.sheet.good .sheet-icon{color:var(--green)}
.sheet.bad .sheet-icon{color:var(--red)}
.sheet-title{text-align:center; font-size:22px; font-weight:900; letter-spacing:-.4px; margin-bottom:8px}
.sheet-text{text-align:center; font-size:15px; font-weight:700; line-height:1.5; margin-bottom:6px}
.sheet-text b{font-weight:900; color:inherit}
.sheet-hint{
  background:rgba(255,255,255,.7); border-radius:12px;
  padding:12px 14px; margin-top:14px;
  font-size:13px; font-weight:700; line-height:1.5; text-align:left;
}
.diag{
  display:inline-block; padding:4px 12px; border-radius:99px;
  background:#fff; color:var(--red-d); font-size:11px; font-weight:900;
  letter-spacing:.08em; text-transform:uppercase;
}
.sheet-actions{margin-top:20px}
.sheet-actions .btn-3d{background:#fff; color:var(--ink); border-bottom-color:rgba(0,0,0,.15)}
.sheet.good .sheet-actions .btn-3d{background:var(--green); border-bottom-color:var(--green-d); color:#fff}
.sheet.bad .sheet-actions .btn-3d{background:var(--red); border-bottom-color:var(--red-d); color:#fff}
.sheet.good .sheet-actions .btn-secondary{background:#fff; color:var(--ink); border-bottom-color:rgba(0,0,0,.15)}
.sheet.good .sheet-actions .btn-gold{background:var(--gold); border-bottom-color:var(--gold-d); color:#5C4300}

.prefix-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:16px}
.prefix-item{
  display:flex; align-items:center; gap:10px;
  padding:10px 14px; background:var(--bg-soft);
  border-radius:12px; font-weight:800; font-size:15px;
}
.prefix-item .num{color:var(--green); font-weight:900; font-size:17px; min-width:26px; text-align:center}
.prefix-item .txt{color:var(--ink)}
.tipbox{
  background:#FFF8DC; border:2px solid var(--gold); color:#7A5A00;
  border-radius:14px; padding:12px 14px; margin-top:14px;
  font-size:13px; font-weight:700; line-height:1.55; text-align:left;
}
.tipbox b{color:#5C4300; font-weight:900}

.toast{
  position:fixed; left:50%; bottom:110px; transform:translateX(-50%);
  max-width:88%; z-index:200;
  background:#3C3C3C; color:#fff; padding:12px 16px; border-radius:14px;
  font-size:13px; font-weight:800; line-height:1.4; text-align:center;
  box-shadow:0 6px 18px rgba(0,0,0,.25);
  animation:popIn .25s cubic-bezier(.34,1.4,.5,1);
}
* {
  -webkit-user-select: none;   /* Safari */
  -moz-user-select: none;      /* Firefox */
  -ms-user-select: none;       /* IE/Edge */
  user-select: none;           /* Standard */
  -webkit-touch-callout: none; /* iOS - يمنع قائمة النسخ عند الضغط الطويل */
  -webkit-tap-highlight-color: transparent;
}
.hidden{display:none !important}
/* زر الانسدال */
.world-toggle {
  margin-left: 8px;
  width: 30px;
  height: 30px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  background: var(--bg-soft);
  transition: transform .25s ease, background .15s ease;
  flex: none;
}
.world-toggle:active {
  background: var(--line);
}
.world-toggle svg {
  transition: transform .3s cubic-bezier(.4,0,.2,1);
}
/* عند الانسدال: السهم يدور 180° */
.world-section.collapsed .world-toggle svg {
  transform: rotate(-90deg);
}

/* انسدال الـ levels */
.levels {
  display: flex;
  flex-direction: column;
  gap: 12px;
  overflow: hidden;
  max-height: 2000px;              /* قيمة كبيرة كافية لاستيعاب المحتوى */
  opacity: 1;
  transition: max-height .35s cubic-bezier(.4,0,.2,1),
              opacity .25s ease,
              margin-top .3s ease;
  margin-top: 0;
}
.world-section.collapsed .levels {
  max-height: 0;
  opacity: 0;
  margin-top: 0;
  pointer-events: none;
}

/* (اختياري) خلفية خفيفة للقسم عند الانسدال */
.world-section.collapsed .world-title {
  opacity: .65;
  transition: opacity .2s ease;
}
</style>
</head>

const $app = document.getElementById('app');
function el(html){
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstChild;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function shuffle(a){
  const b = a.slice();
  for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}
  return b;
}
function sameSet(a,b){
  if(a.length!==b.length) return false;
  const sb = new Set(b);
  return a.every(x=>sb.has(x));
}
function cmpLocants(a,b){
  const n = Math.max(a.length,b.length);
  for(let i=0;i<n;i++){
    const x = a[i] ?? Infinity, y = b[i] ?? Infinity;
    if(x!==y) return x-y;
  }
  return 0;
}
function toast(msg){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t = el('<div class="toast">'+msg+'</div>');
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2800);
}
function currentMol(){
  return MOLECULES[WORLDS[state.worldIdx].levels[state.levelIdx].mol];
}
function hasHetero(mol){ return mol.atoms.some(a=>a.el!=='C'); }
function hasMultiple(mol){ return mol.bonds.some(b=>(b[2]||1)>1); }

function pickRandomLevel(excludeW, excludeL){
  const all = [];
  WORLDS.forEach((w,wi)=> w.levels.forEach((_,li)=>{
    if(!(wi===excludeW && li===excludeL)) all.push([wi,li]);
  }));
  return all[Math.floor(Math.random()*all.length)];
}
function startRandom(fromW, fromL){
  const [wi,li] = pickRandomLevel(fromW, fromL);
  openLevel(wi, li, true);
}

/* ============================================================
   DISTRACTEURS
   ============================================================ */
const CHAIN_PREFIXES = ['méth','éth','prop','but','pent','hex','hept','oct','non','déc','undéc','dodéc'];
const CHAIN_SUFFIXES = ['ane','ène','yne'];

function generateLocantVariants(token){
  const variants = new Set();
  let m = token.match(/^(\d+(?:,\d+)*)-(.*)$/);
  if(m){
    const nums = m[1].split(',').map(Number);
    const suffix = m[2];
    for(let i=0;i<nums.length;i++){
      for(const d of [-1,1]){
        if(nums[i]+d >= 1){
          const nn = nums.slice(); nn[i] = nums[i]+d;
          nn.sort((a,b)=>a-b);
          variants.add(nn.join(',')+'-'+suffix);
        }
      }
    }
  }
  m = token.match(/^-(\d+(?:,\d+)*)-(.*)$/);
  if(m){
    const nums = m[1].split(',').map(Number);
    const suffix = m[2];
    for(let i=0;i<nums.length;i++){
      for(const d of [-1,1]){
        if(nums[i]+d >= 1){
          const nn = nums.slice(); nn[i] = nums[i]+d;
          nn.sort((a,b)=>a-b);
          variants.add('-'+nn.join(',')+'-'+suffix);
        }
      }
    }
  }
  return [...variants];
}

function generateChainVariants(token){
  const variants = new Set();
  const lower = token.toLowerCase();
  for(const ch of CHAIN_PREFIXES){
    if(lower.startsWith(ch)){
      const rest = token.slice(ch.length);
      if(rest === '' || CHAIN_SUFFIXES.includes(rest)){
        for(const ch2 of CHAIN_PREFIXES){
          if(ch2 === ch) continue;
          variants.add(ch2 + rest);
        }
      }
      break;
    }
  }
  for(const suf of CHAIN_SUFFIXES){
    if(lower.endsWith(suf)){
      const base = token.slice(0, -suf.length);
      for(const suf2 of CHAIN_SUFFIXES){
        if(suf2 === suf) continue;
        variants.add(base + suf2);
      }
      break;
    }
  }
  return [...variants];
}

const GENERIC_NAME_POOL = [
  'méthane','éthane','propane','butane','pentane','hexane','heptane','octane','nonane','décane',
  'éthène','propène','but-1-ène','but-2-ène','pent-1-ène','pent-2-ène',
  'éthyne','propyne','but-1-yne','but-2-yne',
  'cyclopropane','cyclobutane','cyclopentane','cyclohexane','cycloheptane',
  'méthylpropane','méthylbutane','méthylpentane','méthylhexane',
  'diméthylpropane','diméthylbutane','diméthylpentane',
  'méthylcyclopropane','méthylcyclobutane','méthylcyclopentane','méthylcyclohexane',
  'diméthylcyclopropane','diméthylcyclobutane','diméthylcyclopentane','diméthylcyclohexane',
  'éthylpropane','éthylbutane','éthylpentane',
  'buta-1,3-diène','penta-1,3-diène','penta-1,4-diène','hexa-1,3-diène',
];

function buildNamePool(mol, targetSize = 10){
  const correct = mol.tokens.slice();
  const out = new Set(correct);
  (mol.distractors || []).forEach(d => out.add(d));
  correct.forEach(tok => {
    generateLocantVariants(tok).forEach(v => out.add(v));
    generateChainVariants(tok).forEach(v => out.add(v));
  });
  const correctNorm = mol.name.toLowerCase().replace(/\s/g,'');
  for(const g of shuffle(GENERIC_NAME_POOL)){
    if(out.size >= targetSize) break;
    if(g.toLowerCase().replace(/\s/g,'') === correctNorm) continue;
    out.add(g);
  }
  let arr = [...out];
  const maxSize = Math.max(targetSize, correct.length + 7);
  if(arr.length > maxSize){
    const correctInArr = arr.filter(x => correct.includes(x));
    const others = shuffle(arr.filter(x => !correct.includes(x)));
    arr = [...correctInArr, ...others.slice(0, maxSize - correctInArr.length)];
  }
  return shuffle(arr);
}

/* ============================================================
   MOTEUR IUPAC
   ============================================================ */
const HALOGENS = {F:'fluoro',Cl:'chloro',Br:'bromo',I:'iodo'};

function adjacencyOf(mol){
  const adj = {};
  mol.atoms.forEach(a=>adj[a.id]=[]);
  mol.bonds.forEach(b=>{ adj[b[0]].push(b[1]); adj[b[1]].push(b[0]); });
  return adj;
}

/* Chaînes principales valides, calculées :
   chemins de carbones avec le MAX de liaisons multiples, puis le plus long. */
const _chainCache = {};
function getValidChains(mol){
  if(_chainCache[mol.id]) return _chainCache[mol.id];
  const adj = adjacencyOf(mol);
  const elOf = {}; mol.atoms.forEach(a=>elOf[a.id]=a.el);
  const orderOf = (a,b)=>{
    const bd = mol.bonds.find(x=>(x[0]===a&&x[1]===b)||(x[0]===b&&x[1]===a));
    return bd ? (bd[2]||1) : 1;
  };
  const paths = [];
  const dfs = (path, mult)=>{
    paths.push({path:path.slice(), mult});
    const last = path[path.length-1];
    (adj[last]||[]).forEach(n=>{
      if(elOf[n]!=='C' || path.includes(n)) return;
      path.push(n);
      dfs(path, mult + (orderOf(last,n)>1 ? 1 : 0));
      path.pop();
    });
  };
  mol.atoms.filter(a=>a.el==='C').forEach(a=>dfs([a.id],0));
  const maxMult = Math.max(...paths.map(p=>p.mult));
  const m1 = paths.filter(p=>p.mult===maxMult);
  const maxLen = Math.max(...m1.map(p=>p.path.length));
  const chains = m1.filter(p=>p.path.length===maxLen).map(p=>p.path);
  return (_chainCache[mol.id] = {chains, maxMult, maxLen});
}

function getSubstituents(mol, seq){
  const adj = adjacencyOf(mol);
  const chainSet = new Set(seq);
  const seen = new Set();
  const out = [];
  mol.atoms.forEach(a=>{
    if(chainSet.has(a.id) || seen.has(a.id)) return;
    const comp = [];
    const queue = [a.id];
    seen.add(a.id);
    let attach = null;
    while(queue.length){
      const x = queue.shift();
      comp.push(x);
      (adj[x]||[]).forEach(y=>{
        if(chainSet.has(y)){ if(attach===null) attach = y; }
        else if(!seen.has(y)){ seen.add(y); queue.push(y); }
      });
    }
    if(attach===null) return;
    let name = 'alkyl';
    if(comp.length===1){
      const atom = mol.atoms.find(z=>z.id===comp[0]);
      name = atom.el==='C' ? 'méthyl' : (HALOGENS[atom.el] || 'substituant');
    } else if(comp.length===2){
      name = 'éthyl';
    }
    out.push({name, loc: seq.indexOf(attach)+1, atoms: comp});
  });
  return out;
}

function numberingOf(mol, seq){
  const pos = {};
  seq.forEach((id,i)=> pos[id]=i+1);
  const enes = [], ynes = [];
  mol.bonds.forEach(bd=>{
    const o = bd[2]||1;
    if(o>1 && pos[bd[0]] && pos[bd[1]]){
      const l = Math.min(pos[bd[0]], pos[bd[1]]);
      (o===2 ? enes : ynes).push(l);
    }
  });
  const num = (a,b)=>a-b;
  enes.sort(num); ynes.sort(num);
  const unsat = [...enes, ...ynes].sort(num);
  const subs = getSubstituents(mol, seq);
  const subLocs = subs.map(s=>s.loc).sort(num);
  const alpha = subs.slice()
    .sort((x,y)=> x.name.localeCompare(y.name,'fr') || x.loc-y.loc)
    .map(s=>s.loc);
  return {unsat, enes, ynes, subs, subLocs, alpha};
}

function cmpNum(a, b){
  let c = cmpLocants(a.unsat, b.unsat);
  if(c) return {c, reason:'unsat'};
  c = cmpLocants(a.enes, b.enes);
  if(c) return {c, reason:'ene'};
  c = cmpLocants(a.subLocs, b.subLocs);
  if(c) return {c, reason:'subs'};
  c = cmpLocants(a.alpha, b.alpha);
  if(c) return {c, reason:'alpha'};
  return {c:0, reason:null};
}

function isValidCycle(mol, seq){
  const n = seq.length;
  if(n < 3) return false;
  for(let i=0;i<n;i++){
    const a = seq[i], b = seq[(i+1)%n];
    const bonded = mol.bonds.some(bd =>
      (bd[0]===a && bd[1]===b) || (bd[1]===a && bd[0]===b));
    if(!bonded) return false;
  }
  return true;
}

function bestRingNumbering(mol){
  const ring = mol.ringOrder;
  if(!ring) return null;
  const n = ring.length;
  let best = null;
  for(let start=0; start<n; start++){
    for(const dir of [1,-1]){
      const seq = [];
      for(let i=0;i<n;i++){
        const idx = ((start + i*dir) % n + n) % n;
        seq.push(ring[idx]);
      }
      const nm = numberingOf(mol, seq);
      if(!best || cmpNum(nm, best.nm).c < 0){
        best = { seq, nm };
      }
    }
  }
  return best;
}

/* ============================================================
   RENDU SVG
   ============================================================ */
function renderMolecule(mol, opts={}){
  const { chain=[], subs=[], bad=[], good=[], interactive=false } = opts;

  const numbering = {};
  chain.forEach((id,i)=> numbering[id]=i+1);
  const chainSet = new Set(chain);
  const chainBondKeys = new Set();
  for(let i=0;i<chain.length-1;i++){
    chainBondKeys.add([chain[i],chain[i+1]].sort().join('-'));
  }
  const ringClosed = mol.ringOrder && chain.length === mol.ringOrder.length && sameSet(chain, mol.ringOrder);
  if(ringClosed){
    chainBondKeys.add([chain[0], chain[chain.length-1]].sort().join('-'));
  }

  const pad = 65;
  const xs = mol.atoms.map(a=>a.x);
  const ys = mol.atoms.map(a=>a.y);
  const minX = Math.min(...xs)-pad, maxX = Math.max(...xs)+pad;
  const minY = Math.min(...ys)-pad, maxY = Math.max(...ys)+pad;
  const vw = maxX-minX, vh = maxY-minY;

  let svg = '<svg viewBox="'+minX+' '+minY+' '+vw+' '+vh+'" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">';

  mol.bonds.forEach(bd=>{
    const a1 = mol.atoms.find(a=>a.id===bd[0]);
    const a2 = mol.atoms.find(a=>a.id===bd[1]);
    if(!a1||!a2) return;
    const key = [bd[0],bd[1]].sort().join('-');
    if(!chainBondKeys.has(key)){
      svg += bondPath(a1,a2,bd[2]||1, '#3C3C3C', 3.2, a1.el!=='C'?26:22, a2.el!=='C'?26:22);
    }
  });

  for(let i=0;i<chain.length-1;i++){
    const a1 = mol.atoms.find(a=>a.id===chain[i]);
    const a2 = mol.atoms.find(a=>a.id===chain[i+1]);
    if(!a1||!a2) continue;
    const bond = mol.bonds.find(b=> (b[0]===a1.id && b[1]===a2.id) || (b[0]===a2.id && b[1]===a1.id));
    svg += bondPath(a1,a2,bond ? (bond[2]||1) : 1, '#58CC02', 6, 28, 28);
  }
  if(ringClosed){
    const first = mol.atoms.find(a=>a.id===chain[0]);
    const last = mol.atoms.find(a=>a.id===chain[chain.length-1]);
    if(first && last){
      const bond = mol.bonds.find(b=> (b[0]===first.id && b[1]===last.id) || (b[0]===last.id && b[1]===first.id));
      svg += bondPath(first,last,bond ? (bond[2]||1) : 1, '#58CC02', 6, 28, 28);
    }
  }

  mol.atoms.forEach(a=>{
    const isHetero = a.el !== 'C';
    const inChain = chainSet.has(a.id);
    const isSub = subs.includes(a.id);
    const isBad = bad.includes(a.id);
    const isGood = good.includes(a.id);
    const hitR = isHetero ? 36 : 32;

    let shapeFill = '#3C3C3C', shapeStroke = 'transparent', shapeStrokeW = 0, shapeR = 8;

    if(isHetero){
      const colors = {O:'#FF4B4B', N:'#1CB0F6', Cl:'#0D9488', Br:'#A16207', F:'#EC4899', I:'#9333EA', S:'#FFC800'};
      shapeFill = colors[a.el] || '#CE82FF';
      shapeR = 20; shapeStroke = '#fff'; shapeStrokeW = 3;
    }
    if(inChain){ shapeFill = '#58CC02'; shapeR = isHetero ? 22 : 12; shapeStroke = '#fff'; shapeStrokeW = 3; }
    if(isSub){ shapeFill = '#FFC800'; shapeR = isHetero ? 22 : 12; shapeStroke = '#fff'; shapeStrokeW = 3; }
    if(isBad){ shapeFill = '#FF4B4B'; shapeR = isHetero ? 24 : 14; shapeStroke = '#fff'; shapeStrokeW = 3; }
    if(isGood){ shapeFill = '#58CC02'; shapeR = isHetero ? 24 : 14; shapeStroke = '#fff'; shapeStrokeW = 3; }

    svg += '<g class="atom-hit" '+(interactive?'data-atom="'+a.id+'"':'')+'>';
    svg += '<circle cx="'+a.x+'" cy="'+a.y+'" r="'+hitR+'" fill="transparent"/>';
    svg += '<circle class="atom-shape" cx="'+a.x+'" cy="'+a.y+'" r="'+shapeR+'" fill="'+shapeFill+'" stroke="'+shapeStroke+'" stroke-width="'+shapeStrokeW+'"/>';

    if(isHetero){
      const fs = a.el.length>1 ? 15 : 17;
      svg += '<text x="'+a.x+'" y="'+(a.y+fs/3)+'" text-anchor="middle" font-size="'+fs+'" font-weight="900" fill="#fff" font-family="-apple-system,sans-serif">'+a.el+'</text>';
    }

    if(numbering[a.id]){
      const nx = a.x, ny = a.y - 24;
      svg += '<g><circle cx="'+nx+'" cy="'+ny+'" r="14" fill="#fff" stroke="#58CC02" stroke-width="3"/>';
      svg += '<text x="'+nx+'" y="'+(ny+5)+'" text-anchor="middle" font-size="14" font-weight="900" fill="#58CC02" font-family="-apple-system,sans-serif">'+numbering[a.id]+'</text></g>';
    }
    svg += '</g>';
  });

  svg += '</svg>';
  return svg;
}

function bondPath(a1,a2,order,color,width,r1,r2){
  const dx = a2.x-a1.x, dy = a2.y-a1.y;
  const len = Math.hypot(dx,dy)||1;
  const ux = dx/len, uy = dy/len;
  const px = -uy, py = ux;
  const x1 = a1.x+ux*r1, y1 = a1.y+uy*r1;
  const x2 = a2.x-ux*r2, y2 = a2.y-uy*r2;
  const attr = 'stroke="'+color+'" stroke-width="'+width+'" stroke-linecap="round" fill="none"';
  if(order===1){
    return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" '+attr+'/>';
  }
  if(order===2){
    const off = width*1.7, shrink = 0.22;
    const bx = x2-x1, by = y2-y1;
    const ox = px*off, oy = py*off;
    return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" '+attr+'/>'
         + '<line x1="'+(x1+bx*shrink+ox)+'" y1="'+(y1+by*shrink+oy)+'" x2="'+(x2-bx*shrink+ox)+'" y2="'+(y2-by*shrink+oy)+'" '+attr+'/>';
  }
  const off = width*2.1, shrink = 0.22;
  const bx = x2-x1, by = y2-y1;
  let out = '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" '+attr+'/>';
  [1,-1].forEach(sgn=>{
    const ox = px*off*sgn, oy = py*off*sgn;
    out += '<line x1="'+(x1+bx*shrink+ox)+'" y1="'+(y1+by*shrink+oy)+'" x2="'+(x2-bx*shrink+ox)+'" y2="'+(y2-by*shrink+oy)+'" '+attr+'/>';
  });
  return out;
}

  $app.innerHTML = '';
  $app.appendChild(play);

  document.getElementById('btn-close').onclick = () => showQuitConfirm();
  document.getElementById('btn-verify').onclick = () => verifyStep();
  const rappelBtn = document.getElementById('btn-rappel');
  if(rappelBtn) rappelBtn.onclick = () => showRappel();

  attachStepListeners(step, mol);
  updateVerifyState();
}

/* ============================================================
   RENDU DES ÉTAPES
   ============================================================ */
function renderStep(step, mol){
  const q = state.stepState;

  if(step==='chain'){
    const tapped = q.tapped || [];
    let hintText;
    if(mol.ringOrder){
      hintText = 'Touche tous les atomes du cycle dans l\'ordre, en partant d\'un carbone substitué.';
    } else if(hasMultiple(mol)){
      hintText = 'Elle doit contenir toutes les liaisons multiples · seuls les carbones comptent';
    } else if(hasHetero(mol)){
      hintText = 'Seuls les carbones forment la chaîne · les halogènes sont des substituants';
    } else {
      hintText = 'La plus longue chaîne carbonée · elle doit être continue';
    }
    return {
      title:'Choisis la chaîne principale',
      subtitle: mol.ringOrder
        ? 'Touche les atomes du cycle un par un. Le numéro 1 doit donner les plus petits indices aux substituants.'
        : 'Touche les atomes un par un, dans l\'ordre. Chaque atome reçoit son numéro.',
      hint: hintText,
      molecule: renderMolecule(mol, {chain:tapped, interactive:true}),
      answers:'<div style="text-align:center;color:#AFAFAF;font-weight:800;font-size:13px">'
             +'Atomes sélectionnés : <b style="color:#58CC02" id="chain-count">'+tapped.length+'</b>'
             +(tapped.length>0 ? ' · touche le dernier numéro pour annuler' : '')
             +'</div>'
    };
  }

  if(step==='subs'){
    const selected = q.subs || [];
    return {
      title:'Identifie les substituants',
      subtitle:'Touche tous les atomes qui ne font pas partie de la chaîne principale (ramifications et halogènes).',
      hint:'La chaîne est verte, avec sa numérotation',
      molecule: renderMolecule(mol, {chain:state.chainSequence, subs:selected, interactive:true}),
      answers:'<div style="text-align:center;color:#AFAFAF;font-weight:800;font-size:13px">'
             +'Atomes sélectionnés : <b style="color:#FFC800" id="subs-count">'+selected.length+'</b>'
             +'</div>'
    };
  }

  if(step==='name'){
    const pool = buildNamePool(mol);
    const selected = q.namePieces || [];
    const usedSet = new Set(selected);
    let poolHTML = '';
    pool.forEach(tok=>{
      const used = usedSet.has(tok) ? ' used' : '';
      poolHTML += '<button class="chip'+used+'" data-tok="'+escapeHtml(tok)+'">'+escapeHtml(tok)+'</button>';
    });
    let slotHTML = '';
    selected.forEach(tok=>{
      slotHTML += '<span class="piece" data-tok="'+escapeHtml(tok)+'">'+escapeHtml(tok)+'</span>';
    });
    return {
      title:'Assemble le nom',
      subtitle:'Touche les morceaux dans le bon ordre pour former le nom IUPAC.',
      hint: hasHetero(mol)
        ? 'Alphabétique : bromo · chloro · éthyl · fluoro · iodo · méthyl'
        : 'N\'oublie pas l\'ordre alphabétique des substituants.',
      molecule: renderMolecule(mol, {chain:state.chainSequence, subs:state.confirmedSubs||[]}),
      answers:
        '<div class="name-slot'+(selected.length===0?' empty':'')+'" id="name-slot">'+slotHTML+'</div>'
        + '<div class="chips" id="chips">'+poolHTML+'</div>'
    };
  }

  return {title:'', subtitle:'', molecule:'', answers:''};
}

/* ============================================================
   INTERACTIONS
   ============================================================ */
function attachStepListeners(step, mol){
  const stage = document.getElementById('stage');

  if(step==='chain'){
    stage.querySelectorAll('[data-atom]').forEach(g=>{
      g.addEventListener('click', ()=>{
        const id = g.dataset.atom;
        const atom = mol.atoms.find(a=>a.id===id);
        if(!atom) return;

        if(atom.el !== 'C'){
          toast('❌ <b>'+atom.el+'</b> est un halogène : il ne peut jamais faire partie de la chaîne principale. C\'est un substituant (préfixe <b>'+HALOGENS[atom.el]+'-</b>).');
          return;
        }
        if(mol.ringOrder && !mol.ringOrder.includes(id)){
          toast('Dans un cycloalcane substitué, la chaîne principale est le cycle : les substituants viennent après.');
          return;
        }

        const seq = (state.stepState.tapped || []).slice();
        const idx = seq.indexOf(id);
        if(idx >= 0){
          state.stepState.tapped = seq.slice(0, idx);
        } else if(seq.length === 0){
          state.stepState.tapped = [id];
        } else {
          const last = seq[seq.length-1];
          const bonded = mol.bonds.some(b=>
            (b[0]===last && b[1]===id) || (b[1]===last && b[0]===id));
          if(bonded) state.stepState.tapped = [...seq, id];
        }
        const tapped = state.stepState.tapped || [];
        stage.innerHTML = renderMolecule(mol, {chain:tapped, interactive:true});
        attachStepListeners('chain', mol);
        const cnt = document.getElementById('chain-count');
        if(cnt) cnt.textContent = tapped.length;
        updateVerifyState();
      });
    });
  }

  if(step==='subs'){
    stage.querySelectorAll('[data-atom]').forEach(g=>{
      g.addEventListener('click', ()=>{
        const id = g.dataset.atom;
        const chainSet = new Set(state.chainSequence);
        if(chainSet.has(id)) return;

        const arr = (state.stepState.subs || []).slice();
        const idx = arr.indexOf(id);
        if(idx>=0) arr.splice(idx,1);
        else arr.push(id);
        state.stepState.subs = arr;

        stage.innerHTML = renderMolecule(mol, {chain:state.chainSequence, subs:arr, interactive:true});
        attachStepListeners('subs', mol);
        const cnt = document.getElementById('subs-count');
        if(cnt) cnt.textContent = arr.length;
        updateVerifyState();
      });
    });
  }

  if(step==='name'){
    const chipsBox = document.getElementById('chips');
    const slot = document.getElementById('name-slot');

    const refreshSlot = () => {
      const arr = (state.stepState.namePieces || []);
      const usedSet = new Set(arr);
      chipsBox.querySelectorAll('.chip').forEach(c=>{
        c.classList.toggle('used', usedSet.has(c.dataset.tok));
      });
      slot.innerHTML = '';
      arr.forEach(tok=>{
        const piece = el('<span class="piece">'+escapeHtml(tok)+'</span>');
        piece.addEventListener('click', ()=>{
          const cur = (state.stepState.namePieces || []).slice();
          const i = cur.indexOf(tok);
          if(i >= 0) cur.splice(i, 1);
          state.stepState.namePieces = cur;
          refreshSlot();
          updateVerifyState();
        });
        slot.appendChild(piece);
      });
      slot.classList.toggle('empty', arr.length === 0);
    };

    chipsBox.querySelectorAll('.chip').forEach(c=>{
      c.addEventListener('click', ()=>{
        const tok = c.dataset.tok;
        const arr = (state.stepState.namePieces || []).slice();
        if(arr.includes(tok)) return;
        arr.push(tok);
        state.stepState.namePieces = arr;
        refreshSlot();
        updateVerifyState();
      });
    });
    refreshSlot();
  }
}

function updateVerifyState(){
  const btn = document.getElementById('btn-verify');
  if(!btn) return;
  const step = state.steps[state.stepIdx];
  const q = state.stepState;
  const mol = currentMol();
  let ready = false;
  if(step==='chain'){
    ready = mol.ringOrder
      ? (q.tapped||[]).length === mol.ringOrder.length
      : (q.tapped||[]).length >= 2;
  }
  else if(step==='subs') ready = (q.subs||[]).length >= 1;
  else if(step==='name') ready = (q.namePieces||[]).length >= 1;
  btn.disabled = !ready;
}

/* ============================================================
   VÉRIFICATION
   ============================================================ */
function verifyStep(){
  const step = state.steps[state.stepIdx];
  const mol = currentMol();
  const q = state.stepState;

  let ok = false, title = '', text = '', hint = '', diag = '';

  if(step==='chain'){
    const tapped = q.tapped || [];

    if(mol.ringOrder){
      const isComplete = sameSet(tapped, mol.ringOrder);
      const isCycle = isComplete && isValidCycle(mol, tapped);

      if(!isComplete){
        diag = 'Sélection de chaîne';
        title = 'Cycle incomplet';
        text = 'Tu dois sélectionner <b>tous</b> les atomes du cycle ('+mol.ringOrder.length+').';
        hint = 'Touche tous les carbones du cycle, un par un, sans en oublier.';
      } else if(!isCycle){
        diag = 'Sélection de chaîne';
        title = 'Ce n\'est pas un cycle valide';
        text = 'Les atomes doivent être reliés les uns aux autres en boucle, dans l\'ordre.';
      } else {
        const userN = numberingOf(mol, tapped);
        const best = bestRingNumbering(mol);
        const r = cmpNum(userN, best.nm);
        if(r.c === 0){
          ok = true;
          title = 'Bien joué !';
          text = 'Cycle numéroté correctement.';
          if(best.nm.subLocs.length) text += ' Positions des substituants : <b>'+best.nm.subLocs.join(', ')+'</b>.';
          state.chainSequence = tapped;
        } else {
          diag = 'Direction';
          if(r.reason === 'alpha'){
            title = 'Égalité des indices… départage alphabétique';
            text = 'Les deux sens donnent les mêmes indices (<b>'+userN.subLocs.join(',')+'</b>). Le substituant cité en premier par ordre alphabétique reçoit le plus petit indice.';
            diag = 'Ordre alphabétique';
            hint = 'bromo &lt; chloro &lt; éthyl &lt; fluoro &lt; iodo &lt; méthyl.';
          } else {
            title = 'Mauvais sens ou mauvais départ';
            text = 'Numérote le cycle à partir d\'un carbone substitué, dans le sens qui donne les <b>plus petits indices</b>.';
            hint = 'Commence par l\'extrémité donnant les plus petits indices ('+userN.subLocs.join(',')+' vs '+best.nm.subLocs.join(',')+').';
          }
        }
      }
    } else {
      const vc = getValidChains(mol);
      const isValidChain = vc.chains.some(c => sameSet(tapped, c));
      if(!isValidChain){
        diag = 'Sélection de chaîne';
        let multInChain = 0;
        for(let i=0;i<tapped.length-1;i++){
          const b = mol.bonds.find(bd => (bd[0]===tapped[i] && bd[1]===tapped[i+1]) || (bd[1]===tapped[i] && bd[0]===tapped[i+1]));
          if(b && (b[2]||1)>1) multInChain++;
        }
        if(multInChain < vc.maxMult){
          title = 'Il manque une insaturation';
          text = 'La chaîne principale doit contenir le <b>maximum de liaisons multiples</b> (C=C, C≡C), même si une autre chaîne est plus longue.';
          hint = 'Cette molécule contient '+vc.maxMult+' liaison(s) multiple(s) à inclure dans la chaîne.';
        } else {
          title = 'Ce n\'est pas la chaîne principale';
          text = 'La chaîne principale est la <b>plus longue chaîne carbonée</b> continue (carbones uniquement).';
          hint = 'La plus longue chaîne contient '+vc.maxLen+' carbones. Vérifie que tous tes atomes sont reliés par des liaisons.';
        }
      } else {
        const reversed = tapped.slice().reverse();
        const A = numberingOf(mol, tapped);
        const B = numberingOf(mol, reversed);
        const r = cmpNum(A, B);
        if(r.c <= 0){
          ok = true;
          title = 'Bien joué !';
          text = 'Chaîne principale : <b>'+tapped.length+'</b> carbones.';
          const bits = [];
          if(A.unsat.length) bits.push('insaturations en <b>'+A.unsat.join(', ')+'</b>');
          if(A.subs.length) bits.push('substituants en <b>'+A.subLocs.join(', ')+'</b>');
          if(bits.length) text += ' Numérotation : '+bits.join(' · ')+'.';
          else text += ' Aucune ramification.';
          state.chainSequence = tapped;
        } else {
          diag = 'Direction';
          if(r.reason === 'unsat'){
            if(cmpLocants(A.subLocs, B.subLocs) < 0 && A.subs.length){
              title = 'Les insaturations d\'abord !';
              text = 'Les liaisons multiples ont priorité sur les ramifications pour la numérotation.';
              hint = 'Insaturations : '+A.unsat.join(',')+' (ton sens) vs '+B.unsat.join(',')+' (autre sens). Les substituants ('+A.subLocs.join(',')+' vs '+B.subLocs.join(',')+') ne comptent que si les insaturations sont à égalité.';
            } else {
              title = 'Presque… mais mauvais sens';
              text = 'Commence par l\'extrémité qui donne les <b>plus petits indices</b> à l\'ensemble des insaturations.';
              hint = 'Commence par l\'extrémité donnant les plus petits indices ('+B.unsat.join(',')+' vs '+A.unsat.join(',')+').';
            }
          } else if(r.reason === 'ene'){
            title = 'Égalité stricte : qui est prioritaire ?';
            text = 'En cas d\'égalité stricte, la double liaison (-ène) a priorité sur la triple liaison (-yne).';
            hint = 'Les deux sens donnent le même ensemble ('+A.unsat.join(',')+'). Ton sens place la double liaison en '+(A.enes.join(',')||'?')+', l\'autre en '+(B.enes.join(',')||'?')+'.';
          } else if(r.reason === 'subs'){
            title = 'Presque… mais mauvais sens';
            text = 'Commence par l\'autre extrémité pour obtenir les <b>plus petits indices</b>.';
            hint = 'Commence par l\'extrémité donnant les plus petits indices ('+B.subLocs.join(',')+' vs '+A.subLocs.join(',')+').';
          } else {
            diag = 'Ordre alphabétique';
            title = 'Égalité des indices : l\'alphabet décide';
            text = 'Les deux sens donnent les mêmes indices (<b>'+A.subLocs.join(',')+'</b>). Le substituant cité en premier par ordre alphabétique reçoit le plus petit indice.';
            hint = 'bromo &lt; chloro &lt; éthyl &lt; fluoro &lt; iodo &lt; méthyl.';
          }
        }
      }
    }
  }

  else if(step==='subs'){
    const selected = q.subs || [];
    const chainSet = new Set(state.chainSequence);
    const expected = mol.atoms.filter(a => !chainSet.has(a.id)).map(a => a.id);

    if(sameSet(selected, expected)){
      ok = true;
      title = 'Parfait !';
      const subsFound = getSubstituents(mol, state.chainSequence);
      text = 'Substituants identifiés : <b>'+subsFound.map(s=>s.name+' (C'+s.loc+')').join(', ')+'</b>.';
    } else {
      diag = 'Substituants';
      title = 'Pas tout à fait';
      const missing = expected.filter(b=>!selected.includes(b));
      const extra = selected.filter(s=>!expected.includes(s));
      text = 'Vérifie quels atomes ne font pas partie de la chaîne principale (halogènes compris).';
      if(missing.length) hint = 'Il en manque '+missing.length+'. ';
      if(extra.length) hint += 'Tu en as sélectionné '+extra.length+' en trop.';
    }
  }

  else if(step==='name'){
    const pieces = q.namePieces || [];
    const proposed = pieces.join('').toLowerCase().replace(/\s/g,'');
    const correct = mol.name.toLowerCase().replace(/\s/g,'');
    if(proposed === correct){
      ok = true;
      title = 'Excellent !';
      text = 'Le nom est bien <b>'+mol.name+'</b>.';
    } else {
      title = 'Presque…';
      text = 'La bonne réponse était <b>'+mol.name+'</b>.';
      const sortedP = pieces.slice().sort().join('|');
      const sortedC = mol.tokens.slice().sort().join('|');
      if(sortedP === sortedC){
        diag = 'Ordre alphabétique';
        hint = 'Tous les bons morceaux, mais dans le mauvais ordre. Substituants par ordre alphabétique (bromo, chloro, éthyl, fluoro, iodo, méthyl), puis la chaîne, puis les insaturations.';
      } else {
        diag = 'Assemblage du nom';
        hint = 'Compare les morceaux : commence toujours par les substituants (ordre alphabétique), puis le nom de la chaîne, puis le(s) suffixe(s) d\'insaturation.';
      }
    }
  }

  if(!ok){
    state.mistakes = (state.mistakes||0) + 1;
    state.hearts = Math.max(0, state.hearts - 1);
    saveAll();
    if(state.hearts <= 0){
      showHeartsOut();
      return;
    }
  }

  showSheet({ ok, title, text, hint, diag, onContinue: ok ? nextStep : null });
}

/* ============================================================
   FEEDBACK
   ============================================================ */
function showSheet({ok, title, text, hint, diag, onContinue}){
  const wrap = el(
    '<div class="sheet-wrap">'
    + '<div class="sheet '+(ok?'good':'bad')+'">'
    +   '<div class="sheet-icon">'+(ok?'✓':'✕')+'</div>'
    +   (!ok && diag ? '<div style="text-align:center;margin-bottom:10px"><span class="diag">Diagnostic : '+diag+'</span></div>' : '')
    +   '<div class="sheet-title">'+title+'</div>'
    +   '<div class="sheet-text">'+text+'</div>'
    +   (hint ? '<div class="sheet-hint">💡 '+hint+'</div>' : '')
    +   '<div class="sheet-actions">'
    +     '<button class="btn-3d" id="sheet-btn">'+(onContinue ? 'Continuer' : 'Réessayer')+'</button>'
    +   '</div>'
    + '</div>'
    + '</div>'
  );
  document.body.appendChild(wrap);

  wrap.querySelector('#sheet-btn').addEventListener('click', ()=>{
    wrap.remove();
    if(onContinue) onContinue();
    else {
      state.stepState = {};
      renderPlay();
    }
  });
}

function showHeartsOut(){
  const wrap = el(
    '<div class="sheet-wrap">'
    + '<div class="sheet bad">'
    +   '<div class="sheet-icon">💔</div>'
    +   '<div class="sheet-title">Plus de cœurs !</div>'
    +   '<div class="sheet-text">Tu as utilisé tous tes cœurs. Reviens plus tard pour réessayer.</div>'
    +   '<div class="sheet-actions"><button class="btn-3d" id="sheet-btn">Retour aux missions</button></div>'
    + '</div>'
    + '</div>'
  );
  document.body.appendChild(wrap);
  wrap.querySelector('#sheet-btn').addEventListener('click', ()=>{
    wrap.remove();
    state.hearts = 5;
    saveAll();
    renderHome();
  });
}

/* ============================================================
   RAPPEL
   ============================================================ */
const PREFIXES = [
  [1,'Méth-'],[2,'Éth-'],[3,'Prop-'],[4,'But-'],
  [5,'Pent-'],[6,'Hex-'],[7,'Hept-'],[8,'Oct-'],
  [9,'Non-'],[10,'Déc-'],[11,'Undéc-'],[12,'Dodéc-']
];

function showRappel(){
  let gridHTML = '';
  PREFIXES.forEach(([n,txt])=>{
    gridHTML += '<div class="prefix-item"><span class="num">'+n+'</span><span class="txt">'+txt+'</span></div>';
  });
  const world = WORLDS[state.worldIdx];
  const tipHTML = world.tip
    ? '<div class="tipbox">📌 <b>Règle de l\'étape</b><br>'+world.tip+'</div>'
    : '';

  const wrap = el(
    '<div class="sheet-wrap">'
    + '<div class="sheet neutral">'
    +   '<div class="sheet-icon" style="color:#1CB0F6">📖</div>'
    +   '<div class="sheet-title">Rappel</div>'
    +   tipHTML
    +   '<div class="sheet-text" style="color:#AFAFAF;margin-top:16px">Nombre de carbones dans la chaîne principale</div>'
    +   '<div class="prefix-grid">'+gridHTML+'</div>'
    +   '<div class="sheet-hint" style="background:#F7F7F7;color:#4B4B4B;margin-top:16px">'
    +     '💡 <b>Astuce :</b> pour un cycle, commence la numérotation à un carbone portant un substituant, puis va dans le sens qui donne les plus petits indices.'
    +   '</div>'
    +   '<div class="sheet-actions"><button class="btn-3d" id="sheet-btn">Fermer</button></div>'
    + '</div>'
    + '</div>'
  );
  document.body.appendChild(wrap);
  wrap.querySelector('#sheet-btn').addEventListener('click', ()=> wrap.remove());
  wrap.addEventListener('click', (e)=>{ if(e.target === wrap) wrap.remove(); });
}

/* ============================================================
   CONFIRMATION DE SORTIE
   ============================================================ */
function showQuitConfirm(){
  const wrap = el(
    '<div class="sheet-wrap">'
    + '<div class="sheet neutral">'
    +   '<div class="sheet-icon" style="color:#FF4B4B">⚠️</div>'
    +   '<div class="sheet-title">Quitter le niveau ?</div>'
    +   '<div class="sheet-text" style="color:#4B4B4B">Ta progression dans ce niveau sera perdue.</div>'
    +   '<div class="sheet-actions" style="display:flex;gap:10px">'
    +     '<button class="btn-3d btn-secondary" id="btn-cancel" style="flex:1">Continuer</button>'
    +     '<button class="btn-3d btn-red" id="btn-quit" style="flex:1">Quitter</button>'
    +   '</div>'
    + '</div>'
    + '</div>'
  );
  document.body.appendChild(wrap);
  wrap.querySelector('#btn-cancel').addEventListener('click', ()=> wrap.remove());
  wrap.querySelector('#btn-quit').addEventListener('click', ()=>{ wrap.remove(); renderHome(); });
  wrap.addEventListener('click', (e)=>{ if(e.target === wrap) wrap.remove(); });
}

/* ============================================================
   ENCHAÎNEMENT
   ============================================================ */
function nextStep(){
  if(state.steps[state.stepIdx] === 'subs'){
    state.confirmedSubs = state.stepState.subs || [];
  }
  state.stepIdx++;
  if(state.stepIdx >= state.steps.length){
    finishLevel();
  } else {
    state.stepState = {};
    renderPlay();
  }
}

function finishLevel(){
  const world = WORLDS[state.worldIdx];
  const key = world.id+':'+state.levelIdx;
  const stars = state.mistakes === 0 ? 3 : state.mistakes === 1 ? 2 : 1;
  const prev = state.progress[key];
  state.progress[key] = { done:true, stars: Math.max(stars, prev?.stars||0) };
  saveAll();

  const mol = MOLECULES[world.levels[state.levelIdx].mol];
  const starsStr = '★'.repeat(stars) + '☆'.repeat(3-stars);
  const isRandom = state.random;
  const curW = state.worldIdx, curL = state.levelIdx;
  const hasNext = isRandom || curL < world.levels.length-1;
  const nextLabel = isRandom ? 'Défi suivant 🎲' : (hasNext ? 'Suivant →' : 'Terminer');

  const wrap = el(
    '<div class="sheet-wrap">'
    + '<div class="sheet good">'
    +   '<div class="sheet-icon">🏆</div>'
    +   '<div class="sheet-title">Niveau terminé !</div>'
    +   '<div class="sheet-text">Tu maîtrises <b>'+escapeHtml(mol.name)+'</b></div>'
    +   '<div style="text-align:center;font-size:34px;color:#FFC800;letter-spacing:8px;margin:16px 0 4px">'+starsStr+'</div>'
    +   '<div class="sheet-actions" style="display:flex;gap:10px">'
    +     '<button class="btn-3d btn-secondary" id="btn-home" style="flex:1">Missions</button>'
    +     '<button class="btn-3d'+(isRandom?' btn-gold':'')+'" id="btn-next" style="flex:1">'+nextLabel+'</button>'
    +   '</div>'
    + '</div>'
    + '</div>'
  );
  document.body.appendChild(wrap);
  wrap.querySelector('#btn-home').addEventListener('click', ()=>{ wrap.remove(); renderHome(); });
  wrap.querySelector('#btn-next').addEventListener('click', ()=>{
    wrap.remove();
    if(isRandom) startRandom(curW, curL);            /* autre défi ALÉATOIRE */
    else if(hasNext) openLevel(curW, curL+1, false);  /* niveau suivant de la liste */
    else renderHome();
  });
}

/* ============================================================
   LANCEMENT
   ============================================================ */
renderHome();
</script>
